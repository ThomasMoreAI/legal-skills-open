display_name: "PSC - Piano di Sicurezza e Coordinamento (D.Lgs 81/2008 art. 100 + Allegato XV)"
short_description: Supporto documentale al coordinatore per la sicurezza in fase di progettazione (CSP) e in fase di esecuzione (CSE) per la redazione e la verifica di completezza del Piano di Sicurezza e Coordinamento (PSC) nei cantieri temporanei o mobili secondo il D.Lgs 81/2008, art. 100 e Allegato XV. Aiuta a inquadrare l'obbligo e la titolarita' del PSC (nei cantieri con presenza di piu' imprese esecutrici anche non contemporanea il committente nomina CSP e CSE; il CSP redige il PSC ex art. 91, il CSE lo verifica e adegua ex art. 92); l'articolo 100 (il PSC e' relazione tecnica e prescrizioni con la stima dei costi del punto 4 dell'Allegato XV, corredato da tavole tra cui almeno una planimetria; e' parte integrante del contratto; copia ai rappresentanti dei lavoratori per la sicurezza almeno dieci giorni prima dell'inizio dei lavori); i contenuti minimi del punto 2.1.2 dell'Allegato XV (identificazione e descrizione dell'opera; soggetti con compiti di sicurezza; relazione di analisi e valutazione dei rischi concreti su area, organizzazione e lavorazioni con le loro interferenze; scelte progettuali e organizzative, procedure e misure preventive e protettive; prescrizioni operative e DPI per le interferenze; misure di coordinamento per l'uso comune; cooperazione e coordinamento; pronto soccorso, antincendio ed evacuazione; durata e cronoprogramma dei lavori ed entita' del cantiere in uomini-giorno; stima dei costi); i contenuti in riferimento all'area, all'organizzazione del cantiere e alle lavorazioni e interferenze (punti 2.2 e 2.3); e la stima dei costi della sicurezza del punto 4.1 (apprestamenti, misure e DPI per interferenze, impianti di terra e antincendio ed evacuazione fumi, mezzi di protezione collettiva, procedure, interventi di sfasamento, misure di coordinamento; stima congrua e analitica, non soggetta a ribasso, liquidata dal direttore dei lavori su approvazione del CSE). NON redige il piano al posto del coordinatore ne' esegue la valutazione dei rischi del cantiere. E' distinta dalla skill sul POS (Allegato XV punto 3.2) e da quella sui ruoli dei coordinatori (artt. 89-92).
default_prompt: |
  Devo redigere/verificare un Piano di Sicurezza e Coordinamento (PSC) per un cantiere con più imprese secondo il
  D.Lgs 81/2008 (art. 100 e Allegato XV). Quando è obbligatorio il PSC e chi lo redige? Quali sono i contenuti minimi
  (punto 2.1.2 lett. a-l) e cosa deve contenere in riferimento all'area, all'organizzazione del cantiere e alle
  interferenze tra lavorazioni? Come si imposta la stima dei costi della sicurezza (punto 4.1) e perché non è
  soggetta a ribasso? Cita gli articoli e i punti dell'Allegato XV.
