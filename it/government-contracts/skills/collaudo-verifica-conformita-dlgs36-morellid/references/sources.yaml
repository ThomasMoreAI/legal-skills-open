    accessed: 2026-08-25
    sha256: 1131f5ce3b7b807e2627a33b51069bc79b377600f0293cf9a60441026b10c058
    license: public-domain
    binary_path: not_in_repo/gu-192-2026-08-20.pdf
    md_path: references/fonti/l-152-2026-gu-192.md
    excerpt_path: references/estratti/l-152-2026-sospensione-recupero-anticipazione.md
    notes: |
      Codice redazionale 26G00165 (legge di conversione, pag. 1 del fascicolo).
      Il binario hashato e' il PDF integrale del fascicolo GU Serie generale n. 192
      del 20-8-2026, che contiene sia la legge di conversione con il suo Allegato
      ("MODIFICAZIONI APPORTATE IN SEDE DI CONVERSIONE AL DECRETO-LEGGE 26 GIUGNO
      2026, N. 107", pag. 2), sia il testo coordinato del D.L. 107/2026 (codice
      redazionale 26A04179, pag. 42). L'art. 1-bis e' a pag. 49 del fascicolo,
      seguito nei "Riferimenti normativi" dal testo integrale dell'art. 125 del
      D.Lgs. 36/2023 (Anticipazione, modalita' e termini di pagamento del
      corrispettivo), anch'esso trascritto nel md_path.
      Rilievo per questa skill: l'art. 125, comma 7, lega il certificato di
      pagamento della RATA DI SALDO all'esito positivo del collaudo o della
      verifica di conformita'; se il recupero dell'anticipazione e' stato sospeso
      ex art. 1-bis, la quota non recuperata incide sulla chiusura contabile alla
      data del collaudo. La deroga riguarda i soli APPALTI DI LAVORI IN CORSO DI
      ESECUZIONE, scade il 31 dicembre 2026 ed esclude gli interventi finanziati in
      tutto o in parte con risorse PNRR.
      Entrata in vigore della legge di conversione: 21 agosto 2026 (art. 1, c. 2).
