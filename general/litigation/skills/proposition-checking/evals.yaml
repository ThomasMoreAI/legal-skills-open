evals:
  - mode: user_supplied_source
    prompt: >
      Draft says: "The email terminated the contract." Source text says: "We reserve all rights if delivery is not made by Friday." Check support.
    must_include:
      - confidence
      - partially_supported
      - exact source excerpt
      - suggested narrowing or source request
      - dependency risk if material
    must_not_include:
      - fully supported
  - mode: no_source
    prompt: >
      Check whether this proposition is supported by Wood v Capita, but I have not supplied the judgment and you have no source access.
    must_include:
      - confidence
      - unverified_source_unavailable
      - no source text
      - do not assess from model memory
    must_not_include:
      - supports the proposition
      - holding summary from memory
