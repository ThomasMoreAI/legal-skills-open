  fuente_texto: 07_corpus_ia/textos-completos/texto-oficial-NOR-006-rd-243-2022.txt
  nota: Contrastado con el texto consolidado del BOE (BOE-A-2022-5521) el 2026-08-22.
  parrafos:
  - text: El presente real decreto entrará en vigor el día siguiente al de su publicación
      en el «Boletín Oficial del Estado».
- id: NOR-080
  tipo: disposicion_adicional
  ordinal: primera
  num: Disposición adicional primera.
  heading: Centro de Innovación y Tecnificación de Alto Rendimiento (CITAR).
  work_uri: /akn/es/act/2023-07-18/659
  frbr_name: Real Decreto
  frbr_number: '659'
  country: es
  work_date: '2023-07-18'
  expression_date: '2023-07-22'
  author_eid: gobierno-espana
  author_href: https://www.boe.es/
  author_show: Gobierno de España
  fuente_texto: https://www.boe.es/eli/es/rd/2023/07/18/659/con
  nota: Texto original de 22/07/2023; la corrección de errores del BOE núm. 124, de
    23/05/2025 no afecta a estos bloques.
  parrafos:
  - text: El Centro de Innovación y Tecnificación de Alto Rendimiento de la Formación
      Profesional (CITAR), desarrollará las funciones previstas en el Real Decreto
      498/2020, de 28 de abril, por el que se desarrolla la estructura orgánica básica
      del Ministerio de Educación y Formación Profesional, o norma que lo sustituya.
- id: NOR-080
  tipo: disposicion_adicional
  ordinal: segunda
  num: Disposición adicional segunda.
  heading: Ofertas del Centro para la Innovación y Desarrollo de la Educación a Distancia
    (CIDEAD).
  work_uri: /akn/es/act/2023-07-18/659
  frbr_name: Real Decreto
  frbr_number: '659'
  country: es
  work_date: '2023-07-18'
  expression_date: '2023-07-22'
  author_eid: gobierno-espana
  author_href: https://www.boe.es/
  author_show: Gobierno de España
  fuente_texto: https://www.boe.es/eli/es/rd/2023/07/18/659/con
  parrafos:
  - text: El Gobierno, en el marco de la regulación establecida en el presente real
      decreto, determinará las características específicas de la oferta de acciones
      formativas del Sistema de Formación Profesional que se realicen a través del
      Centro para la Innovación y Desarrollo de la Educación a Distancia (CIDEAD).
- id: NOR-080
  tipo: disposicion_adicional
  ordinal: tercera
  num: Disposición adicional tercera.
  heading: Colaboración entre los centros de Formación Profesional y los centros universitarios.
  work_uri: /akn/es/act/2023-07-18/659
  frbr_name: Real Decreto
  frbr_number: '659'
  country: es
  work_date: '2023-07-18'
  expression_date: '2023-07-22'
  author_eid: gobierno-espana
  author_href: https://www.boe.es/
  author_show: Gobierno de España
  fuente_texto: https://www.boe.es/eli/es/rd/2023/07/18/659/con
  parrafos:
  - text: Mediante los instrumentos normativos o jurídicos que correspondan, y sin
      perjuicio de las competencias de las administraciones educativas y de las universidades,
      los ministerios de Educación y Formación Profesional, y de Universidades, promoverán
      la colaboración entre los centros de formación profesional y los centros universitarios
      con el objeto de desarrollar nuevos modelos de relaciones entre el tejido productivo,
      las universidades y la formación profesional, con el fin de crear innovación
      científica y empresarial y optimizar recursos.
- id: NOR-080
  tipo: disposicion_adicional
  ordinal: cuarta
  num: Disposición adicional cuarta.
  heading: Acceso a los estudios de grado universitario de los titulados de Formación
    Profesional de Grado Superior.
  work_uri: /akn/es/act/2023-07-18/659
  frbr_name: Real Decreto
  frbr_number: '659'
  country: es
  work_date: '2023-07-18'
  expression_date: '2023-07-22'
  author_eid: gobierno-espana
  author_href: https://www.boe.es/
  author_show: Gobierno de España
  fuente_texto: https://www.boe.es/eli/es/rd/2023/07/18/659/con
  parrafos:
  - text: Los egresados de formación profesional de grado superior que quisieran acceder
      a los estudios de grado universitario, mejorando la calificación obtenida para
      dicho acceso en el ciclo formativo que han cursado, podrán concurrir a las pruebas
      de acceso a la universidad, de acuerdo con la normativa reguladora de dichas
      pruebas.
- id: NOR-080
  tipo: disposicion_adicional
  ordinal: septima
  num: Disposición adicional séptima.
  heading: Ratio alumnado/profesorado en ofertas de grados D y E.
  work_uri: /akn/es/act/2023-07-18/659
  frbr_name: Real Decreto
  frbr_number: '659'
  country: es
  work_date: '2023-07-18'
  expression_date: '2023-07-22'
  author_eid: gobierno-espana
  author_href: https://www.boe.es/
  author_show: Gobierno de España
  fuente_texto: https://www.boe.es/eli/es/rd/2023/07/18/659/con
  parrafos:
  - num: '1.'
    text: Las administraciones competentes reducirán progresivamente, en las distintas
      ofertas de formación profesional de grados D y E, preferentemente las que requieran
      el uso de aulas-taller, laboratorios, y otros espacios singulares de trabajo,
      la ratio de alumnado en modalidad presencial hasta el máximo de veinticinco
      alumnos por profesor, para los ciclos formativos de Grado Medio, de Grado Superior
      y Cursos de Especialización, y hasta un máximo de veinte alumnos por profesor
      o profesora para los ciclos formativos de Grado Básico con las mismas características,
      debiendo alcanzarse dicha ratio al inicio del curso 2028-2029.
  - num: '2.'
    text: En la impartición de módulos profesionales que por sus espacios, recursos
      y materiales a manejar lo aconsejen, las administraciones podrán establecer
      desdobles con el fin de garantizar una enseñanza de calidad y la adecuada atención
      educativa y formativa.
- id: NOR-080
  tipo: disposicion_adicional
  ordinal: novena
  num: Disposición adicional novena.
  heading: Exigencia de la experiencia profesional requerida al personal formador
    en el ámbito de los certificados de profesionalidad en vigor.
  work_uri: /akn/es/act/2023-07-18/659
  frbr_name: Real Decreto
  frbr_number: '659'
  country: es
  work_date: '2023-07-18'
  expression_date: '2023-07-22'
  author_eid: gobierno-espana
  author_href: https://www.boe.es/
  author_show: Gobierno de España
  fuente_texto: https://www.boe.es/eli/es/rd/2023/07/18/659/con
  parrafos:
  - text: No será exigible como requisito imprescindible sino como mérito la experiencia
      profesional a los formadores y formadoras para impartir docencia en los certificados
      de profesionalidad regulados con anterioridad a la entrada en vigor del presente
      real decreto, cuando cuenten con la acreditación o titulación requerida que
      figura en cada uno de los reales decretos por los que se establece cada Certificado
      de profesionalidad.
- id: NOR-080
  tipo: disposicion_adicional
  ordinal: decima
  num: Disposición adicional décima.
  heading: Equivalencia de los certificados de profesionalidad.
  work_uri: /akn/es/act/2023-07-18/659
  frbr_name: Real Decreto
  frbr_number: '659'
  country: es
  work_date: '2023-07-18'
  expression_date: '2023-07-22'
  author_eid: gobierno-espana
  author_href: https://www.boe.es/
  author_show: Gobierno de España
  fuente_texto: https://www.boe.es/eli/es/rd/2023/07/18/659/con
  parrafos:
  - num: '1.'
    text: Los certificados de profesionalidad de nivel 1 expedidos con arreglo a la
      regulación prevista en el Real Decreto 34/2008, de 18 de enero, por el que se
      regulan los certificados de profesionalidad, se consideran equivalentes a todos
      los efectos, profesionales y de acceso a empleos públicos y privados a los certificados
      profesionales de nivel 1.
  - num: '2.'
    text: Los certificados de profesionalidad de nivel 2 expedidos con arreglo a la
      regulación prevista en el Real Decreto 34/2008, se consideran equivalentes a
      todos los efectos, profesionales y de acceso a empleos públicos y privados a
      los certificados profesionales de nivel 2.
  - num: '3.'
    text: Los certificados de profesionalidad de nivel 3 expedidos con arreglo a la
      regulación prevista en el Real Decreto 34/2008, se consideran equivalentes a
      todos los efectos profesionales y de acceso a empleos públicos y privados a
      los certificados profesionales de nivel 3.
- id: NOR-080
  tipo: disposicion_adicional
  ordinal: duodecima
  num: Disposición adicional duodécima.
  heading: Actualización de los títulos de formación profesional anteriores a la entrada
    en vigor del presente real decreto.
  work_uri: /akn/es/act/2023-07-18/659
  frbr_name: Real Decreto
  frbr_number: '659'
  country: es
  work_date: '2023-07-18'
  expression_date: '2023-07-22'
  author_eid: gobierno-espana
  author_href: https://www.boe.es/
  author_show: Gobierno de España
  fuente_texto: https://www.boe.es/eli/es/rd/2023/07/18/659/con
  parrafos:
  - text: Las actualizaciones necesarias para los títulos de Formación Profesional
      existentes con anterioridad a la entrada en vigor del presente real decreto,
      se realizará de acuerdo con la normativa vigente.
- id: NOR-080
  tipo: disposicion_adicional
  ordinal: decimotercera
  num: Disposición adicional decimotercera.
  heading: Incentivo para el acceso de la población activa al procedimiento de acreditación
    de competencias profesionales adquiridas por la experiencia laboral y otras vías
    no formales de formación.
  work_uri: /akn/es/act/2023-07-18/659
  frbr_name: Real Decreto
  frbr_number: '659'
  country: es
  work_date: '2023-07-18'
  expression_date: '2023-07-22'
  author_eid: gobierno-espana
  author_href: https://www.boe.es/
  author_show: Gobierno de España
  fuente_texto: https://www.boe.es/eli/es/rd/2023/07/18/659/con
  parrafos:
  - text: Las administraciones competentes podrán establecer incentivos para las personas
      que accedan a los procedimientos de acreditación previstos en el título VI del
      presente real decreto.
- id: NOR-080
  tipo: disposicion_adicional
  ordinal: decimoctava
  num: Disposición adicional decimoctava.
  heading: Conferencia Sectorial de Formación Profesional para Personas Trabajadoras.
  work_uri: /akn/es/act/2023-07-18/659
  frbr_name: Real Decreto
  frbr_number: '659'
  country: es
  work_date: '2023-07-18'
  expression_date: '2023-07-22'
  author_eid: gobierno-espana
  author_href: https://www.boe.es/
  author_show: Gobierno de España
  fuente_texto: https://www.boe.es/eli/es/rd/2023/07/18/659/con
  parrafos:
  - text: La Conferencia Sectorial del Sistema de Cualificaciones y Formación Profesional
      para el Empleo, constituida e inscrita en el Registro electrónico Estatal de
      Órganos e Instrumentos de Cooperación, pasa a denominarse Conferencia Sectorial
      de Formación Profesional para Personas Trabajadoras.
- id: NOR-080
  tipo: disposicion_adicional
  ordinal: vigesima
  num: Disposición adicional vigésima.
  heading: Titulaciones de formación profesional de la familia profesional de Sanidad.
  work_uri: /akn/es/act/2023-07-18/659
  frbr_name: Real Decreto
  frbr_number: '659'
  country: es
  work_date: '2023-07-18'
  expression_date: '2023-07-22'
  author_eid: gobierno-espana
  author_href: https://www.boe.es/
  author_show: Gobierno de España
  fuente_texto: https://www.boe.es/eli/es/rd/2023/07/18/659/con
  parrafos:
  - text: Los títulos de la familia profesional de Sanidad tendrán reserva de denominación
      y no podrán coincidir en su denominación con otros títulos o certificados de
      formación profesional o con títulos universitarios o de especialista en Ciencias
      de la salud que habiliten para el ejercicio de una profesión sanitaria, conforme
      a lo regulado en los artículos 2 y 3 de la Ley 44/2003, de 21 de noviembre,
      de Ordenación de las Profesiones Sanitarias.
- id: NOR-080
  tipo: disposicion_adicional
  ordinal: vigesimaprimera
  num: Disposición adicional vigesimoprimera.
  heading: Centros o entidades de formación acreditados para impartir formación profesional
    para el empleo.
  work_uri: /akn/es/act/2023-07-18/659
  frbr_name: Real Decreto
  frbr_number: '659'
  country: es
  work_date: '2023-07-18'
  expression_date: '2023-07-22'
  author_eid: gobierno-espana
  author_href: https://www.boe.es/
  author_show: Gobierno de España
  fuente_texto: https://www.boe.es/eli/es/rd/2023/07/18/659/con
  parrafos:
  - text: Los centros o entidades de formación públicos o privados acreditados para
      impartir formación profesional para el empleo se consideran autorizados para
      impartir ofertas formativas del Sistema de Formación Profesional de Grado A,
      B y C, en las familias profesionales y especialidades en que estuvieran autorizadas.
- id: NOR-080
  tipo: disposicion_adicional
  ordinal: vigesimasegunda
  num: Disposición adicional vigesimosegunda.
  heading: Impartición de nuevos módulos profesionales en los ciclos formativos de
    Grado D.
  work_uri: /akn/es/act/2023-07-18/659
  frbr_name: Real Decreto
  frbr_number: '659'
  country: es
  work_date: '2023-07-18'
  expression_date: '2023-07-22'
  author_eid: gobierno-espana
  author_href: https://www.boe.es/
  author_show: Gobierno de España
  fuente_texto: https://www.boe.es/eli/es/rd/2023/07/18/659/con
  parrafos:
  - text: Las titulaciones requeridas para impartir los nuevos módulos profesionales
      que conforman los ciclos formativos de Grado D para los centros de titularidad
      privada, de otras administraciones distintas a la educativa y orientaciones
      para la Administración educativa, así como las titulaciones equivalentes a efectos
      de docencia y las especialidades del profesorado con atribución docente en dichos
      módulos profesionales serán reguladas en su normativa específica.
- id: NOR-080
  tipo: disposicion_final
  ordinal: quinta
  num: Disposición final quinta.
  heading: Homologación de titulaciones y acreditaciones extranjeras por sus equivalentes
    españoles en el ámbito de la Formación Profesional.
  work_uri: /akn/es/act/2023-07-18/659
  frbr_name: Real Decreto
  frbr_number: '659'
  country: es
  work_date: '2023-07-18'
  expression_date: '2023-07-22'
  author_eid: gobierno-espana
  author_href: https://www.boe.es/
  author_show: Gobierno de España
  fuente_texto: https://www.boe.es/eli/es/rd/2023/07/18/659/con
  parrafos:
  - text: El Gobierno desarrollará reglamentariamente los requisitos y procedimientos
      para la homologación de titulaciones y acreditaciones extranjeras, a que hace
      referencia el artículo 129, por sus equivalentes españolas en el ámbito de la
      Formación Profesional.
- id: NOR-080
  tipo: disposicion_final
  ordinal: septima
  num: Disposición final séptima.
  heading: Habilitación normativa.
  work_uri: /akn/es/act/2023-07-18/659
  frbr_name: Real Decreto
  frbr_number: '659'
  country: es
  work_date: '2023-07-18'
  expression_date: '2023-07-22'
  author_eid: gobierno-espana
  author_href: https://www.boe.es/
  author_show: Gobierno de España
  fuente_texto: https://www.boe.es/eli/es/rd/2023/07/18/659/con
  parrafos:
  - text: Se autoriza a la persona titular del Ministerio de Educación y Formación
      Profesional a dictar, en el ámbito de sus competencias, cuantas disposiciones
      sean necesarias para el desarrollo y ejecución de este real decreto.
- id: NOR-080
