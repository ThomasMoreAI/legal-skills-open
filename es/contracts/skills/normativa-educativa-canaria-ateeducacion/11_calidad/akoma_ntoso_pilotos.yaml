  parrafos:
  - text: 'A efectos de este real decreto, se entenderá por:'
  - num: a)
    text: 'Objetivos: logros que se espera que el alumnado haya alcanzado al finalizar
      la etapa y cuya consecución está vinculada a la adquisición de las competencias
      clave.'
  - num: b)
    text: 'Competencias clave: desempeños que se consideran imprescindibles para que
      el alumnado pueda progresar con garantías de éxito en su itinerario formativo,
      y afrontar los principales retos y desafíos globales y locales. Las competencias
      clave aparecen recogidas en el Perfil de salida del alumnado al término de la
      enseñanza básica y son la adaptación al sistema educativo español de las competencias
      clave establecidas en la Recomendación del Consejo de la Unión Europea de 22
      de mayo de 2018 relativa a las competencias clave para el aprendizaje permanente.'
  - num: c)
    text: 'Competencias específicas: desempeños que el alumnado debe poder desplegar
      en actividades o en situaciones cuyo abordaje requiere de los saberes básicos
      de cada área o ámbito. Las competencias específicas constituyen un elemento
      de conexión entre, por una parte, el Perfil de salida del alumnado, y, por otra,
      los saberes básicos de las áreas o ámbitos y los criterios de evaluación.'
  - num: d)
    text: 'Criterios de evaluación: referentes que indican los niveles de desempeño
      esperados en el alumnado en las situaciones o actividades a las que se refieren
      las competencias específicas de cada área en un momento determinado de su proceso
      de aprendizaje.'
  - num: e)
    text: 'Saberes básicos: conocimientos, destrezas y actitudes que constituyen los
      contenidos propios de un área o ámbito y cuyo aprendizaje es necesario para
      la adquisición de las competencias específicas.'
  - num: f)
    text: 'Situaciones de aprendizaje: situaciones y actividades que implican el despliegue
      por parte del alumnado de actuaciones asociadas a competencias clave y competencias
      específicas y que contribuyen a la adquisición y desarrollo de las mismas.'
- id: NOR-043
  articulo: '1'
  num: Artículo 1.
  heading: Objeto y ámbito de aplicación.
  work_uri: /akn/es-cn/act/2022-11-10/211
  frbr_name: Decreto
  frbr_number: '211'
  country: es-cn
  work_date: '2022-11-10'
  expression_date: '2022-11-23'
  author_eid: gobierno-canarias
  author_href: https://www.gobiernodecanarias.org/
  author_show: Gobierno de Canarias
  fuente_texto: https://www.gobiernodecanarias.org/boc/2022/231/001.html
  parrafos:
  - num: '1.'
    text: El presente Decreto tiene por objeto establecer la ordenación y el currículo
      de la etapa de Educación Primaria, en desarrollo de lo dispuesto en el Real
      Decreto 157/2022, de 1 de marzo, por el que se establecen la ordenación y las
      enseñanzas mínimas de la Educación Primaria.
  - num: '2.'
    text: Este Decreto será de aplicación en todos los centros docentes sostenidos
      con fondos públicos y privados que impartan las enseñanzas de esta etapa en
      el ámbito territorial de la Comunidad Autónoma de Canarias.
- id: NOR-043
  articulo: '2'
  num: Artículo 2.
  heading: Definiciones.
  work_uri: /akn/es-cn/act/2022-11-10/211
  frbr_name: Decreto
  frbr_number: '211'
  country: es-cn
  work_date: '2022-11-10'
  expression_date: '2022-11-23'
  author_eid: gobierno-canarias
  author_href: https://www.gobiernodecanarias.org/
  author_show: Gobierno de Canarias
  fuente_texto: https://www.gobiernodecanarias.org/boc/2022/231/001.html
  parrafos:
  - num: '1.'
    text: A los efectos de lo dispuesto en este Decreto, se entiende por currículo
      de la Educación Primaria el conjunto de objetivos, competencias, contenidos
      enunciados en forma de saberes básicos, criterios de evaluación, situaciones
      de aprendizaje y métodos pedagógicos. Todo ello ha de regular la práctica docente,
      de forma que se desarrollen de manera integral las capacidades del alumnado.
  - num: '2.'
    text: 'En base a lo explicitado en el apartado anterior, y en relación a lo dispuesto
      en este Decreto, se entenderá por:'
  - num: a)
    text: 'Objetivos: logros que se espera que el alumnado haya alcanzado al finalizar
      la etapa y cuya consecución está vinculada al proceso de desarrollo y adquisición
      de las competencias clave y de las competencias específicas de cada área.'
  - num: b)
    text: 'Competencias clave: desempeños que se consideran imprescindibles para que
      el alumnado pueda progresar con garantías de éxito en su itinerario formativo,
      y afrontar los principales retos y desafíos globales y locales. Las competencias
      clave aparecen recogidas en el Perfil de salida del alumnado al término de la
      enseñanza básica (en adelante, Perfil de salida) y son la adaptación al sistema
      educativo español de las competencias clave establecidas en la Recomendación
      del Consejo de la Unión Europea, de 22 de mayo de 2018 relativa a las competencias
      clave para el aprendizaje permanente. Este perfil de salida ha sido adaptado,
      además, al nivel de desempeño esperado para el alumnado que finaliza la Educación
      Primaria.'
  - num: c)
    text: 'Competencias específicas: desempeños que el alumnado debe poder desplegar
      en actividades o en situaciones cuyo abordaje requiere de los saberes básicos
      de cada área. Las competencias específicas constituyen un elemento de conexión
      entre, por una parte, el Perfil de salida del alumnado, y, por otra, los saberes
      básicos de las áreas y los criterios de evaluación. Las competencias específicas
      de cada área, que serán comunes para todos los ciclos de la etapa, presentan
      un carácter finalista. Su grado de consecución en cada uno de los ciclos de
      la etapa viene determinado por los criterios de evaluación que se establecen
      para cada una de ellas.'
  - num: d)
    text: 'Criterios de evaluación: referentes que indican los niveles de desempeño
      esperados en el alumnado en las situaciones o actividades a las que se refieren
      las competencias específicas de cada área en un momento determinado de su proceso
      de aprendizaje. Constituyen los referentes para la evaluación tanto de los saberes
      propios de las áreas, como del grado de desarrollo y adquisición de las competencias
      específicas y clave.'
  - num: e)
    text: 'Saberes básicos: conocimientos, destrezas y actitudes que constituyen los
      contenidos propios de un área y cuyo aprendizaje es necesario para la adquisición
      de las competencias específicas.'
  - num: f)
    text: 'Situaciones de aprendizaje: situaciones y actividades que implican el despliegue,
      por parte del alumnado, de actuaciones asociadas a competencias clave y competencias
      específicas, y que contribuyen a la adquisición y desarrollo de las mismas.'
