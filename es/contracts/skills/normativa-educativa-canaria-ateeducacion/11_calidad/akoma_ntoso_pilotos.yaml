- id: NOR-003
  articulo: '2'
  num: Artículo 2.
  heading: Definiciones.
  work_uri: /akn/es/act/2022-03-29/217
  frbr_name: Real Decreto
  frbr_number: '217'
  country: es
  work_date: '2022-03-29'
  expression_date: '2022-03-30'
  author_eid: gobierno-espana
  author_href: https://www.boe.es/
  author_show: Gobierno de España
  fuente_texto: 07_corpus_ia/textos-completos/texto-oficial-NOR-003-rd-217-2022.txt
  parrafos:
  - text: 'A efectos de este real decreto, se entenderá por:'
  - num: a)
    text: 'Objetivos: logros que se espera que el alumnado haya alcanzado al finalizar
      la etapa y cuya consecución está vinculada a la adquisición de las competencias
      clave.'
  - num: b)
    text: 'Competencias clave: desempeños que se consideran imprescindibles para que
      el alumnado pueda progresar con garantías de éxito en su itinerario formativo,
      y afrontar los principales retos y desafíos globales y locales. Las competencias
      clave aparecen recogidas en el Perfil de salida del alumnado al término de la
      enseñanza básica y son la adaptación al sistema educativo español de las competencias
      clave establecidas en la Recomendación del Consejo de la Unión Europea de 22
      de mayo de 2018 relativa a las competencias clave para el aprendizaje permanente.'
  - num: c)
    text: 'Competencias específicas: desempeños que el alumnado debe poder desplegar
      en actividades o en situaciones cuyo abordaje requiere de los saberes básicos
      de cada materia o ámbito. Las competencias específicas constituyen un elemento
      de conexión entre, por una parte, el Perfil de salida del alumnado, y por otra,
      los saberes básicos de las materias o ámbitos y los criterios de evaluación.'
  - num: d)
    text: 'Criterios de evaluación: referentes que indican los niveles de desempeño
      esperados en el alumnado en las situaciones o actividades a las que se refieren
      las competencias específicas de cada materia o ámbito en un momento determinado
      de su proceso de aprendizaje.'
  - num: e)
    text: 'Saberes básicos: conocimientos, destrezas y actitudes que constituyen los
      contenidos propios de una materia o ámbito cuyo aprendizaje es necesario para
      la adquisición de las competencias específicas.'
  - num: f)
    text: 'Situaciones de aprendizaje: situaciones y actividades que implican el despliegue
      por parte del alumnado de actuaciones asociadas a competencias clave y competencias
      específicas y que contribuyen a la adquisición y desarrollo de las mismas.'
- id: NOR-004
  articulo: '2'
  num: Artículo 2.
  heading: Configuración del sistema educativo canario.
  work_uri: /akn/es-cn/act/2014-07-25/6
  frbr_name: Ley
  frbr_number: '6'
  country: es-cn
  work_date: '2014-07-25'
  expression_date: '2014-08-07'
  author_eid: parlamento-canarias
  author_href: https://www.parcan.es/
  author_show: Parlamento de Canarias
  fuente_texto: 07_corpus_ia/textos-completos/texto-oficial-NOR-004-ley-canaria-6-2014.txt
  parrafos:
  - num: '1.'
    text: El sistema educativo de Canarias comprende las enseñanzas reguladas en el
      título II de la presente ley, los centros que las imparten y los servicios educativos,
      sean cuales sean los destinatarios de las enseñanzas, la titularidad del centro
      o su sistema de financiación.
  - num: '2.'
    text: Las características del sistema educativo, los principios rectores y los
      objetivos definidos en esta ley orientan el ordenamiento de los componentes
      del sistema educativo y conforman el modelo educativo de Canarias.
  - num: '3.'
    text: Todos los componentes del sistema educativo en Canarias se ordenan de un
      modo singular para respetar sus particularidades y lograr que las diferentes
      enseñanzas puedan alcanzar sus objetivos, contribuyendo a que las personas adquieran
      o mejoren sus capacidades y competencias.
  - num: '4.'
    text: Los órganos consultivos y de participación que tengan asignadas funciones
      relacionadas con la educación y que hayan sido regulados en las distintas leyes
      de la Comunidad Autónoma de Canarias también formarán parte del sistema educativo.
      Entre los mencionados órganos se incluirá el Consejo Escolar de Canarias y el
      Consejo Canario de Formación Profesional.
  - num: '5.'
    text: El sistema educativo de Canarias está compuesto por la red pública y la
      red privada.
- id: NOR-005
  articulo: '2'
  num: Artículo 2.
  heading: Definiciones.
  work_uri: /akn/es-cn/act/2023-03-16/30
  frbr_name: Decreto
  frbr_number: '30'
  country: es-cn
  work_date: '2023-03-16'
  expression_date: '2023-03-23'
  author_eid: gobierno-canarias
  author_href: https://www.gobiernodecanarias.org/
  author_show: Gobierno de Canarias
  fuente_texto: https://www.gobiernodecanarias.org/boc/2023/058/001.html
  parrafos:
  - num: '1.'
    text: A los efectos de lo dispuesto en este Decreto, se entiende por currículo
      de la ESO y del Bachillerato, el conjunto de objetivos, competencias, contenidos
      enunciados en forma de saberes básicos, criterios de evaluación, y métodos pedagógicos.
      Todo ello ha de regular la práctica docente, de forma que se desarrollen de
      manera integral las capacidades del alumnado.
  - num: '2.'
    text: 'En relación con lo dispuesto en este Decreto, se entenderá por:'
  - num: a)
    text: 'Objetivos: logros que se espera que el alumnado haya alcanzado al finalizar
      cada una de las etapas educativas reguladas en este Decreto y cuya consecución
      está vinculada al proceso de desarrollo y adquisición de las competencias clave
      y de las competencias específicas de cada materia o ámbito.'
  - num: b)
    text: 'Competencias clave: desempeños que se consideran imprescindibles para que
      el alumnado pueda progresar con garantías de éxito en su itinerario formativo
      y afrontar los principales retos y desafíos globales y locales. Las competencias
      clave aparecen recogidas en el Perfil de salida del alumnado al término de la
      enseñanza básica, en el caso de la ESO, y en los descriptores operativos que
      establecen el nivel de desarrollo y de adquisición esperado de las mismas, al
      término de Bachillerato. Estos marcos de referencia constituyen la adaptación
      al sistema educativo español de las competencias clave establecidas en la Recomendación
      del Consejo de la Unión Europea, de 22 de mayo de 2018, relativa a las competencias
      clave para el aprendizaje permanente.'
  - num: c)
    text: 'Competencias específicas: desempeños que el alumnado debe poder desplegar
      en actividades o en situaciones de aprendizaje, cuyo abordaje requiere de los
      saberes básicos de cada materia o ámbito. Las competencias específicas constituyen
      un elemento de conexión entre, por una parte, el Perfil de salida del alumnado
      y los descriptores operativos de Bachillerato; y, por otra, los saberes básicos
      y los criterios de evaluación de las materias y de los ámbitos. Las competencias
      específicas presentan un carácter finalista, por lo que deberán ser alcanzadas
      por el alumnado al término de la etapa educativa correspondiente. Su grado de
      consecución en cada uno de los niveles de ambas etapas viene determinado por
      los criterios de evaluación que se establecen para cada una de ellas.'
  - num: d)
    text: 'Criterios de evaluación: referentes que indican los niveles de desempeño
      esperados en el alumnado en las situaciones de aprendizaje o actividades a las
      que se refieren las competencias específicas de cada materia o ámbito, en un
      momento determinado de su proceso de aprendizaje. Constituyen los referentes
      para la evaluación tanto de los saberes propios de las materias o los ámbitos,
      como del grado de desarrollo y adquisición de las competencias específicas y
      clave.'
  - num: e)
    text: 'Saberes básicos: conocimientos, destrezas y actitudes, que constituyen
      los contenidos propios de una materia o un ámbito, y cuyo aprendizaje es necesario
      para la adquisición de las competencias específicas.'
  - num: f)
    text: 'Situaciones de aprendizaje: situaciones y actividades que implican el despliegue,
      por parte del alumnado, de actuaciones asociadas a competencias clave y competencias
      específicas, y que contribuyen a la adquisición y el desarrollo de las mismas.'
