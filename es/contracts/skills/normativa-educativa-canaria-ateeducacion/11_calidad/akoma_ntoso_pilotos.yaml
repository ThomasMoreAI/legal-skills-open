  fuente_texto: 07_corpus_ia/textos-completos/texto-oficial-NOR-006-rd-243-2022.txt
  nota: Contrastado con el texto consolidado del BOE (BOE-A-2022-5521) el 2026-08-22.
  parrafos:
  - text: Corresponde a la persona titular del Ministerio de Educación y Formación
      Profesional dictar, en el ámbito de sus competencias, cuantas disposiciones
      sean precisas para la ejecución y aplicación de lo establecido en este real
      decreto, sin perjuicio de las competencias que corresponden a las comunidades
      autónomas.
