- id: NOR-004
  articulo: '1'
  num: Artículo 1.
  heading: Objeto y ámbito.
  work_uri: /akn/es-cn/act/2014-07-25/6
  frbr_name: Ley
  frbr_number: '6'
  country: es-cn
  work_date: '2014-07-25'
  expression_date: '2014-08-07'
  author_eid: parlamento-canarias
  author_href: https://www.parcan.es/
  author_show: Parlamento de Canarias
  fuente_texto: 07_corpus_ia/textos-completos/texto-oficial-NOR-004-ley-canaria-6-2014.txt
  parrafos:
  - num: '1.'
    text: La presente ley tiene por objeto regular el sistema educativo canario y
      su evaluación, de modo que pueda convertirse en un instrumento eficaz para hacer
      efectivo el derecho a una educación de calidad, inclusiva e integradora, que
      garantice la equidad y la excelencia, la prestación de un servicio público esencial
      y convertirse, a la vez, en uno de los motores del desarrollo social, económico
      y cultural del archipiélago.
  - num: '2.'
    text: El ámbito de aplicación de la presente ley es todo el sistema educativo
      canario, a excepción del universitario, en consonancia con las competencias
      asumidas en el Estatuto de Autonomía de Canarias y en el desarrollo de las normas
      básicas aprobadas por el Estado.
