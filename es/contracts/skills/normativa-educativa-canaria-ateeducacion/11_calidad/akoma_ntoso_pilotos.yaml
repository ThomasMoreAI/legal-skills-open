- id: NOR-001
  articulo: '1'
  num: Artículo 1.
  heading: Principios.
  work_uri: /akn/es/act/2006-05-03/2
  frbr_name: Ley Orgánica
  frbr_number: '2'
  country: es
  work_date: '2006-05-03'
  expression_date: '2020-12-30'
  author_eid: jefatura-estado
  author_href: https://www.boe.es/
  author_show: Jefatura del Estado
  fuente_texto: 07_corpus_ia/textos-completos/texto-oficial-NOR-001-loe-consolidada.txt
  nota: Contrastado con el texto consolidado del BOE (BOE-A-2006-7899) el 2026-08-23.
    Porción incorporada por TAREA-096.
  parrafos:
  - text: 'El sistema educativo español, configurado de acuerdo con los valores de
      la Constitución y asentado en el respeto a los derechos y libertades reconocidos
      en ella, se inspira en los siguientes principios: El sistema educativo español,
      configurado de acuerdo con los valores de la Constitución y asentado en el respeto
      a los derechos y libertades reconocidos en ella, se inspira en los siguientes
      principios:'
  - num: a)
    text: El cumplimiento efectivo de los derechos de la infancia según lo establecido
      en la Convención sobre los Derechos del Niño, adoptada por Naciones Unidas el
      20 de noviembre de 1989, ratificada el 30 de noviembre de 1990, y sus Protocolos
      facultativos, reconociendo el interés superior del menor, su derecho a la educación,
      a no ser discriminado y a participar en las decisiones que les afecten y la
      obligación del Estado de asegurar sus derechos.
  - num: a bis)
    text: La calidad de la educación para todo el alumnado, sin que exista discriminación
      alguna por razón de nacimiento, sexo, origen racial, étnico o geográfico, discapacidad,
      edad, enfermedad, religión o creencias, orientación sexual o identidad sexual
      o cualquier otra condición o circunstancia personal o social.
  - num: b)
    text: La equidad, que garantice la igualdad de oportunidades para el pleno desarrollo
      de la personalidad a través de la educación, la inclusión educativa, la igualdad
      de derechos y oportunidades, también entre mujeres y hombres, que ayuden a superar
      cualquier discriminación y la accesibilidad universal a la educación, y que
      actúe como elemento compensador de las desigualdades personales, culturales,
      económicas y sociales, con especial atención a las que se deriven de cualquier
      tipo de discapacidad, de acuerdo con lo establecido en la Convención sobre los
      Derechos de las Personas con Discapacidad, ratificada en 2008, por España.
  - num: c)
    text: La transmisión y puesta en práctica de valores que favorezcan la libertad
      personal, la responsabilidad, la ciudadanía democrática, la solidaridad, la
      tolerancia, la igualdad, el respeto y la justicia, así como que ayuden a superar
      cualquier tipo de discriminación.
  - num: d)
    text: La concepción de la educación como un aprendizaje permanente, que se desarrolla
      a lo largo de toda la vida.
  - num: e)
    text: La flexibilidad para adecuar la educación a la diversidad de aptitudes,
      intereses, expectativas y necesidades del alumnado, así como a los cambios que
      experimentan el alumnado y la sociedad.
  - num: f)
    text: La orientación educativa y profesional de los estudiantes, como medio necesario
      para el logro de una formación personalizada, que propicie una educación integral
      en conocimientos, destrezas y valores.
  - num: g)
    text: El esfuerzo individual y la motivación del alumnado.
  - num: h)
    text: El esfuerzo compartido por alumnado, familias, profesores, centros, Administraciones,
      instituciones y el conjunto de la sociedad.
  - num: h bis)
    text: El reconocimiento del papel que corresponde a los padres, madres y tutores
      legales como primeros responsables de la educación de sus hijos.
  - num: i)
    text: La autonomía para establecer y adecuar las actuaciones organizativas y curriculares
      en el marco de las competencias y responsabilidades que corresponden al Estado,
      a las Comunidades Autónomas, a las corporaciones locales y a los centros educativos.
  - num: j)
    text: La participación de la comunidad educativa en la organización, gobierno
      y funcionamiento de los centros docentes.
  - num: k)
    text: La educación para la convivencia, el respeto, la prevención de conflictos
      y la resolución pacífica de los mismos, así como para la no violencia en todos
      los ámbitos de la vida personal, familiar y social, y en especial en el del
      acoso escolar y ciberacoso con el fin de ayudar al alumnado a reconocer toda
      forma de maltrato, abuso sexual, violencia o discriminación y reaccionar frente
      a ella.
  - num: l)
    text: El desarrollo de la igualdad de derechos, deberes y oportunidades, el respeto
      a la diversidad afectivo-sexual y familiar, el fomento de la igualdad efectiva
      de mujeres y hombres a través de la consideración del régimen de la coeducación
      de niños y niñas, la educación afectivo-sexual, adaptada al nivel madurativo,
      y la prevención de la violencia de género, así como el fomento del espíritu
      crítico y la ciudadanía activa.
  - num: m)
    text: La consideración de la función docente como factor esencial de la calidad
      de la educación, el reconocimiento social del profesorado y el apoyo a su tarea.
  - num: n)
    text: El fomento y la promoción de la investigación, la experimentación y la innovación
      educativa. ñ) La evaluación del conjunto del sistema educativo, tanto en su
      programación y organización y en los procesos de enseñanza y aprendizaje como
      en sus resultados.
  - num: o)
    text: La cooperación entre el Estado y las Comunidades Autónomas en la definición,
      aplicación y evaluación de las políticas educativas.
  - num: p)
    text: La cooperación y colaboración de las Administraciones educativas con las
      corporaciones locales en la planificación e implementación de la política educativa.
  - num: q)
    text: La libertad de enseñanza, que reconozca el derecho de los padres, madres
      y tutores legales a elegir el tipo de educación y el centro para sus hijos,
      en el marco de los principios constitucionales.
  - num: r)
    text: La educación para la transición ecológica con criterios de justicia social
      como contribución a la sostenibilidad ambiental, social y económica.
