- id: NOR-007
  articulo: '1'
  num: Artículo 1.
  heading: Objeto y finalidad.
  work_uri: /akn/es/act/2022-03-31/3
  frbr_name: Ley Orgánica
  frbr_number: '3'
  country: es
  work_date: '2022-03-31'
  expression_date: '2022-04-01'
  author_eid: jefatura-estado
  author_href: https://www.boe.es/
  author_show: Jefatura del Estado
  fuente_texto: 07_corpus_ia/textos-completos/texto-oficial-NOR-007-lofp.txt
  parrafos:
  - num: '1.'
    text: Esta ley tiene por objeto la constitución y ordenación de un sistema único
      e integrado de formación profesional.
  - num: '2.'
    text: La finalidad de la norma es regular un régimen de formación y acompañamiento
      profesionales que, sirviendo al fortalecimiento, la competitividad y la sostenibilidad
      de la economía española, sea capaz de responder con flexibilidad a los intereses,
      las expectativas y las aspiraciones de cualificación profesional de las personas
      a lo largo de su vida y a las competencias demandadas por las nuevas necesidades
      productivas y sectoriales tanto para el aumento de la productividad como para
      la generación de empleo.
  - num: '3.'
    text: Cuantas medidas y acciones se programen y desarrollen en el marco del Sistema
      de Formación Profesional deberán responder a la finalidad a la que éste sirve,
      con la flexibilidad que exige la generación de itinerarios formativos y profesionales
      versátiles.
