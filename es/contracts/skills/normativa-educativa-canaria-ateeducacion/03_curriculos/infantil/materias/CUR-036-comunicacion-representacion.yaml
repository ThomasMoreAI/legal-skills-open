id: CUR-036
titulo: "Comunicación y Representación de la Realidad — Infantil Canarias"
etapa: "infantil"
materia: "Comunicación y Representación de la Realidad"
norma_base: NOR-047
fuente: FTE-050
url_oficial: "https://www.gobiernodecanarias.org/boc/2022/212/001.html"
fecha_consulta: 2026-08-05
estado_extraccion: "completado"
estado_vigencia: "Vigente"
elementos:
  competencias_especificas:
    - codigo: "C1"
      enunciado_oficial: "Manifestar interés por interactuar en situaciones cotidianas a través de la exploración y el uso de su repertorio comunicativo, para expresar sus necesidades e intenciones y responder a las exigencias del entorno."
    - codigo: "C2"
      enunciado_oficial: "Interpretar y comprender mensajes y representaciones apoyándose en conocimientos y recursos de su propia experiencia para responder a las demandas del entorno y construir nuevos aprendizajes."
    - codigo: "C3"
      enunciado_oficial: "Producir mensajes de manera eficaz, personal y creativa, utilizando diferentes lenguajes, descubriendo los códigos de cada uno de ellos y explorando sus posibilidades expresivas, para responder a diferentes necesidades comunicativas."
    - codigo: "C4"
      enunciado_oficial: "Participar por iniciativa propia en actividades relacionadas con textos escritos, mostrando interés y curiosidad, para comprender su funcionalidad y algunas de sus características."
    - codigo: "C5"
      enunciado_oficial: "Valorar la diversidad lingüística presente en su entorno, así como otras manifestaciones culturales, para enriquecer sus estrategias comunicativas y su bagaje cultural."
  saberes_basicos:
    - ciclo: "0-3"
      bloques:
        - bloque: "I. Intención y elementos de la interacción comunicativa"
          saberes:
            - id: "1"
              texto: "Evolución de la intencionalidad comunicativa: establecimiento de contacto e intercambio visual en contextos de proximidad."
            - id: "2"
              texto: "Progresión en la expresión facial y corporal: gestos de intención, necesidad y estado de ánimo y las sensaciones que los acompañan."
            - id: "3"
              texto: "Progresión en el control postural a través de las interacciones tónico-emocionales: el diálogo corporal."
            - id: "4"
              texto: "Comprensión de las expresiones emocionales de la persona adulta y reacción ante ellas."
            - id: "5"
              texto: "Desarrollo de actitudes comunicativas: sostenimiento de la atención conjunta y la mirada referencial."
            - id: "6"
              texto: "Uso de estrategias que facilitan los intercambios en situaciones comunicativas: el contacto visual con la persona interlocutora, la escucha atenta, el turno de diálogo."
            - id: "7"
              texto: "Descubrimiento de los objetos de uso compartido como mediadores en los primeros contextos de interacción comunicativa."
            - id: "8"
              texto: "Disfrute con las nanas, las canciones de arrullo y los juegos de regazo, así como de las nursery rhymes, chants, riddles, songs…, en una primera lengua extranjera."
        - bloque: "II. Las lenguas y sus hablantes"
          saberes:
            - id: "1"
              texto: "Ampliación del repertorio lingüístico individual, tanto en su lengua materna como en la lengua extranjera."
            - id: "2"
              texto: "Iniciación en el descubrimiento de la realidad plurilingüe del aula y entorno."
            - id: "3"
              texto: "Adquisición paulatina de palabras o expresiones que respondan a sus necesidades e intereses."
            - id: "4"
              texto: "Observación y exploración de representaciones sociales, culturales y artísticas cercanas al interés y necesidad personal."
            - id: "5"
              texto: "Valoración positiva e interés por disfrutar de diversidad cultural, presente en su entorno y de las costumbres de otros países."
        - bloque: "III. Comunicación verbal y oral: expresión, comprensión y diálogo"
          saberes:
            - id: "1"
              texto: "Uso del lenguaje oral en situaciones cotidianas tanto en su lengua materna como en la lengua extranjera: primeras conversaciones con sonidos, vocalizaciones y juegos de interacción."
            - id: "2"
              texto: "Expresión sonora y articulación de las palabras. Juegos de imitación, lingüísticos y de percepción auditiva, tanto en su lengua materna como en la lengua extranjera."
            - id: "3"
              texto: "Iniciación en la discriminación auditiva de las diferencias fonéticas del lenguaje oral e iniciación en la segmentación del mismo."
            - id: "4"
              texto: "Ampliación del repertorio lingüístico: situaciones comunicativas, conversaciones colectivas, léxico y discurso."
            - id: "5"
              texto: "Expresión de necesidades, vivencias y emociones. Producción de los primeros mensajes, de forma libre y creativa."
            - id: "6"
              texto: "Iniciación en el uso de palabras sencillas y significativas, en una primera lengua extranjera, para el desarrollo de las rutinas. Comprensión y producción de palabras y mensajes muy sencillos en la lengua extranjera."
            - id: "7"
              texto: "Comprensión del mundo y de mensajes, a través de la escucha activa."
            - id: "8"
              texto: "Descubrimiento de la funcionalidad del lenguaje para representar la realidad."
        - bloque: "IV. Aproximación al lenguaje escrito"
          saberes:
            - id: "1"
              texto: "Descubrimiento de las formas escritas y otros símbolos presentes en el entorno."
            - id: "2"
              texto: "Acercamiento a la presencia del lenguaje escrito en el entorno cercano y a sus usos sociales y funcionales."
            - id: "3"
              texto: "Disfrute de cuentos, adivinanzas, rimas, retahílas…, en soporte escrito."
            - id: "4"
              texto: "Imitación de la lectura a través de modelos lectores de referencia."
        - bloque: "V. Aproximación a la educación literaria"
          saberes:
            - id: "1"
              texto: "Introducción a los textos literarios orales y escritos con contenido adecuado al desarrollo infantil que, preferentemente, desarrollen valores sobre la cultura de paz, los derechos de la infancia, la igualdad entre mujeres y hombres y la diversidad funcional y étnico-cultural."
            - id: "2"
              texto: "Construcción de vínculos afectivos y lúdicos, a través de modelos lectores de referencia."
        - bloque: "VI. El lenguaje y la expresión musical"
          saberes:
            - id: "1"
              texto: "Descubrimiento y disfrute de los sonidos del entorno a través de la escucha."
            - id: "2"
              texto: "Reconocimiento, evocación, reproducción de canciones, y otras manifestaciones musicales, prestando especial atención al patrimonio musical canario. Expresión de sentimientos y emociones que transmiten."
            - id: "3"
              texto: "Exploración de las posibilidades sonoras y expresivas de la voz, el cuerpo, los objetos y los instrumentos. Juego con los sonidos, la entonación y los ritmos."
        - bloque: "VII. El lenguaje y la expresión plástica y visual"
          saberes:
            - id: "1"
              texto: "Exploración y descubrimiento de materiales, colores, volúmenes, texturas, técnicas y procedimientos plásticos."
            - id: "2"
              texto: "Despliegue de la expresión plástica y visual. Acercamiento y apreciación de otras expresiones artísticas."
            - id: "3"
              texto: "Aproximación a obras artísticas del patrimonio cultural canario y las de otras culturas presentes en su entorno."
        - bloque: "VIII. El lenguaje y la expresión corporal"
          saberes:
            - id: "1"
              texto: "Expresión libre a través del gesto, el movimiento y el desplazamiento por el espacio."
            - id: "2"
              texto: "Evolución del juego hasta llegar al de imitación, a través de marionetas, muñecos y otros objetos de representación espontánea."
    - ciclo: "3-6"
      bloques:
        - bloque: "I. Intención y elementos de la interacción comunicativa"
          saberes:
            - id: "1"
              texto: "Participación en situaciones de comunicación significativas y funcionales, desde el respeto a las diferencias individuales."
            - id: "2"
              texto: "Empleo de la empatía y la asertividad para la comunicación interpersonal."
            - id: "3"
              texto: "Ampliación del repertorio comunicativo, incluyendo elementos de expresión no verbal."
            - id: "4"
              texto: "Progreso en la adquisición y uso de las convenciones sociales del intercambio lingüístico en situaciones comunicativas que potencien el respeto y la igualdad: atención, escucha activa, turnos de diálogos y alternancia."
            - id: "5"
              texto: "Conocimiento e integración, a su repertorio comunicativo, de los diferentes lenguajes (verbal, no verbal, plástico, musical, digital, gestual y multimodal…)."
            - id: "6"
              texto: "Muestra de curiosidad y motivación hacia el aprendizaje de otras lenguas."
            - id: "7"
              texto: "Desarrollo de actitudes de respeto hacia la diversidad cultural y plurilingüe de su entorno próximo."
            - id: "8"
              texto: "Descubrimiento de las posibilidades expresivas del lenguaje digital."
            - id: "9"
              texto: "Acercamiento al uso funcional, seguro y responsable de las TIC."
        - bloque: "II. Las lenguas y sus hablantes"
          saberes:
            - id: "1"
              texto: "Ampliación del repertorio lingüístico individual, tanto en su lengua materna como en la lengua extranjera."
            - id: "2"
              texto: "Progreso en el descubrimiento de la realidad lingüística del aula y entorno."
            - id: "3"
              texto: "Adquisición paulatina de palabras y expresiones que respondan a sus necesidades e intereses."
            - id: "4"
              texto: "Acercamiento a la lengua extranjera. Elementos para una comunicación funcional básica."
            - id: "5"
              texto: "Valoración positiva e interés por disfrutar de las costumbres, cultura y personas de países donde se habla la lengua extranjera."
        - bloque: "III. Comunicación verbal y oral: expresión, comprensión y diálogo"
          saberes:
            - id: "1"
              texto: "Uso del lenguaje oral en situaciones cotidianas: conversaciones, juegos de interacción social y expresión de vivencias."
            - id: "2"
              texto: "Iniciación al uso de palabras y frases sencillas y significativas para el desarrollo de rutinas diarias, actividades, tareas y retos, en la lengua extranjera."
            - id: "3"
              texto: "Comprensión y producción básica de palabras y mensajes sencillos en lengua extranjera."
            - id: "4"
              texto: "Aproximación a los textos orales formales e informales, en su lengua materna y en la lengua extranjera."
            - id: "5"
              texto: "Discriminación auditiva y conciencia fonológica, en su lengua materna y en la lengua extranjera."
            - id: "6"
              texto: "Determinación en la intención comunicativa de los mensajes que emiten."
            - id: "7"
              texto: "Motivación e interés por el aprendizaje y adquisición de la lengua extranjera."
        - bloque: "IV. Aproximación al lenguaje escrito"
          saberes:
            - id: "1"
              texto: "Aproximación al código escrito desde las escrituras indeterminadas."
            - id: "2"
              texto: "Descubrimiento de las propiedades del sistema de escritura. Usos sociales, funcionales, lúdicos y significativos de la lectura y la escritura, en situaciones comunicativas."
            - id: "3"
              texto: "Manejo de textos escritos en diferentes soportes."
            - id: "4"
              texto: "Intención comunicativa y acercamiento a las principales características textuales y paratextuales de los textos escritos."
            - id: "5"
              texto: "Descubrimiento de otros códigos de representación gráfica: imágenes, símbolos, números…"
            - id: "6"
              texto: "Iniciación a estrategias de búsqueda de información, reelaboración y comunicación."
        - bloque: "V. Aproximación a la educación literaria"
          saberes:
            - id: "1"
              texto: "Acercamiento a textos literarios orales y escritos adecuados al desarrollo infantil, que preferiblemente contribuyan al tratamiento transversal de la educación en valores (cultura de paz, derechos de la infancia, igualdad de género y diversidad funcional y étnico-cultural"
            - id: "2"
              texto: "Disfrute de situaciones de aproximación a la lectura individual, a través de modelos lectores de referencia."
            - id: "3"
              texto: "Construcción de vínculos afectivos y lúdicos con los textos literarios."
            - id: "4"
              texto: "Uso y disfrute de la biblioteca del aula y de centro."
            - id: "5"
              texto: "Establecimiento de conversaciones y diálogos en torno a textos literarios libres de prejuicios y estereotipos."
        - bloque: "VI. El lenguaje y la expresión musical"
          saberes:
            - id: "1"
              texto: "Indagación en las posibilidades sonoras, expresivas y creativas de la voz, el cuerpo, los objetos cotidianos de su entorno y los instrumentos."
            - id: "2"
              texto: "Participación y disfrute de las propuestas musicales en distintos formatos."
            - id: "3"
              texto: "Intención expresiva en producciones musicales."
            - id: "4"
              texto: "Exploración del sonido, el silencio y sus cualidades. Descubrimiento del código musical."
            - id: "5"
              texto: "Disfrute con la escucha musical. Aproximación al patrimonio musical de Canarias."
        - bloque: "VII. El lenguaje y la expresión plástica y visual"
          saberes:
            - id: "1"
              texto: "Exploración e investigación de los materiales específicos e inespecíficos, elementos, técnicas y procedimientos plásticos."
            - id: "2"
              texto: "Intención expresiva de producciones plásticas y pictóricas."
            - id: "3"
              texto: "Conocimiento de manifestaciones plásticas variadas y acercamiento a diversas manifestaciones culturales y artísticas."
            - id: "4"
              texto: "Conocimiento, disfrute y valoración de manifestaciones artísticas propias del patrimonio cultural canario."
        - bloque: "VIII. El lenguaje y la expresión corporal"
          saberes:
            - id: "1"
              texto: "Desarrollo de las posibilidades expresivas y comunicativas del propio cuerpo en actividades individuales y grupales libres de prejuicios y estereotipos sexistas."
            - id: "2"
              texto: "Participación y disfrute en juegos de expresión corporal y dramática."
        - bloque: "IX. Alfabetización digital"
          saberes:
            - id: "1"
              texto: "Acercamiento a las aplicaciones y herramientas digitales con distintos fines: creación, comunicación, aprendizaje y disfrute."
            - id: "2"
              texto: "Lectura e interpretación crítica de imágenes e información recibida a través de medios digitales."
            - id: "3"
              texto: "Uso y cuidado de los dispositivos y elementos tecnológicos de su entorno."
  criterios_evaluacion:
    - ciclo: "0-3"
      criterios:
        - id: "1.1"
          texto: "Participar con interés en interacciones cotidianas, utilizando diferentes sistemas comunicativos, con la finalidad de expresar sus necesidades, sentimientos, vivencias, intereses o intenciones, utilizando diferentes estrategias comunicativas y aprovechando las posibilidades que le ofrecen los diferentes lenguajes, para ampliar progresivamente sus posibilidades expresivas."
        - id: "1.2"
          texto: "Participar, manifestando interés y curiosidad, en situaciones de uso y en sencillas interacciones, en una primera lengua extranjera, relacionadas con el entorno más cercano o con el contexto del aula, a través de la participación en actividades lúdicas, con la finalidad de iniciarse en el aprendizaje de una primera lengua extranjera."
        - id: "2.1"
          texto: "Interpretar los estímulos y mensajes del entorno, demostrando interés y curiosidad por la información proveniente de distintos ámbitos y formatos, con la finalidad de construir nuevos significados y aprendizajes, ampliar así su repertorio lingüístico e iniciarse en la comprensión de las intenciones comunicativas de otras personas."
        - id: "2.2"
          texto: "Expresar sensaciones, sentimientos y emociones como respuesta a estímulos recibidos, en actividades de acercamiento a manifestaciones sociales, artísticas y culturales propias del entorno del alumnado, prestando especial atención al patrimonio canario, con la finalidad de progresar, desde el acompañamiento y la mediación de la persona adulta, en el conocimiento del mundo que le rodea y de sus valores culturales."
        - id: "2.3"
          texto: "Comprender palabras y mensajes muy sencillos relacionados a las rutinas de aula y al contexto más inmediato, en una primera lengua extranjera, con la finalidad de iniciarse en la utilización de dicha lengua."
        - id: "3.1"
          texto: "Utilizar progresivamente el lenguaje oral para producir mensajes y expresar y compartir necesidades, sentimientos, deseos, emociones y vivencias, regulando las acciones e interactuando en diferentes situaciones y contextos, para ampliar y enriquecer su repertorio comunicativo con seguridad y confianza."
        - id: "3.2"
          texto: "Iniciarse en la utilización de palabras y estructuras muy breves y sencillas, en una primera lengua extranjera, con la finalidad de explorar sus posibilidades expresivas en dicha lengua."
        - id: "3.3"
          texto: "Explorar, de forma libre y creativa, las posibilidades expresivas de los diferentes lenguajes, utilizando los medios materiales propios de los mismos."
        - id: "4.1"
          texto: "Participar en el descubrimiento del código escrito, a través de actividades lúdicas, con la finalidad de iniciarse en el acercamiento al lenguaje escrito y su uso funcional."
        - id: "4.2"
          texto: "Realizar, con intención comunicativa, escrituras indeterminadas, espontáneas y no convencionales, con la finalidad de incorporarlas a sus producciones."
        - id: "4.3"
          texto: "Disfrutar de los primeros contactos con la literatura infantil, tanto en su lengua materna como en la lengua extranjera, explorando la biblioteca de aula o de centro, como espacios de diversión, de disfrute y de aproximación a textos de uso social, libres de prejuicios y estereotipos sexistas, mostrando una escucha atenta cuando se narra, se recita o se lee, con el fin de iniciarse en el gusto por la lectura y de realizar las primeras imitaciones de modelos lectores de referencia."
        - id: "5.1"
          texto: "Relacionarse, con naturalidad y disfrute, en la realidad lingüística y cultural de su entorno inmediato, con la finalidad de iniciarse en el reconocimiento de otras lenguas, etnias y culturas presentes en su contexto."
        - id: "5.2"
          texto: "Disfrutar de sus primeras aproximaciones a obras musicales, audiovisuales, dramáticas o dancísticas, con actitud participativa, con la finalidad de iniciarse en el descubrimiento de sus estrategias comunicativas y en el conocimiento de la diversidad del mundo cultural que le rodea, con especial atención al patrimonio cultural canario."
        - id: "5.3"
          texto: "Escuchar con actitud atenta, reconocer, recordar y reproducir, con disfrute, nanas, canciones, retahílas, juegos de regazo, tanto en la lengua materna como en una primera lengua extranjera, en situaciones de juego espontáneo o guiado, con la finalidad de disfrutar del repertorio musical de apego, hacer uso de las posibilidades expresivas del repertorio musical e iniciarse en la sonoridad de una lengua extranjera."
        - id: "5.4"
          texto: "Disfrutar del movimiento libre, el gesto y el desplazamiento por el espacio, y explorar las posibilidades expresivas que ofrecen el cuerpo y la voz, así como los objetos e instrumentos presentes en el entorno, en actividades de juego de sonidos, entonación y ritmo, con la finalidad de disfrutar de las posibilidades expresivas de su cuerpo y de iniciarse en la expresión musical."
        - id: "5.5"
          texto: "Aproximarse a lenguas y culturas diferentes de la familiar, mostrando actitudes de respeto y aprecio hacia la diversidad lingüística y cultural, con la finalidad de iniciarse de manera progresiva en el uso de una lengua extranjera y enriquecer su repertorio lingüístico."
    - ciclo: "3-6"
      criterios:
        - id: "1.1"
          texto: "Participar en situaciones comunicativas espontáneas y planificadas, de manera activa y respetuosa con las diferencias individuales, indagando en las posibilidades expresivas de los diferentes lenguajes e iniciándose en la utilización de las convenciones sociales que rigen los intercambios comunicativos en función del contexto, con la finalidad de avanzar en el establecimiento y ajuste de su propio repertorio comunicativo verbal y no verbal, y ampliar sus posibilidades expresivas."
        - id: "1.2"
          texto: "Participar en situaciones de uso y en interacciones sencillas en una primera lengua extranjera a través de la participación en actividades lúdicas, respondiendo a las acciones que se les proponen y siguiendo instrucciones simples en tareas habituales, manifestando interés, curiosidad y respeto hacia la diversidad de perfiles lingüísticos presentes en el entorno, con el fin de avanzar en el uso de una lengua distinta a la propia y en el acercamiento a otras culturas."
        - id: "1.3"
          texto: "Comunicar necesidades, sentimientos y vivencias, con empatía y asertividad, utilizando diferentes lenguajes y estrategias comunicativas, adecuando la expresión facial, la postura, los gestos y los movimientos, a sus intenciones comunicativas y estados de ánimo con la finalidad de descubrir y hacer uso de las posibilidades expresivas de los diferentes lenguajes, incluidos los artísticos, ampliando su repertorio comunicativo."
        - id: "1.4"
          texto: "Experimentar con diferentes recursos tecnológicos, con el fin de familiarizarse, de manera progresiva, con los diferentes medios y herramientas digitales."
        - id: "2.1"
          texto: "Interpretar los mensajes y la información proveniente de su entorno, así como las intenciones comunicativas de las demás personas, demostrando interés y curiosidad, con la finalidad de construir nuevos significados y aprendizajes, y ampliar su repertorio lingüístico."
        - id: "2.2"
          texto: "Interpretar los mensajes transmitidos mediante representaciones o manifestaciones sociales, culturales y artísticas de su entorno, también en formato digital, prestando especial atención al patrimonio canario, reconociendo la intencionalidad del emisor y mostrando una actitud curiosa y responsable, para avanzar en el descubrimiento del mundo que le rodea y de sus valores culturales, en el acercamiento a distintas formas de expresión y en la construcción de nuevos aprendizajes."
        - id: "2.3"
          texto: "Comprender palabras y mensajes sencillos relacionados a las rutinas diarias y al contexto más próximo, en una primera lengua extranjera, con la finalidad de avanzar progresivamente en la utilización de dicha lengua."
        - id: "3.1"
          texto: "Hacer un uso funcional del lenguaje oral, en contextos formales e informales, como medio de aprendizaje, de regulación de la conducta y de expresión de necesidades, ideas, emociones, sentimientos y vivencias, con la finalidad de aumentar su repertorio lingüístico y de construir, progresivamente, un discurso cada vez más eficaz, organizado y coherente en su lengua materna."
        - id: "3.2"
          texto: "Progresar en la utilización de palabras y estructuras breves y sencillas, en una primera lengua extranjera, con la finalidad de explorar sus posibilidades expresivas en dicha lengua."
        - id: "3.3"
          texto: "Explorar, libremente y de forma sugerida, las posibilidades expresivas de los diferentes lenguajes utilizando los medios materiales propios de los mismos, con el fin de avanzar en la representación de aspectos de la realidad, de una forma cada vez más personal y ajustada a los distintos contextos y situaciones comunicativas."
        - id: "3.4"
          texto: "Evocar y expresar ideas, de manera espontánea, a través del relato oral, y experimentar con la entonación y vocalización de las palabras, así como con los aspectos no verbales de la oralidad, con la finalidad de utilizar el lenguaje como instrumento comunicativo de ideas, puntos de vista y relatos propios."
        - id: "3.5"
          texto: "Elaborar creaciones plásticas, explorando y utilizando diferentes materiales y técnicas, y participando activamente en el trabajo en grupo cuando se precise, con el fin de ampliar y enriquecer su repertorio comunicativo a través de diferentes lenguajes expresivos."
        - id: "3.6"
          texto: "Interpretar, de manera colaborativa, propuestas dramáticas y musicales, utilizando y explorando diferentes instrumentos, recursos o técnicas, con la finalidad de experimentar con la entonación, pronunciación y vocalización de las palabras, así como con los aspectos no verbales de la comunicación y las posibilidades expresivas del sonido, la voz, el gesto y el movimiento."
        - id: "3.7"
          texto: "Explorar, con placer, las posibilidades expresivas de su cuerpo, ya sea de forma individual o en grupo, en diversos espacios, con la intención de ajustar su movimiento al de las demás personas como forma de expresión corporal libre, manifestando interés e iniciativa."
        - id: "3.8"
          texto: "Expresarse de manera creativa a través de herramientas o aplicaciones digitales, intuitivas y visuales, para iniciarse en el conocimiento de las posibilidades del lenguaje audiovisual y multimedia."
        - id: "4.1"
          texto: "Participar, con interés y curiosidad, en actividades de aproximación al lenguaje escrito y mostrar interés por producir mensajes, a partir de la exploración de códigos escritos, convencionales o no, en diversos soportes, con la finalidad de avanzar en el acercamiento al lenguaje escrito y su uso comunicativo."
        - id: "4.2"
          texto: "Participar en actividades de práctica social de la lectura y la escritura, en el quehacer cotidiano del aula, con la finalidad de avanzar en su uso como medios de expresión y comunicación."
        - id: "4.3"
          texto: "Identificar, de manera acompañada, alguna de las características textuales y paratextuales, mediante el diálogo y la indagación en textos de uso social libres de prejuicios y estereotipos sexistas, y que contribuyan a la educación en valores, con la finalidad de comenzar a inferir relaciones entre el texto y las imágenes, y los colores y símbolos que lo acompañan."
        - id: "4.4"
          texto: "Iniciarse en la reelaboración y comunicación de textos sencillos, utilizando estrategias básicas en actividades de búsqueda de información con la finalidad de iniciarse en procesos de alfabetización informacional."
        - id: "4.5"
          texto: "Participar en experiencias lectoras de aproximación lúdica a la lectura individual o grupal, a través de modelos de referencia, así como en diálogos en torno a textos literarios, con la finalidad de disfrutar de la lectura, apreciar la belleza del lenguaje literario, desarrollar la imaginación y favorecer la expresión tanto oral como escrita."
        - id: "5.1"
          texto: "Demostrar curiosidad, interés y respeto por la pluralidad lingüística y cultural de su contexto, con especial atención a las manifestaciones culturales y particularidades lingüísticas propias de Canarias, con la finalidad de avanzar en el conocimiento de su propia cultura y de aproximarse a lenguas y culturas diferentes de la familiar, mostrando actitudes de respeto y aprecio hacia la diversidad lingüística y cultural de su entorno."
        - id: "5.2"
          texto: "Expresar emociones, ideas y pensamientos, a través de manifestaciones artísticas propias a partir del acercamiento a obras musicales, audiovisuales, dramáticas o dancísticas, con el fin de expresar gustos, preferencias y opiniones sobre las mismas, de explorar las posibilidades expresivas de manifestaciones culturales diversas, con especial atención a las del patrimonio canario, y de disfrutar del proceso creativo."
        - id: "5.3"
          texto: "Recitar sencillas canciones o rimas en una primera lengua extranjera con la adecuada entonación y pronunciación, con la finalidad de avanzar en la utilización de una primera la lengua extranjera, mostrando interés por los aspectos socioculturales que transmite."
        - id: "5.4"
          texto: "Participar en actividades de aproximación a la literatura infantil, tanto en la lengua materna como en una primera lengua extranjera, de manera individual como en contextos dialógicos y participativos, con la finalidad de apreciar la diversidad y riqueza de los textos escritos y orales."
        - id: "5.5"
          texto: "Indagar en las posibilidades sonoras, expresivas y creativas de la voz, el cuerpo, los objetos cotidianos de su entorno y los instrumentos, y desarrollar las posibilidades comunicativas del propio cuerpo, participando con disfrute en propuestas musicales y en actividades individuales y grupales de expresión corporal, con la finalidad de disfrutar de las posibilidades expresivas de su cuerpo a través de la música."
        - id: "5.6"
          texto: "Disfrutar de la escucha de producciones musicales diversas, con especial atención a las propias del patrimonio canario, en distintos momentos, espontáneos, lúdicos o guiados, con la finalidad de aumentar el propio bagaje cultural y musical."
        - id: "5.7"
          texto: "Expresar emociones, ideas y pensamientos, a través de la expresión plástica, disfrutando del proceso creativo y descubriendo y utilizando diversos materiales, técnicas y procedimientos, plásticos y pictóricos, con la finalidad de explorar las diversas posibilidades expresivas propias de este lenguaje."
        - id: "5.8"
          texto: "Explorar las herramientas digitales presentes en el aula, en actividades mediadas por la persona adulta, con la finalidad de avanzar en el uso responsable de las mismas y en las posibilidades que les ofrece la tecnología para la creación, comunicación, aprendizaje y disfrute."
