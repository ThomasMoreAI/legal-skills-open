observaciones: "TAREA-079 (2026-08-05): verificadas las 5 competencias específicas contra la copia re-exportada en 07_corpus_ia/textos-completos/texto-oficial-NOR-047-... (ANEXO 2, ÁREA 3, bloques competenciales, págs. 41096-41114). C1, C3 y C4 ya eran literales. Se corrigen dos: C2 llevaba una coma que no está en el decreto ('...propia experiencia, para responder...' → '...propia experiencia para responder...'); C5 estaba truncada ('Valorar la diversidad lingüística presente en su entorno, para enriquecer sus estrategias comunicativas culturales.') y se sustituye por el texto íntegro del decreto: 'Valorar la diversidad lingüística presente en su entorno, así como otras manifestaciones culturales, para enriquecer sus estrategias comunicativas y su bagaje cultural.' criterios_evaluacion recoge ahora, transcritos literalmente de las mismas páginas del BOC, los dieciséis criterios del primer ciclo (2+3+3+3+5) y los veintiocho del segundo (4+3+8+5+8). saberes_basicos recoge, para cada uno de los dos ciclos, los bloques temáticos del área (ocho en el primer ciclo, I-VIII; nueve en el segundo, I-IX, que añade el bloque 'Alfabetización digital'), con sus saberes numerados transcritos literalmente. [PENDIENTE] El saber V.1 del segundo ciclo ('...diversidad funcional y étnico-cultural') aparece sin el paréntesis de cierre en la copia re-exportada del BOC; se transcribe tal cual, sin añadir el paréntesis, y queda pendiente de verificar contra la maquetación original si es una errata de la norma o un artefacto de extracción. En Educación Infantil no existen los descriptores operativos del perfil de salida, que es de la enseñanza básica (DEC-0009), así que el cuarto elemento de DEC-0004 no aplica a esta ficha; con competencias, criterios y saberes literales, la ficha queda completa."
