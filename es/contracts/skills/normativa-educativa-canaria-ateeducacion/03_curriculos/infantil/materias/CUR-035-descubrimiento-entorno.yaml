id: CUR-035
titulo: "Descubrimiento y Exploración del Entorno — Infantil Canarias"
etapa: "infantil"
materia: "Descubrimiento y Exploración del Entorno"
norma_base: NOR-047
fuente: FTE-050
url_oficial: "https://www.gobiernodecanarias.org/boc/2022/212/001.html"
fecha_consulta: 2026-08-05
estado_extraccion: "completado"
estado_vigencia: "Vigente"
elementos:
  competencias_especificas:
    - codigo: "C1"
      enunciado_oficial: "Identificar las características de materiales, objetos y colecciones y establecer relaciones entre ellos, mediante la exploración, la manipulación sensorial, el manejo de herramientas sencillas y el desarrollo de destrezas lógico-matemáticas para descubrir y crear una idea cada vez más compleja del mundo."
    - codigo: "C2"
      enunciado_oficial: "Desarrollar, de manera progresiva, los procedimientos del método científico y las destrezas del pensamiento computacional, a través de procesos de observación y manipulación de objetos, para iniciarse en la interpretación del entorno y responder de forma creativa a las situaciones y retos que se plantean."
    - codigo: "C3"
      enunciado_oficial: "Reconocer elementos y fenómenos de la naturaleza, mostrando interés por los hábitos que inciden sobre ella, para apreciar la importancia del uso sostenible, el cuidado y la conservación del entorno en la vida de las personas."
  saberes_basicos:
    - ciclo: "0-3"
      bloques:
        - bloque: "I. Diálogo corporal con el entorno. Exploración creativa de objetos, materiales y espacios"
          saberes:
            - id: "1"
              texto: "Manifestación de curiosidad e interés por la exploración del entorno y sus elementos."
            - id: "2"
              texto: "Exploración de objetos y materiales a través de los sentidos: apretar, dejar caer, volcar, encajar, apilar, soplar… Efectos que producen las diferentes acciones sobre ellos."
            - id: "3"
              texto: "Identificación de las cualidades o los atributos de los objetos y materiales en cuanto a su textura, tamaño, color y forma."
            - id: "4"
              texto: "Aproximación a las relaciones de orden, correspondencia, clasificación, agrupación y comparación."
            - id: "5"
              texto: "Aproximación a las nociones espaciales básicas en relación con el propio cuerpo y los objetos."
            - id: "6"
              texto: "Interiorización de algunas nociones temporales básicas a través de los ritmos que marcan las rutinas: cambio y permanencia, continuidad; sucesión y simultaneidad; pasado, presente y futuro."
        - bloque: "II. Experimentación en el entorno. Curiosidad, pensamiento científico, razonamiento lógico y creatividad"
          saberes:
            - id: "1"
              texto: "Indagación en el entorno a través de procesos manipulativos, con interés, curiosidad, imaginación, creatividad y sorpresa."
            - id: "2"
              texto: "Construcción de nuevos conocimientos: relaciones y conexiones entre lo conocido y lo novedoso, en interacciones de calidad con las personas adultas, con iguales y con el entorno."
            - id: "3"
              texto: "Acercamiento a la elaboración de estrategias y técnicas básicas de investigación: observación, experimentación, ensayo-error, realización de preguntas sencillas, planteamiento de ideas o soluciones alternativas…"
        - bloque: "III. Indagación en el medio físico y natural. Cuidado, valoración y respeto"
          saberes:
            - id: "1"
              texto: "Experimentación con los elementos naturales."
            - id: "2"
              texto: "Disfrute de las actividades al aire libre y en la naturaleza."
            - id: "3"
              texto: "Cuidado y respeto hacia la naturaleza, los seres vivos y los derechos de los animales."
            - id: "4"
              texto: "Descubrimiento y respeto hacia el patrimonio natural canario."
            - id: "5"
              texto: "Observación y descubrimiento de los fenómenos naturales habituales: repercusión en la vida cotidiana."
    - ciclo: "3-6"
      bloques:
        - bloque: "I. Diálogo corporal con el entorno. Exploración creativa de objetos, materiales y espacios"
          saberes:
            - id: "1"
              texto: "Conocimiento y relación de las cualidades o los atributos de los objetos y materiales. Relaciones de orden, correspondencia, clasificación y comparación."
            - id: "1.1"
              texto: "Forma, tamaño, color."
            - id: "1.2"
              texto: "Clasificaciones, seriaciones, condicionales."
            - id: "2"
              texto: "Aplicación contextualizada de cuantificadores básicos: todos, algunos, no todos, ninguno, uno y solo uno, al menos uno…"
            - id: "3"
              texto: "Uso funcional de los números en la vida cotidiana. Utilización de la serie numérica para contar objetos."
            - id: "4"
              texto: "Aplicación del número ordinal en pequeñas colecciones ordenadas."
            - id: "5"
              texto: "Uso de los números y las operaciones (unir, quitar, separar, repartir…), en los juegos y las situaciones de la vida cotidiana."
            - id: "6"
              texto: "Iniciación a la resolución de problemas sencillos a través de: clasificación de la información, uso de diferentes estrategias (ensayo y error, modelización), y comprobación de las soluciones obtenidas."
            - id: "7"
              texto: "Utilización de nociones espaciales básicas."
            - id: "8"
              texto: "Orientación del propio cuerpo en relación con un objeto y de objetos entre sí (entre, detrás de-delante de, debajo de-encima de, arriba-abajo, izquierda-derecha, dentro-fuera, cerca-lejos)."
            - id: "9"
              texto: "Identificación de formas geométricas básicas: triángulo, círculo, cuadrado, rectángulo, cubo y esfera. Línea recta, línea curva, dirección y sentido."
            - id: "10"
              texto: "Identificación de situaciones en las que es preciso medir para resolver problemas sencillos: más/menos…que, igual…que, con los conceptos: lleno-vacío, pesado-ligero, largo-corto, ancho-estrecho, grande-pequeño, alto-bajo…."
            - id: "11"
              texto: "Utilización de nociones temporales básicas: cambio y permanencia, continuidad, sucesión y simultaneidad; pasado, presente y futuro, periodos de tiempo (antes-ahora-después, secuencia temporal, día y noche, estaciones, ciclos, calendario…)."
        - bloque: "II. Experimentación en el entorno. Curiosidad, pensamiento científico y creatividad"
          saberes:
            - id: "1"
              texto: "Descubrimiento de pautas para la indagación del entorno: interés, respeto, curiosidad, asombro, cuestionamiento y deseos de conocimiento."
            - id: "2"
              texto: "Exploración y experimentación de diversos contextos y problemas en los que se obtengan diferentes soluciones."
            - id: "3"
              texto: "Iniciación en el uso de estrategias de construcción de nuevos conocimientos: relaciones y conexiones entre lo conocido y lo novedoso, y entre experiencias previas y nuevas; andamiaje e interacciones de calidad con las personas adultas, con iguales y con el entorno."
            - id: "4"
              texto: "Elaboración de estrategias y utilización de técnicas de investigación: ensayo-error, observación, experimentación, formulación y comprobación de hipótesis, realización de preguntas, manejo y búsqueda en distintas fuentes de información."
            - id: "5"
              texto: "Iniciación al desarrollo del pensamiento científico y las destrezas de pensamiento computacional."
            - id: "6"
              texto: "Iniciativa en la búsqueda de acuerdos o consensos en la toma de decisiones durante la planificación y organización de tareas."
            - id: "7"
              texto: "Utilización de diversas estrategias para proponer soluciones: creatividad, diálogo, imaginación y descubrimiento."
            - id: "8"
              texto: "Identificación de procesos y resultados. Constatación y elaboración de hallazgos, verificaciones y conclusiones."
        - bloque: "III. Indagación en el medio físico y natural. Cuidado, valoración y respeto"
          saberes:
            - id: "1"
              texto: "Respeto, estima y protección hacia el medio natural canario."
            - id: "1.1"
              texto: "Identificación de elementos naturales propios del paisaje canario (barrancos, palmeras, terrenos volcánicos, etc.)."
            - id: "1.2"
              texto: "Reconocimiento de las plantas y los animales más representativos de las Islas Canarias."
            - id: "2"
              texto: "Identificación de la influencia de las acciones de las personas en el medio físico y en el patrimonio natural."
            - id: "3"
              texto: "Fenómenos naturales: identificación y repercusión en la vida de las personas. Toma de conciencia sobre el cambio climático."
            - id: "4"
              texto: "Identificación de las semejanzas y diferencias entre seres vivos o inertes."
            - id: "5"
              texto: "Valoración, empatía, cuidado y protección de los animales y de las plantas."
            - id: "6"
              texto: "Iniciativa para realizar tareas relacionadas con el cuidado de las plantas y de los animales."
            - id: "7"
              texto: "Conocimiento, valoración y respeto por el patrimonio presente en el medio natural de Canarias."
            - id: "8"
              texto: "Iniciación al conocimiento de recursos naturales y a los beneficios de la sostenibilidad, energías limpias y naturales."
  criterios_evaluacion:
    - ciclo: "0-3"
      criterios:
        - id: "1.1"
          texto: "Explorar y descubrir las cualidades y los atributos básicos de los objetos, los materiales y las colecciones, presentes en el entorno, en situaciones cotidianas del aula y en contextos lúdicos, tanto de manera espontánea como sugerida, estableciendo relaciones entre ellos, explorando y manipulando con curiosidad e interés, con la finalidad de iniciarse en el reconocimiento del mundo que les rodea."
        - id: "1.2"
          texto: "Iniciarse en las relaciones de orden, clasificación y agrupación, y en el uso de cuantificadores básicos, a través de la manipulación de objetos y materiales diversos, con la finalidad de iniciarse en el desarrollo de destrezas lógico-matemáticas básicas."
        - id: "1.3"
          texto: "Aplicar sus conocimientos acerca de las nociones espaciales básicas para ubicarse en los espacios, tanto en reposo como en movimiento, jugando con el propio cuerpo y con los objetos."
        - id: "2.1"
          texto: "Iniciarse en la gestión de retos y problemas con la ayuda de la persona adulta de referencia, mediante su división en secuencias de actividades más sencillas, demostrando interés e iniciativa, para iniciarse en la resolución de desafíos sencillos de la vida cotidiana."
        - id: "2.2"
          texto: "Observar y manipular objetos, en situaciones de la vida cotidiana y en interacciones lúdicas con las personas adultas, sus iguales y el entorno, con la finalidad de aproximarse a nociones básicas del pensamiento científico y las destrezas del pensamiento computacional, y a la construcción de nuevos conocimientos, relacionando lo conocido con lo novedoso."
        - id: "2.3"
          texto: "Iniciarse en la aplicación de algunas técnicas y estrategias de investigación sencillas, a través de la observación, comprobación y realización de preguntas, y proponer soluciones y alternativas, con la finalidad de responder de forma creativa a cuestiones, retos o situaciones que se le presentan."
        - id: "3.1"
          texto: "Demostrar curiosidad, interés y respeto por la naturaleza y los elementos naturales del entorno próximo, incorporar hábitos sencillos, guiados por la persona adulta, para su cuidado y conservación, e iniciarse en el respeto a los derechos de los animales que lo habitan, a partir de su participación en actividades al aire libre, con el fin de descubrir y respetar el medio natural, prestándose especial atención al contexto natural canario, y de iniciarse en el desarrollo de hábitos sostenibles."
        - id: "3.2"
          texto: "Identificar y nombrar los fenómenos atmosféricos más habituales en su entorno, acercándose, a través de la experimentación, a las repercusiones que tienen en la vida cotidiana, con la finalidad incrementar su conocimiento del mundo que le rodea."
    - ciclo: "3-6"
      criterios:
        - id: "1.1"
          texto: "Identificar y describir las cualidades o los atributos de los materiales, los objetos y las colecciones, reconociendo sus semejanzas y diferencias, en situaciones cotidianas del aula y contextos lúdicos, estableciendo relaciones de orden, correspondencia, clasificación y comparación entre ellos, demostrando curiosidad e interés, con la finalidad de descubrir y crear una idea cada vez más compleja del mundo."
        - id: "1.2"
          texto: "Emplear los cuantificadores básicos más significativos y construir el concepto de número y de cantidad, identificando el número cardinal que representa la cantidad y viceversa, y desarrollando la técnica de contar."
        - id: "1.3"
          texto: "Identificar las situaciones cotidianas en las que es preciso medir, utilizando el cuerpo u otros materiales y herramientas para realizar estimaciones de medida, a través de la manipulación y experimentación con distintos materiales e instrumentos cotidianos, con la finalidad de desarrollar sus habilidades lógico-matemáticas."
        - id: "1.4"
          texto: "Aplicar sus conocimientos acerca de las nociones espaciales básicas, jugando con el propio cuerpo y con los objetos, con el fin de ubicarse y orientarse adecuadamente en distintos espacios."
        - id: "1.5"
          texto: "Organizar su actividad, ordenando y anticipando las secuencias, y utilizando las nociones temporales básicas, tanto en las rutinas como en relación con sus juegos y experiencias cotidianas, con el fin de avanzar en la comprensión de la organización y sucesión del tiempo."
        - id: "2.1"
          texto: "Gestionar situaciones, retos o problemas, y proponer soluciones y alternativas a los mismos, mediante la planificación guiada de secuencias de actividades y la utilización de estrategias cada vez más complejas, demostrando tolerancia a la frustración ante las posibles dificultades, con el fin de iniciarse en el desarrollo del pensamiento divergente y la capacidad creativa en la solución de problemas."
        - id: "2.2"
          texto: "Utilizar diferentes estrategias y técnicas básicas de investigación, experimentar, observar, hacer preguntas, comprobar y plantear hipótesis acerca de posibles resultados, consecuencias, transformaciones y comportamientos de algunos elementos o materiales sencillos, a través de la manipulación y la actuación sobre ellos, en actividades de indagación en el entorno cercano, con el fin de iniciarse en la construcción de nuevos conocimientos, verificando lo que se plantea."
        - id: "2.3"
          texto: "Participar en diversos proyectos de investigación que se plantean en el contexto de aula, a través de estrategias y dinámicas cooperativas, con la finalidad de compartir y valorar las opiniones propias y ajenas, y para expresar conclusiones personales elaboradas a partir de las mismas."
        - id: "3.1"
          texto: "Demostrar una actitud de curiosidad, respeto, cuidado y protección hacia el medio natural y hacia los seres vivos que habitan en él, en actividades de observación directa y continua del ciclo vital de los seres vivos, e iniciarse en el reconocimiento de los recursos naturales y de los beneficios de un desarrollo sostenible, con la finalidad de establecer relaciones entre el medio natural y el social, y de ir elaborando, progresivamente, hábitos de respeto y cuidado del entorno, en especial del contexto natural canario."
        - id: "3.2"
          texto: "Observar, manipular y explorar los elementos naturales y experimentar con ellos, con la finalidad de comprobar sus características y comportamiento, e identificar el impacto positivo o negativo que algunas acciones humanas ejercen sobre el medio natural."
        - id: "3.3"
          texto: "Observar, reconocer y nombrar algunos fenómenos naturales, acercándose, a través de la experimentación y el juego, a las repercusiones que tienen en la vida cotidiana con la finalidad de ampliar sus conocimientos sobre el mundo que les rodea, sus cambios y transformaciones."
        - id: "3.4"
          texto: "Identificar rasgos comunes y diferentes entre los seres vivos e inertes, en actividades de exploración en la naturaleza, reconociendo, entre ellos, las especies más representativas de las islas Canarias, con la finalidad de apreciar la diversidad y riqueza del medio natural."
        - id: "3.5"
          texto: "Establecer relaciones e identificar elementos del medio natural y social, a partir de la observación y la participación en actividades de acercamiento a las manifestaciones de los mismos, con el fin de avanzar en el conocimiento, la valoración y el respeto de los rasgos característicos de Canarias."
relaciones:
  desarrolla_a: [NOR-047]
  relacionada_con: []
observaciones: "TAREA-079 (2026-08-05): verificadas las 3 competencias específicas contra la copia re-exportada en 07_corpus_ia/textos-completos/texto-oficial-NOR-047-... (ANEXO 2, ÁREA 2, bloques competenciales, págs. 41074-41076); coinciden literalmente con la versión ya registrada (idénticas en primer y segundo ciclo), sin cambios. criterios_evaluacion recoge ahora, transcritos literalmente de las mismas páginas del BOC, los ocho criterios del primer ciclo (3+3+2) y los trece del segundo (5+3+5). saberes_basicos recoge, para cada uno de los dos ciclos, los tres bloques (I-III) con sus saberes numerados, también transcritos literalmente. En Educación Infantil no existen los descriptores operativos del perfil de salida, que es de la enseñanza básica (DEC-0009), así que el cuarto elemento de DEC-0004 no aplica a esta ficha; con competencias, criterios y saberes literales, la ficha queda completa."
