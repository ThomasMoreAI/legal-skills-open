id: CUR-034
titulo: "Crecimiento en Armonía — Infantil Canarias"
etapa: "infantil"
materia: "Crecimiento en Armonía"
norma_base: NOR-047
fuente: FTE-050
url_oficial: "https://www.gobiernodecanarias.org/boc/2022/212/001.html"
fecha_consulta: 2026-08-05
estado_extraccion: "completado"
estado_vigencia: "Vigente"
elementos:
  competencias_especificas:
    - codigo: "C1"
      enunciado_oficial: "Progresar en el conocimiento y control de su cuerpo y en la adquisición de distintas estrategias, adecuando sus acciones a la realidad del entorno de una manera segura, para construir una autoimagen ajustada y positiva."
    - codigo: "C2"
      enunciado_oficial: "Reconocer, manifestar y regular progresivamente sus emociones, expresando necesidades y sentimientos para lograr bienestar emocional y seguridad afectiva."
    - codigo: "C3"
      enunciado_oficial: "Adoptar modelos, normas y hábitos, desarrollando la confianza en sus posibilidades y sentimientos de logro, para promover un estilo de vida saludable y ecosocialmente responsable."
    - codigo: "C4"
      enunciado_oficial: "Establecer interacciones sociales en condiciones de igualdad, valorando la importancia de la amistad, el respeto y la empatía, para construir su propia identidad basada en valores democráticos y de respeto a los derechos humanos."
  saberes_basicos:
    - ciclo: "0-3"
      bloques:
        - bloque: "I. El cuerpo y el control progresivo del mismo"
          saberes:
            - id: "1"
              texto: "Descubrimiento de su cuerpo y reconocimiento de la propia imagen y la de las personas de su entorno."
            - id: "1.1"
              texto: "Identificación y respeto de las diferencias."
            - id: "1.2"
              texto: "Relación y contacto con las otras personas y con los objetos."
            - id: "2"
              texto: "Evolución del juego como actividad propia para el bienestar y el disfrute: juego exploratorio, sensorial y motor."
            - id: "3"
              texto: "Exploración y participación en experiencias activas en el entorno: el movimiento libre como fuente de aprendizaje y desarrollo inicial."
            - id: "3.1"
              texto: "Curiosidad e interés por la exploración sensoriomotriz de su cuerpo y su entorno inmediato."
            - id: "3.2"
              texto: "Integración sensorial del mundo a través de las posibilidades perceptivas."
            - id: "4"
              texto: "Experimentación manipulativa y dominio progresivo de la coordinación visomotriz en el contacto con objetos y materiales."
            - id: "5"
              texto: "Contacto con las otras personas y con los objetos. Iniciativa y curiosidad para aprender nuevas habilidades."
            - id: "6"
              texto: "Adaptación y progresivo control del movimiento y la postura en las diferentes situaciones de la vida cotidiana."
            - id: "7"
              texto: "Estrategias para identificar y evitar situaciones de riesgo o peligro."
        - bloque: "II. Desarrollo y equilibrio afectivos"
          saberes:
            - id: "1"
              texto: "Identificación y adecuación de estados emocionales a las diferentes situaciones: tiempos de espera, pequeñas frustraciones asociadas a la satisfacción de necesidades básicas y cuidados."
            - id: "3"
              texto: "Aceptación y control progresivo de las emociones y de sus manifestaciones. Disfrute de las relaciones con las demás personas."
            - id: "3"
              texto: "Aproximación a algunas estrategias para lograr seguridad afectiva: búsqueda de ayuda y demanda de contacto afectivo."
        - bloque: "III. Hábitos de vida saludable para el autocuidado y el cuidado del entorno"
          saberes:
            - id: "1"
              texto: "Participación activa en los momentos de los cuidados y la atención a las necesidades básicas que se le ofrecen."
            - id: "2"
              texto: "Manifestación de interés por ofrecer un aspecto saludable y aseado. Participación activa en el desarrollo de actividades que favorecen la salud y generan bienestar."
            - id: "3"
              texto: "Participación e interés por el cuidado del entorno."
            - id: "4"
              texto: "Iniciación a la participación activa en el desarrollo de hábitos sostenibles y ecosocialmente responsables relacionados con la alimentación, la higiene, el aseo personal, el descanso o la limpieza del espacio."
            - id: "5"
              texto: "Adaptación progresiva de los ritmos biológicos propios a las rutinas del grupo."
            - id: "6"
              texto: "Iniciación en la interiorización de rutinas relacionadas con el compromiso y la autonomía: anticipación de acciones, normas de comportamiento social en la comida, el descanso, la higiene, los desplazamientos…"
        - bloque: "IV. Interacción socioemocional en el entorno. La vida junto a las demás personas"
          saberes:
            - id: "1"
              texto: "Transición del grupo familiar al grupo social en la escuela."
            - id: "1.1"
              texto: "Construcción de los primeros vínculos afectivos escolares."
            - id: "1.2"
              texto: "Construcción de sentimientos de pertenencia y vinculación afectiva con las personas de referencia escolar: el aula y el centro como grupos sociales de pertenencia."
            - id: "2"
              texto: "Acercamiento a la diversidad funcional y sus implicaciones en la vida cotidiana."
            - id: "2.1"
              texto: "Establecimiento de relaciones afectuosas y respetuosas."
            - id: "2.2"
              texto: "Reproducción de conductas a través del juego de imitación para el desarrollo de actitudes de respeto y empatía."
            - id: "3"
              texto: "Iniciación en el uso de estrategias elementales, con mediación de la persona adulta, para la gestión de conflictos."
            - id: "4"
              texto: "Adquisición paulatina de hábitos y regulación del comportamiento en función de las necesidades de los demás: escucha, paciencia y ayuda."
            - id: "5"
              texto: "Asunción de pequeñas responsabilidades en actividades y juegos."
            - id: "6"
              texto: "Participación activa y disfrute en celebraciones, costumbres y tradiciones étnicos-culturales presentes en el entorno."
            - id: "7"
              texto: "Acercamiento y disfrute del patrimonio natural y cultural de Canarias."
    - ciclo: "3-6"
      bloques:
        - bloque: "I. El cuerpo y el control progresivo del mismo"
          saberes:
            - id: "1"
              texto: "Construcción de la imagen global y segmentaria del cuerpo: características individuales y percepción de los cambios físicos."
            - id: "1.1"
              texto: "Control progresivo de la coordinación, el tono, el equilibrio y los desplazamientos."
            - id: "1.2"
              texto: "Dominio activo del tono y la postura en función de las características de los objetos, las acciones y las situaciones."
            - id: "1.3"
              texto: "Adquisición progresiva de autonomía en la realización de las tareas y en el uso de diversas estrategias que le permitan actuar con seguridad y confianza en las propias posibilidades."
            - id: "2"
              texto: "El juego como actividad placentera y fuente de aprendizaje. Participación y disfrute en diferentes tipos de juego: exploratorio, relacional, constructivo, simbólico, con reglas y motor."
            - id: "3"
              texto: "Construcción de una autoimagen positiva y ajustada ante las demás personas."
            - id: "3.1"
              texto: "Identificación y respeto de las diferencias."
            - id: "3.2"
              texto: "Sensibilización hacia las implicaciones que se derivan de la diversidad funcional en la vida cotidiana (sensorial, física, cognitiva…)."
            - id: "4"
              texto: "Conocimiento de los sentidos y sus funciones. Relación entre el cuerpo y el entorno."
        - bloque: "II. Desarrollo y equilibrio afectivos"
          saberes:
            - id: "1"
              texto: "Adquisición de herramientas para la identificación, expresión, aceptación y control progresivo de las propias emociones, sentimientos, vivencias, preferencias e intereses."
            - id: "2"
              texto: "Desarrollo de estrategias de ayuda y cooperación en contextos de juego y rutinas. Reconocimiento de las propias posibilidades."
            - id: "3"
              texto: "Desarrollo de estrategias para promover la seguridad en sí mismo o sí misma, el reconocimiento de sus posibilidades y la asertividad respetuosa hacia las demás personas."
            - id: "4"
              texto: "Identificación de las propias posibilidades para la ejecución de una tarea. Manifestaciones de superación y logro."
            - id: "5"
              texto: "Aceptación constructiva de los errores y las correcciones."
            - id: "6"
              texto: "Valoración del trabajo bien hecho: desarrollo inicial de hábitos y actitudes de esfuerzo, constancia, organización, atención e iniciativa."
        - bloque: "III. Hábitos de vida saludable para el autocuidado y el cuidado del entorno"
          saberes:
            - id: "1"
              texto: "Creación y mantenimiento de hábitos y prácticas sostenibles y ecosocialmente responsables relacionados con la alimentación, la higiene, el descanso, el autocuidado y el cuidado del entorno."
            - id: "2"
              texto: "Planificación secuenciada de acciones para resolver una tarea: normas de comportamiento social en la comida, el descanso, la higiene, los desplazamientos…"
            - id: "3"
              texto: "Participación en actividad física estructurada con diferentes grados de intensidad."
            - id: "4"
              texto: "Necesidades básicas: manifestación, regulación y control, en relación con el bienestar personal."
            - id: "5"
              texto: "Identificación de situaciones peligrosas y reconocimiento de acciones para la prevención de riesgos y accidentes."
        - bloque: "IV. Interacción socioemocional en el entorno. La vida junto a las demás personas"
          saberes:
            - id: "1"
              texto: "Incorporación armónica a la escuela."
            - id: "2"
              texto: "Despliegue progresivo de habilidades socioafectivas y de convivencia."
            - id: "2.1"
              texto: "Comunicación de sentimientos y emociones."
            - id: "2.2"
              texto: "Interiorización de pautas básicas de convivencia, que incluyan el respeto a la igualdad entre mujeres y hombres y el rechazo a cualquier tipo de discriminación. Cuestionamiento de estereotipos y prejuicios."
            - id: "2.3"
              texto: "Adquisición de estrategias de autorregulación de la conducta."
            - id: "2.4"
              texto: "Expresión de empatía y respeto."
            - id: "3"
              texto: "Descubrimiento de la diversidad familiar."
            - id: "4"
              texto: "Establecimiento de la amistad como elemento protector, de prevención de la violencia y de desarrollo de la cultura de paz."
            - id: "5"
              texto: "Resolución de conflictos surgidos en interacciones con las demás personas."
            - id: "6"
              texto: "Adquisición y empleo de fórmulas de cortesía e interacción social positiva."
            - id: "7"
              texto: "Manifestación de actitud de ayuda y cooperación."
            - id: "8"
              texto: "Reconocimiento y respuesta empática hacia la diversidad y a sus implicaciones en la vida cotidiana."
            - id: "9"
              texto: "Desarrollo del juego simbólico. Observación, imitación y representación de personas, personajes y situaciones."
            - id: "10"
              texto: "Descubrimiento de otros grupos sociales de pertenencia: características, funciones y servicios."
            - id: "11"
              texto: "Participación activa en celebraciones, costumbres y tradiciones."
            - id: "11.1"
              texto: "Adquisición de herramientas para el aprecio de las señas de identidad étnico-cultural presentes en el entorno."
            - id: "11.2"
              texto: "Acercamiento y disfrute del patrimonio cultural y del natural de Canarias."
  criterios_evaluacion:
    - ciclo: "0-3"
      criterios:
        - id: "1.1"
          texto: "Iniciarse en el descubrimiento de su cuerpo y en el reconocimiento de la propia imagen, así como en la identificación de las características personales básicas y de las diferencias respecto a otras personas, y avanzar, de manera paulatina, en el control del movimiento y la postura del cuerpo, a partir de interacciones lúdicas, tanto espontáneas como sugeridas, con el medio y con otras personas, explorando sus posibilidades motoras, sensoriales y perceptivas, con la finalidad de reconocerse como persona diferenciada de las demás y formarse una autoimagen positiva, de vivir con placer la actividad sensomotriz y de adquirir mayor autonomía en sus desplazamientos."
        - id: "1.2"
          texto: "Explorar el mundo que le rodea y sus propias posibilidades perceptivas, a través de la participación en experiencias activas y de movimiento libre en el entorno, y de la manipulación de materiales y utensilios comunes, en situaciones lúdicas, naturales y constructivas, iniciándose en la integración sensorial del mundo para adquirir, paulatinamente, seguridad y autonomía en actividades de la vida cotidiana, y progresar en la coordinación visomotriz."
        - id: "2.1"
          texto: "Expresar necesidades, emociones básicas y sentimientos, de manera progresiva y con la mediación de una persona adulta, en actividades lúdicas y de intercambio comunicativo, con el fin de iniciarse en el desarrollo progresivo de la conciencia emocional así como de estrategias de regulación emocional."
        - id: "2.2"
          texto: "Disfrutar relacionándose con otras personas de manera libre, segura, respetuosa y alejada de estereotipos, con la finalidad de aceptar y mostrar afecto."
        - id: "2.3"
          texto: "Afrontar pequeñas adversidades, manifestando actitudes de superación, solicitando y prestando ayuda, con la finalidad de avanzar en el despliegue de algunas estrategias básicas de seguridad afectiva y bienestar."
        - id: "3.1"
          texto: "Incorporar, de manera progresiva, hábitos saludables, disfrutando de la actividad física e incorporar, de manera progresiva, estrategias y hábitos relacionados con el cuidado del entorno, en actividades cotidianas de alimentación, descanso e higiene, manifestando satisfacción por los beneficios que le aportan, con el fin de adquirir progresivamente actitudes ecosocialmente responsables y de autonomía en las actividades de cuidado personal."
        - id: "3.2"
          texto: "Reconocer y anticipar algunas nociones temporales básicas para ubicarse en el tiempo, a través de las actividades y rutinas de la vida cotidiana, e iniciarse en la anticipación que estructura la dinámica de los tiempos en el aula, asociándolas a procedimientos concretos, con la finalidad de adaptar, de manera paulatina, sus ritmos biológicos a las rutinas del grupo."
        - id: "4.1"
          texto: "Establecer vínculos y relaciones de apego saludables, demostrando actitudes de afecto y empatía hacia sus iguales y las personas adultas, y respetando los distintos ritmos individuales, con el fin de realizar una transición armónica del grupo familiar a la escuela y de desarrollar los primeros vínculos afectivos escolares."
        - id: "4.2"
          texto: "Reproducir conductas y situaciones previamente observadas en su entorno próximo, a través de juegos de imitación, con el fin de desarrollar, de manera paulatina, sentimientos de pertenencia y actitudes de respeto y empatía, igualdad de género, trato no discriminatorio y respeto a los derechos humanos."
        - id: "4.3"
          texto: "Iniciarse en la resolución de conflictos con sus iguales, con la mediación de la persona adulta, experimentando los beneficios de llegar a acuerdos."
        - id: "4.4"
          texto: "Desarrollar progresivamente actitudes de espera y de participación activa, en juegos individuales o con iguales, con el fin de iniciarse en la asunción de algunas responsabilidades."
        - id: "4.5"
          texto: "Participar, de manera activa, de las actividades relacionadas con costumbres y tradiciones presentes en el entorno próximo, demostrando interés por el patrimonio cultural de Canarias, con el fin de iniciarse en el respeto hacia la diversidad cultural."
    - ciclo: "3-6"
      criterios:
        - id: "1.1"
          texto: "Reconocer las características y partes de su cuerpo, de manera global y segmentada, percibiendo sus cambios, así como sus posibilidades de acción, y avanzar en el control dinámico de sus desplazamientos y movimientos, adquiriendo, de forma progresiva, mayor precisión, coordinación, dominio del tono y de la postura, seguridad, equilibrio e intencionalidad, con la finalidad de progresar en el conocimiento de su cuerpo y de adquirir mayor autonomía y confianza."
        - id: "1.2"
          texto: "Progresar en la integración sensorial del mundo a través de la aplicación de distintas estrategias que le permitan reconocer los sentidos y sus funciones, manifestando sentimientos de seguridad personal y confiando en sus propias posibilidades, con la finalidad de actuar de una manera cada vez más autónoma en su entorno social."
        - id: "1.3"
          texto: "Participar en contextos de juego dirigido y espontáneo, ajustándose a sus posibilidades personales, demostrando control de su cuerpo y mayor autonomía e independencia respecto a las personas adultas, con la finalidad de lograr un desarrollo integral y armónico."
        - id: "1.4"
          texto: "Manejar diferentes objetos, útiles y herramientas, en situaciones de juego y en la realización de tareas cotidianas mostrando un control progresivo y de coordinación de movimientos de carácter fino."
        - id: "2.1"
          texto: "Identificar y expresar sus necesidades, sentimientos, vivencias, preferencias e intereses, en distintos momentos, tanto de juego como en las rutinas y las tareas compartidas, para avanzar en el control progresivo de sus emociones."
        - id: "2.2"
          texto: "Ofrecer y pedir ayuda, en situaciones de juego, tareas y actividades, reconociendo sus propias posibilidades, con la finalidad de desarrollar estrategias de ayuda y cooperación con sus iguales así como autoconfianza."
        - id: "2.3"
          texto: "Identificar sus posibilidades de acción para la ejecución de tareas propuestas, aceptando con actitud positiva las críticas constructivas y valorando el trabajo bien hecho, con la finalidad de establecer, de manera progresiva, con creatividad y actitud de superación y logro, metas alcanzables."
        - id: "3.1"
          texto: "Participar, con interés y disfrute, en actividades relacionadas con el autocuidado y el cuidado del entorno, con el fin de desarrollar una actitud respetuosa y demostrar autoconfianza e iniciativa en la creación y mantenimiento de hábitos sostenibles y ecosocialmente responsables en diferentes espacios, incluidos las zonas naturales al aire libre."
        - id: "3.2"
          texto: "Respetar la secuencia temporal, mostrando capacidad de anticipación a los acontecimientos y de adaptación a las rutinas establecidas para el grupo, con el fin de desarrollar comportamientos respetuosos hacia las demás personas en las propuestas cotidianas."
        - id: "3.3"
          texto: "Mostrar autonomía en las actividades de cuidado e higiene personal, manifestando interés en su presentación personal, con el fin de avanzar en la autonomía para atender a sus necesidades básicas."
        - id: "3.4"
          texto: "Participar en el desarrollo de actividades físicas estructuradas, con diferentes grados de intensidad, en todos los espacios disponibles del centro y, de manera específica, en espacios abiertos escolares y extraescolares, a partir de propuestas que impliquen movimiento, con el fin de disfrutar de los beneficios que implica para su salud y bienestar personal."
        - id: "3.5"
          texto: "Implementar iniciativas de prevención de riesgos, en situaciones cotidianas, a través de la identificación de situaciones de peligro potencial, con la finalidad de evitar accidentes."
        - id: "4.1"
          texto: "Establecer relaciones armoniosas con las demás personas y con el mundo, creando lazos de amistad, como instrumento de prevención de la violencia y de desarrollo de la cultura de paz, con la finalidad de adquirir seguridad y confianza en la creación de vínculos de apego sanos y estables, alejados de estereotipos sexistas."
        - id: "4.2"
          texto: "Demostrar actitudes de afecto y de empatía, en situaciones de relación con otras personas, juegos y actividades colectivas, con la finalidad de avanzar en el desarrollo de actitudes de respeto hacia los ritmos individuales, evitando todo tipo de discriminación."
        - id: "4.3"
          texto: "Identificar pautas básicas de convivencia e interiorizar, de manera natural y progresiva, modelos adecuados de relación social, participando activamente en propuestas relacionadas con la reflexión sobre las normas sociales que regulan la convivencia y promueven valores como el respeto a la diversidad, el trato no discriminatorio hacia las personas con diversidad funcional y la igualdad entre mujeres y hombres."
        - id: "4.4"
          texto: "Reproducir conductas, acciones o situaciones a través del juego simbólico en interacción con sus iguales, identificando y rechazando todo tipo de estereotipos."
        - id: "4.5"
          texto: "Participar, de manera activa, en actividades relacionadas con costumbres y tradiciones de la propia cultura así como de otras presentes en su entorno, demostrando respeto e interés por el conocimiento del patrimonio cultural y del natural de Canarias, con la finalidad de apreciar las propias señas de identidad así como la diversidad cultural."
        - id: "4.6"
          texto: "Progresar en la construcción de una autoimagen positiva y ajustada, a partir del reconocimiento de las cualidades personales y la identificación de las diferencias respecto a otras personas de su entorno escolar, familiar y social, demostrando sensibilidad hacia la diversidad funcional para avanzar en la construcción de una autoimagen positiva y en el respeto a las diferencias."
relaciones:
  desarrolla_a: [NOR-047]
  relacionada_con: []
observaciones: "TAREA-079 (2026-08-05): verificadas las 4 competencias específicas contra la copia re-exportada en 07_corpus_ia/textos-completos/texto-oficial-NOR-047-... (ANEXO 2, ÁREA 1, bloques competenciales, págs. 41052-41056). Se corrige C4: el enunciado anterior incluía la frase 'hacia sus iguales y las personas adultas', que en el decreto pertenece al criterio de evaluación 4.1, no al enunciado de la competencia (idéntico en primer y segundo ciclo); queda ahora 'Establecer interacciones sociales en condiciones de igualdad, valorando la importancia de la amistad, el respeto y la empatía, para construir su propia identidad basada en valores democráticos y de respeto a los derechos humanos.' C1, C2 y C3 ya eran literales y no cambian. criterios_evaluacion recoge ahora, transcritos literalmente de las mismas páginas del BOC, los doce criterios del primer ciclo y los dieciocho del segundo (cifras que coinciden con las que anuncia el propio decreto). saberes_basicos recoge, para cada uno de los dos ciclos, los cuatro bloques (I-IV) con sus saberes numerados, también transcritos literalmente. [PENDIENTE] En el Bloque II del primer ciclo (Desarrollo y equilibrio afectivos), el texto oficial numera sus tres saberes como '1', '3' y '3' (sin '2'); se transcribe tal cual figura en la copia re-exportada del BOC, sin corregir la numeración, y queda pendiente de verificar visualmente contra la maquetación original del BOC si se trata de una errata de la norma o de un artefacto de extracción. En Educación Infantil no existen los descriptores operativos del perfil de salida, que es de la enseñanza básica (DEC-0009), así que el cuarto elemento de DEC-0004 no aplica a esta ficha; con competencias, criterios y saberes literales, la ficha queda completa."
