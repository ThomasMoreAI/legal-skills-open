observaciones: "Materia optativa impartida en 1.º a 3.º de ESO (distinta de la materia «Tecnología», optativa de 4.º ESO, que el Decreto 30/2023 regula en un bloque competencial aparte y no está cubierta por esta ficha). Las siete competencias específicas (C1-C7) llevan ahora el enunciado literal del decreto y sus descriptores operativos del perfil de salida por curso (DEC-0008), verificados con 11_calidad/extraer_descriptores.py. Los criterios de evaluación y los saberes básicos ya recogidos en la ficha se mantienen sin cambios; no reproducen los criterios íntegros del anexo, solo una selección representativa."
