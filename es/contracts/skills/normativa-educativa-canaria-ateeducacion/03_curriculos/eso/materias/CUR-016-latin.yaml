  criterios_evaluacion:
    - id: 1.1
      texto: "Traducir textos latinos muy sencillos utilizando el diccionario y los conocimientos gramaticales básicos."
    - id: 4.1
      texto: "Identificar étimos latinos y explicar su evolución hacia el español y el habla de Canarias."
