observaciones: "En 1.º a 3.º de ESO el Decreto 30/2023 agrupa las diez competencias específicas de dos en dos (C1+C2, C3+C4, C5+C6, C7+C8, C9+C10) bajo un único bloque competencial y un único conjunto de descriptores por curso; en 4.º ESO la materia se desdobla en dos itinerarios, Matemáticas A y Matemáticas B, cada uno con su propio bloque competencial. Las diez competencias (C1-C10) llevan ahora el enunciado literal del decreto y sus descriptores operativos del perfil de salida por curso e itinerario (DEC-0008), verificados con 11_calidad/extraer_descriptores.py; el decreto asigna el mismo conjunto de descriptores en los cinco bloques para cada pareja de competencias. Los criterios de evaluación y los saberes básicos ya recogidos en la ficha se mantienen sin cambios; no reproducen los criterios íntegros del anexo, solo una selección representativa."
