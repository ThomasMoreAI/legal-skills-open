resumen_ia: 'Currículo de Educación Emocional y para la Creatividad en Educación Primaria Canarias (Decreto 211/2022), materia transversal propia del currículo canario impartida en los seis cursos de la etapa. Cuatro competencias específicas (C1-C4) que se concretan en ocho criterios de evaluación en Primer y Segundo ciclo y siete en Tercer ciclo, con saberes básicos organizados en cinco bloques, no independientes sino interrelacionados: Conciencia emocional, Autorregulación emocional responsable y resiliencia educativa, Empatía, comunicación e interacción socioemocional, Autoconfianza creativa, y Emprendeduría social.'
observaciones: Extracción literal completada el 2026-08-05 a partir de la reexportación en texto plano del PDF oficial del BOC (07_corpus_ia/textos-completos/texto-oficial-NOR-043-decreto-211-2022-primaria.txt, TAREA-077). Los enunciados de competencias específicas y los criterios de evaluación se han extraído literalmente del Anexo 2, contrastando el número de competencias (cuatro) y de criterios de evaluación (ocho en Primer y Segundo ciclo, siete en Tercer ciclo) contra lo declarado explícitamente en el propio decreto. Los descriptores operativos varían según el ciclo en las competencias C1, C2, C3 y C4, conforme a DEC-0008. Los saberes básicos se recogen a nivel de bloque (I-V) con los títulos literales del decreto; no se han transcrito los ítems numerados individuales de cada bloque. Corrige los títulos de los bloques III, IV y V de saberes básicos, que en la ficha anterior no se correspondían con el texto oficial (el decreto los denomina «Empatía, comunicación e interacción socioemocional», «Autoconfianza creativa...» y «Emprendeduría social...», y no «Autonomía emocional y bienestar personal» ni «Competencia social» ni «Creatividad y emprendimiento social» como figuraba antes).
