  saberes_basicos:
    - bloque: 'I. Conciencia emocional: percepción, identificación, comprensión y aceptación responsable de las propias emociones'
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Aplicación multimodal y uso de estrategias inclusivas para la integración de vocabulario emocional, identificación, categorización, percepción, reconocimiento, comprensión y expresión de las emociones, con el fin de tomar conciencia de las propias emociones y contribuir al autodescubrimiento.
    - bloque: II. Autorregulación emocional responsable y resiliencia educativa
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Gestión y regulación de las experiencias emocionales propias, tanto adaptativas como desadaptativas; estrategias emocionales, resiliencia y automotivación; tolerancia a la frustración, autoestima y habilidades socioemocionales para la vida.
    - bloque: III. Empatía, comunicación e interacción socioemocional
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Vinculación emocional para que las relaciones alcancen el impacto deseado; escucha activa, empatía, diálogo reflexivo y comunicación afectiva para crear un clima emocional apropiado que favorezca el vínculo afectivo y efectivo.
    - bloque: 'IV. Autoconfianza creativa: técnicas creativas aplicadas a múltiples lenguajes expresivos y estimulación multisensorial'
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Aplicación de técnicas para incrementar el potencial creativo del alumnado atendiendo a la dimensión holística de la persona (cognitiva, afectiva, social, motriz); trabajo de la autoconfianza en las propias capacidades creativas.
    - bloque: 'V. Emprendeduría social: compromiso y vínculo con las personas como recurso de la creatividad emocional'
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Desarrollo del espíritu emprendedor desde una vertiente social y de compromiso con las demás personas; identificación y gestión de estados emocionales para superar las dificultades en la generación de un proyecto personal, social o medioambiental.
  criterios_evaluacion:
    - ciclo: Primer ciclo
      criterios:
        - 1.1. Percibir las sensaciones corporales asociadas a experiencias emocionales básicas, identificando y nombrando dichas emociones, y reconociéndose como propias, para favorecer el desarrollo paulatino de la conciencia emocional.
        - 1.2. Comprender las emociones que experimenta, estableciendo una relación entre ellas y los sucesos que las originan y las consecuencias que provocan, para desarrollar de forma gradual el autoconocimiento emocional y favorecer la convivencia positiva a través de una comunicación adecuada.
        - 2.1. Actuar con responsabilidad en el contexto escolar, tomando decisiones conscientes a partir de sus emociones y asumiendo las consecuencias de sus actos, para desarrollar un ajuste afectivo satisfactorio y mejorar las relaciones interpersonales.
        - 2.2. Regular las experiencias emocionales a través de la reflexividad, la tolerancia a la frustración y la superación de dificultades, para desarrollar la autorregulación de la impulsividad emocional y favorecer el establecimiento de relaciones interpersonales positivas.
        - 3.1. Comunicar, de manera sincera, las experiencias emocionales propias a las demás personas, a través del lenguaje verbal y no verbal, escuchándolas y aceptando sus sentimientos, para establecer relaciones positivas con las personas con las que interactúa.
        - 3.2. Reconocer las emociones en las demás personas expresando sentimientos hacia ellas, observando modelos empáticos y promoviendo la conciencia emocional, como medio para desarrollar la empatía y los vínculos emocionales.
        - 4.1. Identificar los principios y las estrategias de pensamiento creativo, iniciándose en la utilización de múltiples lenguajes, y percibiendo e interpretando la realidad a través de la estimulación multisensorial; así como los obstáculos sociales y emocionales que bloquean el potencial creativo, con el fin de promover la expresión de la creatividad y la autoconfianza en las propias capacidades creativas.
        - 4.2. Favorecer el compromiso emocional con las demás personas, a través de la participación, elaboración e implementación de proyectos colectivos de carácter emprendedor, usando sus capacidades creativas y actitudes innovadoras para proporcionar beneficios a la comunidad.
    - ciclo: Segundo ciclo
      criterios:
        - 1.1. Identificar las experiencias emocionales percibidas mediante las sensaciones corporales, validándolas y reconociéndolas como propias, para favorecer el autodescubrimiento personal y la conciencia emocional.
        - 1.2. Comprender y analizar las emociones que experimenta, reflexionando y estableciendo relaciones entre ellas y los sucesos que las originan, así como las consecuencias derivadas de las mismas, para adecuar sus reacciones y favorecer su autoconocimiento emocional.
        - 2.1. Actuar en diferentes contextos, asumiendo la responsabilidad de sus propias decisiones, a partir de sus experiencias emocionales y los efectos de estas en la propia conducta, para desarrollar progresivamente un ajuste afectivo satisfactorio y mejorar las relaciones interpersonales.
        - 2.2. Regular las experiencias emocionales desajustadas, adecuando su intensidad, duración y vivencia desagradable, utilizando estrategias de respiración y de relajación corporal, para desarrollar, de manera paulatina, un ajuste afectivo satisfactorio.
        - 3.1. Comunicar, de manera asertiva, las experiencias emocionales propias, utilizando un lenguaje verbal y no verbal, escuchando y comprendiendo los sentimientos de las demás personas y demostrando una actitud de respeto y de apertura hacia ellas, para establecer vínculos con sus compañeros o compañeras, y con las demás personas con las que interactúa.
        - 3.2. Reconocer las emociones en las demás personas, expresando sentimientos hacia ellas, experimentando con modelos empáticos y promoviendo la conciencia emocional, como medio para fomentar la empatía y la vinculación emocional.
        - 4.1. Experimentar los principios y las estrategias de pensamiento creativo, utilizando múltiples lenguajes, percibiendo e interpretando la realidad a través de la estimulación multisensorial, comprendiendo las causas que bloquean el potencial creativo, con el fin de promover la expresión de la creatividad y la autoconfianza en las propias capacidades creativas.
        - 4.2. Desarrollar el compromiso emocional con las demás personas, a través de la participación, elaboración e implementación de proyectos colectivos de carácter emprendedor, usando sus capacidades creativas y actitudes innovadoras para proporcionar beneficios a la comunidad.
    - ciclo: Tercer ciclo
      criterios:
        - 1.1. Analizar y asumir las propias experiencias emocionales, a partir de la percepción corporal de estas, y su reconocimiento en situaciones de su vida cotidiana, utilizando estrategias de autoconciencia, de modo que todo ello favorezca el desarrollo de la conciencia emocional y el autoconocimiento personal.
        - 2.1. Actuar en diferentes contextos, asumiendo la responsabilidad emocional y su influencia en la propia conducta, y reparando, si fuera necesario, los daños causados, para desarrollar un ajuste afectivo satisfactorio y las relaciones interpersonales.
        - 2.2. Cambiar, de manera consciente, las experiencias emocionales desajustadas, sustituyéndolas o compensándolas por otras emociones adaptativas, para desarrollar la capacidad de modificación afectiva.
        - 3.1. Comunicar, de manera asertiva, las experiencias emocionales propias a las demás personas, a través del lenguaje verbal y no verbal, abriéndose a conocerlas y a dejarse conocer, para establecer vínculos afectivos y desarrollar una sociabilidad emocional auténtica.
        - 3.2. Reconocer las emociones en las demás personas y experimentar sentimientos hacia ellas, a través del desarrollo de escucha activa, aplicando modelos empáticos y promoviendo la conciencia emocional, en situaciones de relación interpersonal, de manera que se desarrolle la solidaridad y el altruismo.
        - 4.1. Aplicar principios y estrategias de pensamiento creativo, utilizando múltiples lenguajes, experimentando de forma consciente nuevas maneras de percibir e interpretar la realidad, y superando los obstáculos sociales y emocionales que limitan su potencial creativo, con el fin de promover la expresión de la propia creatividad y la autoconfianza en las propias capacidades creativas.
        - 4.2. Comprometerse emocionalmente con las demás personas, a través de la participación, elaboración e implementación de proyectos colectivos de carácter emprendedor, usando sus capacidades creativas y actitudes innovadoras para proporcionar beneficios a la comunidad.
