  saberes_basicos:
    - bloque: I. Sentido numérico
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Comprensión, representación y uso flexible de la estructura del sistema de numeración decimal, de las propiedades de las operaciones y de las relaciones entre ellas; cálculo con algoritmos razonados, abiertos y flexibles; estimación razonable; uso de la calculadora y medios tecnológicos.
    - bloque: II. Sentido de la medida
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Comprensión y comparación de atributos medibles de los objetos; elección de unidades adecuadas para estimar, medir y comparar; uso de instrumentos de medición; investigación en torno a las medidas tradicionales canarias.
    - bloque: III. Sentido espacial
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Ubicación y orientación en el espacio; análisis de características y propiedades de cuerpos y figuras geométricas; localización y descripción de relaciones espaciales mediante coordenadas y otros sistemas de representación; trabajo manipulativo con materiales.
    - bloque: IV. Sentido algebraico y pensamiento computacional
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Reconocimiento de patrones y relaciones de dependencia entre variables; expresión de regularidades mediante diferentes representaciones; modelización de situaciones matemáticas o del mundo real con expresiones simbólicas; integración transversal de la tecnología digital.
    - bloque: V. Sentido estocástico
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Razonamiento e interpretación de datos, valoración crítica y toma de decisiones a partir de información estadística; comprensión y comunicación de fenómenos aleatorios; investigaciones estadísticas básicas en equipo; nociones básicas de probabilidad a través del juego.
    - bloque: VI. Sentido socioafectivo
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Conocimientos, destrezas y actitudes para entender las emociones ante las matemáticas; combate de actitudes negativas y de estereotipos de género; aprendizaje activo individual y en grupo; conocimiento de las contribuciones de las mujeres a las matemáticas a lo largo de la historia.
  criterios_evaluacion:
    - ciclo: Primer ciclo
      criterios:
        - 1.1. Entender y describir la situación planteada, discriminando la información relevante y el objetivo a conseguir para lograr la comprensión de la situación, y elaborando dibujos o diagramas que ayuden en la búsqueda de estrategias para su resolución.
        - 2.1. Reconocer alguna estrategia que resuelva problemas aritméticos, geométricos, lógicos y aplicarla para obtener las posibles soluciones.
        - 2.2. Elegir y utilizar las operaciones pertinentes para la resolución de problemas que involucren la estructura aditiva; plantear problemas coherentes que se resuelvan con operaciones dadas, utilizando la calculadora cuando las cantidades lo precisen; ofrecer representaciones gráficas adecuadas y explicarlas con un vocabulario matemático apropiado a su nivel.
        - 2.3. Revisar la validez de las soluciones del problema y su coherencia con la pregunta expresando oralmente el proceso seguido.
        - 3.1. Realizar conjeturas matemáticas sencillas de forma guiada, investigando patrones, propiedades y relaciones, utilizando materiales manipulativos, representaciones gráficas o la calculadora, para extraer conclusiones, comunicarlas de forma verbal, manipulativa o gráfica.
        - 3.2. Identificar problemas en situaciones cotidianas que se resuelven matemáticamente, revisar la adecuación de los pasos seguidos para ver las conexiones entre las matemáticas y las situaciones cercanas.
        - 4.1. Describir rutinas sencillas de la vida cotidiana que se realicen paso a paso, identificando patrones a partir de regularidades, utilizando secuencias numéricas o gráficas y reorganizando algoritmos sencillos.
        - 4.2. Resolver problemas que impliquen secuencias o patrones, de forma guiada, utilizando las herramientas adecuadas, entre ellas las tecnológicas.
        - 5.1. Reconocer conexiones entre todos los sentidos y entre las matemáticas implicadas en las diferentes áreas, movilizando conocimientos y experiencias propias, para una mejor comprensión de los aprendizajes adquiridos.
        - 5.2. Reconocer algunas conexiones entre las matemáticas y la vida cotidiana para interpretar problemas en contextos no matemáticos, mostrando actitudes que favorezcan su resolución desde un punto de vista sostenible.
        - 6.1. Reconocer y comprender el lenguaje matemático sencillo presente en la vida cotidiana, en diferentes formatos, adquiriendo vocabulario básico, para transmitir información matemática.
        - 6.2. Comunicar de forma verbal o gráfica ideas y procesos matemáticos, utilizando lenguaje matemático adecuado e intercambiando información, para dar significado y permanencia a las ideas matemáticas.
        - 7.1. Reconocer las emociones propias, desarrollando así la autoconfianza, empleando actitudes positivas, tales como la responsabilidad, ante nuevos retos matemáticos y valorando el error como una oportunidad de aprendizaje.
        - 8.1. Participar en el trabajo en equipo, desarrollando la escucha activa y la resolución pacífica de conflictos y cumpliendo las responsabilidades individuales para la consecución de objetivos compartidos.
    - ciclo: Segundo ciclo
      criterios:
        - 1.1. Interpretar de forma verbal y gráfica problemas de la vida cotidiana, discriminando datos, relaciones y objetivo para lograr la comprensión del problema, elaborando diagramas u otras representaciones matemáticas que ayuden en la búsqueda y elección de estrategias para la comprensión de la situación planteada.
        - 2.1. Elegir alguna estrategia que resuelva problemas aritméticos, geométricos, lógicos, de patrones, justificando dicha elección, y aplicarla para obtener las posibles soluciones, utilizando otras estrategias si la elegida no lleva a la solución.
        - 2.2. Elegir y utilizar las operaciones pertinentes para la resolución de problemas aritméticos con las estructuras aditiva o multiplicativa; plantear problemas coherentes que se resuelvan con operaciones dadas, utilizando la calculadora cuando las cantidades lo precisen; ofrecer representaciones gráficas adecuadas y argumentarlas.
        - 2.3. Confirmar la validez de las soluciones del problema y su coherencia en el contexto planteado, explicando el proceso seguido, planteándose preguntas y expresando sus reflexiones verbalmente o por escrito.
        - 3.1. Analizar conjeturas matemáticas sencillas de forma pautada, investigando patrones, propiedades y relaciones, utilizando materiales manipulativos, representaciones gráficas o la calculadora, para extraer conclusiones, comunicarlas y argumentarlas de forma verbal, manipulativa, gráfica o a través de medios tecnológicos.
        - 3.2. Identificar y analizar problemas sobre situaciones cotidianas que puedan resolverse mediante las matemáticas, comprobando la validez de las soluciones obtenidas y su coherencia en el contexto, para establecer conexiones entre las matemáticas y los fenómenos que ocurren a su alrededor.
        - 4.1. Automatizar rutinas sencillas en contextos cotidianos identificando patrones a partir de regularidades, utilizando secuencias numéricas, geométricas o gráficas, haciendo predicciones razonadas, comprobando la validez de las mismas y modificando algoritmos dados.
        - 4.2. Resolver problemas organizando la información, descomponiendo en partes más simples, modificando y creando algoritmos de forma guiada, así como utilizando las herramientas adecuadas, entre ellas las tecnológicas.
        - 5.1. Explicar las conexiones entre todos los sentidos y entre las matemáticas implicadas en las diferentes áreas, movilizando conocimientos y experiencias propias, para una comprensión más profunda de los aprendizajes adquiridos, afrontando nuevos retos.
        - 5.2. Explicar las conexiones entre las matemáticas, otras áreas y la vida cotidiana para interpretar y resolver problemas en contextos no matemáticos y tomar decisiones desde una perspectiva sostenible y respetuosa.
        - 6.1. Reconocer y comprender el lenguaje matemático sencillo presente en la vida cotidiana, en diferentes formatos, adquiriendo vocabulario para transmitir mensajes con información matemática.
        - 6.2. Comunicar en diferentes formatos los procesos e ideas matemáticas utilizando lenguaje matemático adecuado, argumentando e intercambiando información de forma crítica y creativa para dar significado y permanencia a las ideas matemáticas.
        - 7.1. Identificar y describir las emociones propias, y reconocer algunas fortalezas y debilidades, desarrollando así la autoconfianza, empleando actitudes positivas, tales como la perseverancia y la responsabilidad ante nuevos retos matemáticos, y valorando el error como una oportunidad de aprendizaje.
        - 8.1. Colaborar en el trabajo en equipo mostrando iniciativa, desarrollando la escucha activa y la comunicación asertiva, valorando la diversidad, asumiendo las responsabilidades individuales y empleando estrategias cooperativas para la consecución de objetivos compartidos.
    - ciclo: Tercer ciclo
      criterios:
        - 1.1. Interpretar y reformular, de forma verbal y gráfica, problemas de la vida cotidiana, discriminando datos, relaciones y objetivo, para lograr la comprensión del problema, elaborando diagramas u otras representaciones matemáticas, incluidas las tecnológicas, que ayuden en la búsqueda y elección de estrategias para la resolución de problemas.
        - 2.1. Elegir de forma autónoma alguna estrategia que resuelva problemas aritméticos, geométricos, lógicos, de patrones, justificando dicha elección y aplicarla para obtener las posibles soluciones, perseverando en otras estrategias si la elegida no lleva a la solución.
        - 2.2. Elegir y utilizar las operaciones pertinentes para la resolución de problemas que combinen las estructuras aditiva y multiplicativa; plantear problemas coherentes que se resuelvan con operaciones dadas, utilizando la calculadora cuando las cantidades lo precisen; y ofrecer representaciones gráficas adecuadas y argumentarlas.
        - 2.3. Comprobar la validez de las soluciones del problema y su coherencia en el contexto planteado, reflexionando sobre el proceso seguido, planteándose preguntas y expresando sus conclusiones verbalmente o por escrito.
        - 3.1. Formular conjeturas matemáticas sencillas, investigando patrones, propiedades y relaciones, utilizando materiales manipulativos, representaciones gráficas o herramientas digitales, para extraer conclusiones, comunicarlas y argumentarlas de forma verbal, manipulativa, gráfica o a través de medios tecnológicos.
        - 3.2. Plantear problemas sobre situaciones cotidianas relacionadas con los sentidos numérico, de la medida, espacial, algebraico y estocástico que puedan resolverse mediante las matemáticas; comprobar y analizar de forma crítica la validez de las soluciones obtenidas y su coherencia en el contexto para establecer conexiones entre las matemáticas, su entorno cercano y otras áreas del currículo.
        - 4.1. Modelizar rutinas en contextos diversos, identificando patrones a partir de regularidades, utilizando secuencias numéricas, geométricas o gráficas; hacer predicciones razonadas comprobando la validez de las mismas; y crear algoritmos sencillos.
        - 4.2. Resolver problemas y realizar pequeñas investigaciones, utilizando las herramientas adecuadas, entre ellas las tecnológicas.
        - 5.1. Utilizar las conexiones entre todos los sentidos y entre las matemáticas implicadas en las diferentes áreas, movilizando conocimientos y experiencias propias, para una comprensión más profunda de los aprendizajes adquiridos, afrontar nuevos retos y adoptar decisiones informadas.
        - 5.2. Utilizar las conexiones entre las matemáticas, otras áreas y la vida cotidiana para realizar proyectos, empleando, entre otros, recursos digitales; y resolver problemas en contextos no matemáticos que permitan tomar decisiones desde una perspectiva crítica, sostenible y respetuosa.
        - 6.1. Reconocer y comprender el lenguaje matemático presente en la vida cotidiana y en otros contextos, en diferentes formatos, adquiriendo vocabulario preciso para transmitir mensajes con información matemática.
        - 6.2. Comunicar en diferentes formatos, incluido el digital, las conjeturas y procesos matemáticos utilizando lenguaje matemático adecuado, planificando previamente su exposición, argumentando e intercambiando información de forma crítica y creativa para dar significado y permanencia a las ideas matemáticas.
        - 7.1. Identificar y autorregular las emociones propias y reconocer algunas fortalezas y debilidades, desarrollando así la autoconfianza, empleando actitudes positivas, tales como el esfuerzo, la perseverancia y la responsabilidad ante nuevos retos matemáticos, y valorando el error como una oportunidad de aprendizaje.
        - 8.1. Colaborar en el trabajo en equipo, mostrando iniciativa, desarrollando la escucha activa y la comunicación asertiva, valorando la diversidad, participando en el reparto de tareas, asumiendo las responsabilidades individuales y empleando estrategias cooperativas, para la consecución de objetivos compartidos.
