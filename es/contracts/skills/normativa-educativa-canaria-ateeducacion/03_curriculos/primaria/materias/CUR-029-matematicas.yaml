resumen_ia: 'Currículo de Matemáticas en Educación Primaria Canarias (Decreto 211/2022), impartida en los seis cursos de la etapa. Ocho competencias específicas (C1-C8) organizadas en seis bloques competenciales (C1+C2 y C7+C8 se unifican, respectivamente, en un único bloque, según el propio decreto), que se concretan en catorce criterios de evaluación por ciclo. Saberes básicos estructurados en seis «sentidos»: numérico, de la medida, espacial, algebraico y pensamiento computacional, estocástico, y socioafectivo.'
observaciones: Extracción literal completada el 2026-08-05 a partir de la reexportación en texto plano del PDF oficial del BOC (07_corpus_ia/textos-completos/texto-oficial-NOR-043-decreto-211-2022-primaria.txt, TAREA-077). Los enunciados de competencias específicas y los criterios de evaluación se han extraído literalmente del Anexo 2, contrastando el número de competencias (ocho) y de criterios de evaluación (catorce por ciclo) contra lo declarado explícitamente en el propio decreto. El decreto unifica C1 y C2 (resolución de problemas) y C7 y C8 (destrezas personales y sociales) en dos únicos bloques competenciales con una sola tabla de descriptores operativos por bloque; se ha asignado el mismo conjunto de descriptores a ambas competencias de cada pareja, tal y como aparece en la fuente. Los descriptores operativos varían según el ciclo en seis de las ocho competencias (C1, C2, C3, C4, C5, C6), conforme a DEC-0008. Los saberes básicos se recogen a nivel de bloque (I-VI) con los títulos literales del decreto; no se han transcrito los ítems numerados individuales de cada bloque.
