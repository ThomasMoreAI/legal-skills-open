resumen_ia: 'Currículo de Educación en Valores Cívicos y Éticos en Educación Primaria Canarias (Decreto 211/2022), área exclusiva del tercer ciclo (5.º y 6.º), cursada por todo el alumnado. Cuatro competencias específicas (C1-C4) que se concretan en nueve criterios de evaluación, con saberes básicos organizados en tres bloques: Autoconocimiento y autonomía moral, Sociedad, democracia y justicia, y Desarrollo sostenible y ética ambiental.'
observaciones: 'Extracción literal completada el 2026-08-05 a partir de la reexportación en texto plano del PDF oficial del BOC (07_corpus_ia/textos-completos/texto-oficial-NOR-043-decreto-211-2022-primaria.txt, TAREA-077). Los enunciados de competencias específicas y los criterios de evaluación se han extraído literalmente del Anexo 2, contrastando el número de competencias (cuatro) y de criterios de evaluación (nueve) contra lo declarado explícitamente en el propio decreto. El área solo se imparte en el tercer ciclo (art. 8.6 del decreto), por lo que no hay variación de descriptores por ciclo. Los saberes básicos se recogen a nivel de bloque (I-III) con los títulos literales del decreto; no se han transcrito los ítems numerados individuales de cada bloque. Corrige el orden de las palabras del título del bloque II: el decreto dice «Sociedad, democracia y justicia», no «Sociedad, justicia y democracia» como figuraba antes.'
