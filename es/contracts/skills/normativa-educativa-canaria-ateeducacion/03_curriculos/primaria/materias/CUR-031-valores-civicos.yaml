  saberes_basicos:
    - bloque: I. Autoconocimiento y autonomía moral
      cursos:
        - 5.º
        - 6.º
      detalles: Toma de conciencia y expresión de facetas de la personalidad; gestión de emociones y deseos y deliberación racional sobre los propios fines; cuestiones éticas de autonomía y heteronomía moral; autoestima, prevención de abusos y acosos, y de conductas adictivas.
    - bloque: II. Sociedad, democracia y justicia
      cursos:
        - 5.º
        - 6.º
      detalles: Raíz social y cultural de la identidad personal; nociones básicas de carácter político y social; características del marco democrático de convivencia; investigación y diálogo sobre cuestiones éticas de relevancia (derechos humanos, pobreza, igualdad efectiva, diversidad, migraciones, crisis climática).
    - bloque: III. Desarrollo sostenible y ética ambiental
      cursos:
        - 5.º
        - 6.º
      detalles: Trabajo interdisciplinar y cooperativo para la comprensión de las relaciones sistémicas entre el individuo, la sociedad y la naturaleza, y el compromiso con valores y prácticas de respeto, cuidado y protección de las personas y el planeta.
  criterios_evaluacion:
    - ciclo: Tercer ciclo
      criterios:
        - 1.1. Construir un adecuado concepto de sí mismo o sí misma en relación con otras personas y el entorno, organizando y generando información analógica y digital con respecto a la identidad, diferencia y dignidad de las personas, así como analizando, expresando e identificando emociones, afectos y deseos con la finalidad de alcanzar fines propios y colectivos, desarrollando la autoestima, la autonomía y la identidad personal en un clima de convivencia proactiva.
        - 1.2. Generar una posición moral autónoma a través de la reflexión, el uso de los conceptos éticos y el diálogo respetuoso con otras personas, en torno a distintos valores y modos de vida, así como problemas relacionados con las tecnologías, conociendo su evolución a lo largo de la historia, analizando sus ventajas e inconvenientes, reflexionando sobre cómo afectan al autoconcepto y las relaciones sociales, con la finalidad de generar y expresar una posición crítica ante el uso responsable y seguro de las redes y medios de comunicación, las conductas adictivas, la prevención del abuso y el acoso escolar, y el respeto de la intimidad personal aprendiendo a discernir entre información contrastada, veraz y bulos.
        - 2.1. Promover y demostrar, en el contexto próximo al alumnado, un modo de convivencia democrática, justa, respetuosa y pacífica a partir de la investigación y comprensión de hechos históricos relevantes que han influido en la naturaleza social y política del ser humano para potenciar la toma de decisiones y la resolución de los conflictos de forma dialogada y respetuosa mediante el uso crítico de los conceptos de «ley», «ética», «civismo», «democracia», «justicia» y «paz».
        - 2.2. Reflexionar, dialogar y asumir un compromiso activo y crítico, con valores relativos a la solidaridad, el respeto por las minorías, los fenómenos migratorios y las identidades étnico-culturales y de género, interactuando y adoptando, de forma motivada y autónoma, conductas cívicas y éticas, para fomentar una relación proactiva con las demás personas en el contexto personal, familiar y social del alumnado.
        - 2.3. Contribuir a generar una convivencia positiva respetuosa, no sexista y comprometida con el logro de la efectiva igualdad, la erradicación de la violencia de género y el uso no discriminatorio de la lengua, conociendo y analizando de manera crítica el papel de la mujer en la sociedad a lo largo de la historia y la desigualdad entre mujeres y hombres.
        - 2.4. Comprender y valorar los principios de justicia, solidaridad, seguridad y paz, a la vez que el respeto a las libertades básicas, a partir del análisis y la ponderación de las políticas y acciones de ayuda y cooperación internacional, de defensa para la paz y de seguridad ciudadana, ejercidas por el Estado y sus instituciones, los organismos internacionales, las ONG y ONGD, y la propia ciudadanía.
        - 3.1. Evaluar diferentes alternativas creativas con que frenar el cambio climático y lograr los Objetivos de Desarrollo Sostenible, identificando causas y problemas ecosociales, y justificando argumentalmente y de modo crítico el deber ético de proteger y cuidar la biodiversidad de Canarias.
        - 3.2. Comprometerse activamente con valores, prácticas y actitudes afectivas consecuentes con el respeto, cuidado y protección de las personas, los animales y el planeta, y especialmente el entorno canario, a través de la participación en actividades que promuevan un consumo responsable y un uso sostenible del suelo, el aire, el agua, la energía, la movilidad segura, saludable y sostenible, y la prevención y gestión de residuos considerando el carácter insular del archipiélago y reconociendo el papel de las personas, colectivos y entidades comprometidas con la protección del entorno canario.
        - 4.1. Expresar y gestionar equilibradamente las emociones, y desarrollar una actitud de estima y cuidado de sí mismo o sí misma, de las demás personas y del entorno, identificando, analizando y expresando de manera asertiva las propias emociones y afectos reconociendo y valorando las emociones de otras personas, en distintos contextos y en relación con actividades creativas, que propicien iniciativas emprendedoras y de reflexión individual, grupal y dialogada sobre cuestiones éticas y cívicas.
