resumen_ia: 'Currículo de Educación Artística en Educación Primaria Canarias (Decreto 211/2022), impartida en los seis cursos de la etapa. Cuatro competencias específicas (C1-C4) que se concretan en diez criterios de evaluación por ciclo, con saberes básicos organizados en cuatro bloques: Recepción y análisis, Creación e interpretación, Artes plásticas, visuales y audiovisuales, y Música y artes escénicas y performativas.'
observaciones: Extracción literal completada el 2026-08-05 a partir de la reexportación en texto plano del PDF oficial del BOC (07_corpus_ia/textos-completos/texto-oficial-NOR-043-decreto-211-2022-primaria.txt, TAREA-077). Los enunciados de competencias específicas y los criterios de evaluación se han extraído literalmente del Anexo 2, contrastando el número de competencias (cuatro) y de criterios de evaluación (diez por ciclo) contra lo declarado explícitamente en el propio decreto. Los descriptores operativos varían según el ciclo en las cuatro competencias (crecen en número y variedad de Primer a Tercer ciclo), conforme a DEC-0008, por lo que se han recogido como mapa por ciclo. Los saberes básicos se recogen a nivel de bloque (I-IV) con los títulos literales del decreto; no se han transcrito los ítems numerados individuales de cada bloque.
