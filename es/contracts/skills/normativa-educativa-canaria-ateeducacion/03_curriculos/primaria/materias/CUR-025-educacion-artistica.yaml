  saberes_basicos:
    - bloque: I. Recepción y análisis
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Descubrimiento, exploración y valoración de la imagen, el sonido y sus posibilidades expresivas; acercamiento a propuestas artísticas de diferentes corrientes, procedencias y épocas, incluido el patrimonio artístico y cultural de Canarias; estrategias de recepción activa desde un enfoque crítico.
    - bloque: II. Creación e interpretación
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Experimentación y aplicación de los elementos materiales y las técnicas de los códigos artísticos con una finalidad expresiva; alfabetización en herramientas digitales como recurso y soporte con intención comunicativa desde una perspectiva artística.
    - bloque: III. Artes plásticas, visuales y audiovisuales
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Conocimiento y tratamiento de la imagen fija y en movimiento; exploración de medios, materiales, soportes y técnicas bidimensionales y tridimensionales; enculturación visual, registro y edición de elementos audiovisuales.
    - bloque: IV. Música y artes escénicas y performativas
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Experimentación con el propio cuerpo y sus posibilidades sonoras y expresivas a través del gesto y el movimiento, la exploración del sonido y la práctica instrumental y vocal, individual y en grupo; saberes relacionados con el sonido y sus cualidades.
  criterios_evaluacion:
    - ciclo: Primer ciclo
      criterios:
        - 1.1. Descubrir propuestas artísticas de su entorno próximo, de diferentes géneros, estilos y épocas, a través de la recepción activa, con el objetivo de desarrollar la curiosidad y apreciar las diferencias culturales.
        - 1.2. Describir manifestaciones culturales y artísticas de las islas Canarias, explorando sus características con actitud abierta e interés para desarrollar la curiosidad y el respeto por la diversidad.
        - 2.1. Seleccionar y aplicar estrategias elementales para la búsqueda guiada de información sobre manifestaciones culturales y artísticas de las islas Canarias, a través de canales y medios de acceso sencillos, tanto de forma individual como cooperativa, con el fin de desarrollar un pensamiento propio, la autoconfianza y la capacidad de cooperar.
        - 2.2. Reconocer elementos característicos básicos de distintas manifestaciones culturales y artísticas que forman parte del patrimonio de Canarias y de otras culturas, indicando los canales, los medios y las técnicas empleados e identificando diferencias y similitudes, con el fin de desarrollar un sentido progresivo de pertenencia e identidad.
        - 2.3. Reconocer sensaciones y emociones básicas producidas por diferentes manifestaciones culturales y artísticas, a partir de la recepción activa, para disfrutar de ellas y empezar a desarrollar una sensibilidad artística propia.
        - 3.1. Experimentar de manera guiada con algunos elementos básicos de los distintos lenguajes e instrumentos artísticos, con actitud abierta, con el fin de empezar a entender sus posibilidades comunicativas y expresivas.
        - 3.2. Producir obras propias de forma guiada, utilizando algunas de las posibilidades expresivas del cuerpo, el sonido, la imagen y los medios digitales básicos, y mostrando confianza en las propias capacidades, para expresar y comunicar de manera creativa ideas, sentimientos y emociones.
        - 4.1. Participar de manera guiada en el diseño de producciones culturales y artísticas elementales, trabajando de forma cooperativa a partir de la igualdad y el respeto a la diversidad, para desarrollar la creatividad y el sentido emprendedor.
        - 4.2. Tomar parte en el proceso cooperativo de producciones culturales y artísticas de forma respetuosa y utilizando elementos básicos de diferentes lenguajes y técnicas artísticas, con el fin de desarrollar la aceptación y comprensión del trabajo cooperativo.
        - 4.3. Compartir los proyectos creativos, explicando el proceso y el resultado final obtenido, y valorando las experiencias propias y ajenas, para el desarrollo de la creatividad y el sentido de pertenencia.
    - ciclo: Segundo ciclo
      criterios:
        - 1.1. Reconocer propuestas artísticas de diferentes géneros, estilos, épocas y culturas, a través de la recepción activa, con el objetivo de desarrollar la curiosidad y comprender las diferencias culturales.
        - 1.2. Describir manifestaciones culturales y artísticas de diferentes géneros, estilos, épocas y culturas, explorando sus características con actitud abierta e interés y estableciendo relaciones básicas entre ellas para desarrollar la curiosidad y el respeto por la diversidad.
        - 2.1. Seleccionar y aplicar estrategias para la búsqueda guiada de información sobre manifestaciones culturales y artísticas, a través de canales y medios de acceso, tanto de forma individual como cooperativa, con el fin de desarrollar un pensamiento propio, la autoconfianza y la capacidad de cooperar.
        - 2.2. Distinguir elementos característicos básicos de distintas manifestaciones culturales y artísticas que forman parte del patrimonio de Canarias y de otras culturas, con actitud de interés y respeto, indicando los canales, los medios y las técnicas utilizados, y analizando sus diferencias y similitudes, con el fin de desarrollar un sentido progresivo de pertenencia e identidad.
        - 2.3. Distinguir las sensaciones y emociones producidas por diferentes manifestaciones culturales y artísticas, a partir de su análisis y comprensión, para disfrutar de ellas y empezar a desarrollar una sensibilidad artística propia.
        - 3.1. Experimentar con los elementos básicos de los distintos lenguajes e instrumentos artísticos, con creatividad y actitud abierta, con el fin de entender sus posibilidades comunicativas y expresivas.
        - 3.2. Producir obras propias sencillas, utilizando las posibilidades expresivas del cuerpo, el sonido, la imagen y los medios digitales básicos, y mostrando confianza en las propias capacidades, para expresar y comunicar de manera creativa ideas, sentimientos y emociones.
        - 4.1. Participar de manera guiada en el diseño de producciones culturales y artísticas, trabajando de forma cooperativa en la consecución de un resultado final planificado y asumiendo diferentes funciones, desde la igualdad y el respeto a la diversidad, para desarrollar la creatividad y el sentido emprendedor.
        - 4.2. Participar en el proceso cooperativo de producciones culturales y artísticas, con actitud abierta y respetuosa, utilizando elementos básicos de diferentes lenguajes y técnicas artísticas, con el fin de desarrollar la aceptación y comprensión del trabajo cooperativo.
        - 4.3. Compartir los proyectos creativos, empleando estrategias comunicativas básicas, explicando el proceso y el resultado final obtenido, y respetando y valorando las experiencias propias y ajenas, como estrategia para el desarrollo de la creatividad, la noción de autoría y el sentido de pertenencia.
    - ciclo: Tercer ciclo
      criterios:
        - 1.1. Distinguir propuestas artísticas de diferentes géneros, estilos, épocas y culturas, a través de la recepción activa mediante la búsqueda, la escucha, la observación y el visionado, con el objetivo de desarrollar la curiosidad y comprender las diferencias culturales.
        - 1.2. Describir manifestaciones culturales y artísticas de diferentes géneros, estilos, épocas y culturas, explorando sus características con actitud abierta e interés y estableciendo relaciones entre ellas para desarrollar la curiosidad y el respeto por la diversidad.
        - 2.1. Seleccionar y aplicar estrategias para la búsqueda de información sobre manifestaciones culturales y artísticas, a través de canales y medios de acceso, tanto de forma individual como cooperativa, con el fin de desarrollar un pensamiento propio, la autoconfianza y la capacidad de trabajar en equipo.
        - 2.2. Comparar el significado y los elementos característicos de distintas manifestaciones culturales y artísticas que forman parte del patrimonio de Canarias y de otras culturas, con actitud abierta y respetuosa, analizando los canales, los medios y las técnicas vinculados a ellas, así como sus diferencias y similitudes, con el fin de desarrollar un sentido progresivo de pertenencia e identidad.
        - 2.3. Valorar las sensaciones y emociones producidas por diferentes manifestaciones culturales y artísticas, a partir de su análisis y comprensión, para disfrutar de ellas y empezar a desarrollar una sensibilidad artística propia.
        - 3.1. Experimentar con los elementos de los distintos lenguajes e instrumentos artísticos, con creatividad y actitud crítica y abierta, con el fin de entender sus posibilidades comunicativas y expresivas.
        - 3.2. Producir obras propias, utilizando las posibilidades expresivas del cuerpo, el sonido, la imagen y los medios digitales, y mostrando confianza en las propias capacidades y perfeccionando la ejecución, para expresar y comunicar de manera creativa ideas, sentimientos y emociones.
        - 4.1. Planificar y diseñar producciones culturales y artísticas, trabajando de forma cooperativa en la consecución de un resultado final y asumiendo diferentes funciones, desde la igualdad y el respeto a la diversidad, para desarrollar la creatividad y el sentido emprendedor.
        - 4.2. Participar activamente en el proceso cooperativo de producciones culturales y artísticas, con actitud abierta y respetuosa, utilizando elementos de diferentes lenguajes y técnicas artísticas, con el fin de desarrollar la aceptación y comprensión del trabajo cooperativo.
        - 4.3. Compartir los proyectos creativos, empleando diferentes estrategias comunicativas y a través de diversos medios, explicando el proceso y el resultado final obtenido, y respetando y valorando las experiencias propias y ajenas, como estrategia para el desarrollo de la creatividad, la noción de autoría y el sentido de pertenencia.
