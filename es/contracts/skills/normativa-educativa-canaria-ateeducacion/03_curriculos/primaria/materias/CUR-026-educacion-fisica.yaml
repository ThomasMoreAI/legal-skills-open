resumen_ia: 'Currículo de Educación Física en Educación Primaria Canarias (Decreto 211/2022), impartida en los seis cursos de la etapa. Cinco competencias específicas (C1-C5) que se concretan en nueve criterios de evaluación por ciclo, con saberes básicos organizados en seis bloques: Vida activa y saludable, Organización y gestión de la actividad física, Resolución de problemas en situaciones motrices, Autorregulación emocional e interacción social, Manifestaciones de la cultura motriz, e Interacción eficiente y sostenible con el entorno. Fuerte presencia de juegos, deportes y danzas tradicionales de Canarias.'
observaciones: Extracción literal completada el 2026-08-05 a partir de la reexportación en texto plano del PDF oficial del BOC (07_corpus_ia/textos-completos/texto-oficial-NOR-043-decreto-211-2022-primaria.txt, TAREA-077). Los enunciados de competencias específicas y los criterios de evaluación se han extraído literalmente del Anexo 2, contrastando el número de competencias (cinco) y de criterios de evaluación (nueve por ciclo) contra lo declarado explícitamente en el propio decreto. Los descriptores operativos coinciden en los tres ciclos salvo en la competencia C4, que añade CE2 en Tercer ciclo (DEC-0008). Los saberes básicos se recogen a nivel de bloque (I-VI) con los títulos literales del decreto; no se han transcrito los ítems numerados individuales de cada bloque.
