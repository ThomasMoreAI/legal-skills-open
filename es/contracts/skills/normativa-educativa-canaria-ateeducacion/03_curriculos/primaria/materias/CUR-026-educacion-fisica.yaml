  saberes_basicos:
    - bloque: I. Vida activa y saludable
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Saberes relacionados con el estilo de vida activo, diferenciando entre salud física, mental y social; hábitos de higiene corporal, alimentación y descanso.
    - bloque: II. Organización y gestión de la actividad física
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Uso apropiado de materiales y equipamiento deportivo básico, cómodo y seguro; planificación de retos motores y autorregulación; normas básicas de primeros auxilios y prevención de lesiones; activación y vuelta a la calma.
    - bloque: III. Resolución de problemas en situaciones motrices
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: 'Adaptación de las respuestas motrices a diferentes situaciones y experiencias: actividades individuales, de cooperación, de oposición y de colaboración-oposición, interacción con móviles e implementos, persecución, equilibrio y coordinación.'
    - bloque: IV. Autorregulación emocional e interacción social en situaciones motrices
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Gestión emocional en las situaciones motrices; habilidades sociales vinculadas al trabajo en equipo, cumplimiento de las reglas de juego, deportividad y rechazo de conductas discriminatorias o sexistas.
    - bloque: V. Manifestaciones de la cultura motriz
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Práctica, valoración y transmisión de los juegos motores, deportes y danzas de Canarias y otras culturas; comunicación de emociones, pensamientos o sentimientos a través del cuerpo; valoración de referentes significativos abordando el sexismo y promoviendo la igualdad.
    - bloque: VI. Interacción eficiente y sostenible con el entorno
      cursos:
        - 1.º
        - 2.º
        - 3.º
        - 4.º
        - 5.º
        - 6.º
      detalles: Educación vial, movilidad activa y sostenible; actividades motrices en el medio natural y urbano, cuidando su conservación; consumo responsable, construcción y reutilización de materiales en la práctica motriz.
  criterios_evaluacion:
    - ciclo: Primer ciclo
      criterios:
        - 1.1. Explorar las posibilidades de la motricidad a través del juego, identificando los beneficios de la actividad física para un estilo de vida activo y saludable, aportando hábitos de higiene corporal, educación postural, descanso e hidratación.
        - 1.2. Experimentar diferentes medidas de seguridad aplicables a distintos momentos de la práctica de la actividad física para evitar lesiones y saber cómo actuar en caso de accidente, adquiriendo comportamientos sociales inclusivos y de respeto, a través de prácticas motrices compartidas.
        - 2.1. Adoptar decisiones en situaciones lúdicas dependiendo de la comunicación motriz, ajustándose a los objetivos motores y la lógica interna de las situaciones motrices.
        - 2.2. Experimentar con el propio cuerpo, descubriendo los componentes cualitativos de la motricidad a través de diferentes situaciones motrices lúdicas, desarrollando retos motores de carácter individual y colaborativo para resolver problemas motores en contextos simulados o reales.
        - 3.1. Respetar las normas y reglas del juego, actuando con deportividad y juego limpio, aceptando las características y el nivel de las personas participantes e identificando y gestionando las emociones para disfrutar de la actividad física.
        - 3.2. Participar en situaciones motrices lúdicas, iniciándose en el desarrollo de habilidades sociales y en la resolución de conflictos de forma dialógica, mostrando una actitud positiva frente a las actuaciones contrarias a la convivencia.
        - 4.1. Experimentar su motricidad con los juegos motores tradicionales, de Canarias, y de otras culturas, aceptando su valor cultural y su potencial lúdico y social, adoptando actitudes positivas hacia la igualdad.
        - 4.2. Participar en composiciones con o sin soporte musical, al igual que otras manifestaciones artístico- expresivas de la cultura canaria u otras, transmitiendo sensaciones, emociones e ideas mediante el ritmo y el movimiento.
        - 5.1. Participar en actividades lúdicas en diversos espacios del entorno natural y urbano de forma segura, conociendo diferentes usos desde la motricidad y con actitudes de respeto y conservación de dichos entornos.
    - ciclo: Segundo ciclo
      criterios:
        - 1.1. Utilizar la actividad física como alternativa de ocio saludable y sostenible, adquiriendo hábitos de educación postural, de hidratación e higiene, y de alimentación, para adoptar un estilo de vida activo y saludable.
        - 1.2. Interiorizar medidas de seguridad antes, durante y después de la práctica de actividad física, diferenciando contextos de riesgo de aquellos beneficiosos para la salud, adquiriendo actitudes inclusivas y respetando las diferencias individuales.
        - 2.1. Adoptar decisiones en juegos motores y actividades deportivas, ajustándose a las demandas derivadas de los objetivos motores y de la lógica interna de situaciones con diferentes tipos de comunicación motriz.
        - 2.2. Adquirir un progresivo control y dominio corporal, empleando los componentes cualitativos, y adaptando los componentes cuantitativos, de la motricidad a diferentes situaciones motrices lúdicas, para resolver problemas motores en los contextos simulados o reales de los retos motores creados de forma individual y grupal.
        - 3.1. Demostrar, durante la práctica de actividades motrices, respeto hacia las normas y reglas del juego y una disposición positiva hacía el esfuerzo físico, controlando la impulsividad, gestionando las emociones, valorando las aportaciones de compañeros y adversarios y actuando siempre con deportividad y juego limpio.
        - 3.2. Participar en situaciones motrices lúdicas, desarrollando habilidades sociales de acogida, inclusión y cooperación, resolviendo los conflictos de forma dialógica y mostrando un compromiso activo de cambio frente a los estereotipos, la discriminación y la violencia.
        - 4.1. Participar activamente en juegos motores y deportes, propios de la cultura canaria, así como procedentes de otras, reconociendo y conservando su valor cultural y su potencial como espacio generador de interacciones constructivas entre personas, adoptando actitudes positivas hacia la igualdad.
        - 4.2. Distinguir y participar en composiciones con o sin soporte musical y reproducirlas, al igual que otras manifestaciones artístico-expresivas de la cultura canaria u otras, transmitiendo sensaciones, emociones e ideas, de forma estética y creativa mediante el ritmo y el movimiento.
        - 5.1. Practicar actividad física en los distintos espacios del entorno natural y urbano de forma segura, actuando desde un análisis previo de la situación y aplicando medidas de conservación ambiental.
    - ciclo: Tercer ciclo
      criterios:
        - 1.1. Integrar los procesos de activación corporal, autorregulación del esfuerzo, relajación e higiene en la práctica de actividades motrices, reconociendo sus limitaciones y buscando la superación personal, interiorizando así las rutinas propias de una práctica motriz saludable, sostenible y responsable como beneficiosas de la actividad física, así como las ventajas de una alimentación natural, para su aplicación en la vida diaria.
        - 1.2. Aplicar medidas de seguridad antes, durante y después de la práctica de actividad física, identificando los contextos de riesgo e implementando conductas apropiadas, vinculadas al cuidado del cuerpo, la actividad física o el deporte, que resultan beneficiosas para la salud y la convivencia.
        - 2.1. Aplicar principios básicos de toma de decisiones en situaciones lúdicas, juegos motores y deportes, a partir de la anticipación, ajustándolos a los objetivos motores y a la lógica interna de situaciones con diferentes tipos de comunicación motriz, en contextos reales o simulados, reflexionando sobre las soluciones obtenidas.
        - 2.2. Adquirir un progresivo control y dominio corporal, integrando los componentes cualitativos y cuantitativos de la motricidad de forma eficiente y creativa, implementando retos motores de carácter individual o grupal en los que se definan metas, se secuencien acciones y se generen producciones como respuesta a diferentes situaciones motrices lúdicas, valorando el grado de ajuste al proceso seguido y al resultado obtenido, para resolver problemas motores en distintos contextos próximos a su realidad.
        - 3.1. Intervenir en situaciones motrices lúdicas, con predisposición, esfuerzo, perseverancia y autorregulación, respetando las normas y reglas del juego, con deportividad, controlando la impulsividad, gestionando las emociones y expresándose de forma asertiva, reconociendo las actuaciones de personas compañeras y oponentes.
        - 3.2. Mostrar habilidades sociales, diálogo y respeto en la resolución de conflictos y ante la diversidad, ya sea de género, afectivo-sexual, procedencia, étnico, socio-económica o de competencia motriz, demostrando una actitud crítica y un compromiso activo de cambio frente a los estereotipos, la discriminación y la violencia en el contexto de las prácticas motrices.
        - 4.1. Practicar juegos motores y deportes, propios de la cultura canaria, así como procedentes de otras, reconociendo, conservando y transmitiendo su valor cultural y su potencial como espacio generador de interacciones constructivas y actitudes positivas hacia la igualdad entre personas reconociendo el esfuerzo y la dedicación de distintos referentes del deporte.
        - 4.2. Crear composiciones con o sin soporte musical y reproducirlas, al igual que otras manifestaciones artístico-expresivas de la cultura canaria u otras, transmitiendo sensaciones, emociones e ideas, de forma estética y creativa mediante el ritmo y el movimiento.
        - 5.1. Adaptar las acciones motrices a la incertidumbre del entorno natural y urbano de forma eficiente y segura, valorando sus posibilidades para la práctica de actividad física y actuando desde una perspectiva ecosostenible y comunitaria del entorno.
