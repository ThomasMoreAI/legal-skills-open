resumen_ia: 'El currículo del área de Religión Católica en Educación Primaria no lo fija el Decreto 211/2022 de
  Canarias, sino el Ministerio: la Resolución de 21 de junio de 2022 de la Secretaría de Estado de Educación (BOE-A-2022-10452),
  a propuesta de la Conferencia Episcopal Española, cuyo Anexo II corresponde a Primaria. Establece seis competencias
  específicas para toda la etapa, tres bloques de saberes básicos por ciclo —A. Identidad personal y relaciones
  en diálogo con el mensaje cristiano; B. Cosmovisiones, tradición cristiana y cultura; C. Habitar el mundo plural
  y diverso para construir la casa común— y doce criterios de evaluación por ciclo, dos por competencia. Este resumen
  no sustituye la fuente oficial.'
observaciones: '[TAREA-082, 2026-08-05] Ficha re-extraída íntegramente desde el Anexo II de FTE-079/NOR-072. Sustituye
  el contenido anterior, que no se correspondía con ninguna fuente registrada: sus seis competencias eran paráfrasis
  o títulos («Identidad y Trascendencia», «Diversidad y Convivencia») en lugar del enunciado oficial; declaraba
  cuatro bloques de saberes únicos para toda la etapa («El sentido de la vida», «La Biblia», «Jesús y la Iglesia»,
  «El compromiso») frente a los tres reales por ciclo; y registraba dos criterios de evaluación por ciclo frente
  a los doce reales, cubriendo sólo dos de las seis competencias en cada uno. No se ha localizado de dónde procedía
  ese contenido. Verificación de literalidad de la nueva extracción contra la copia local del texto oficial: 6 de
  6 competencias, 31 de 36 criterios y 81 de 84 saberes coinciden carácter a carácter; los 8 restantes rompen exactamente
  donde el PDF intercala su marca de página («cve: BOE-A-2022-10452») y se han comprobado uno a uno. `norma_base`
  pasa de NOR-043 a NOR-072: el Decreto 211/2022 no contiene este currículo y su disposición adicional primera,
  punto 6, remite la competencia a la jerarquía eclesiástica.'
