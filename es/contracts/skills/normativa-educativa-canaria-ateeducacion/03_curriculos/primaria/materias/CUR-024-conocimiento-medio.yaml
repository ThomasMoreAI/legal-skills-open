resumen_ia: 'Currículo de Conocimiento del Medio Natural, Social y Cultural en Educación Primaria Canarias (Decreto 211/2022), impartida en los seis cursos de la etapa. Nueve competencias específicas (C1-C9) que se concretan en veinticuatro criterios de evaluación por ciclo, con saberes básicos organizados en tres bloques: Cultura científica, Tecnología y digitalización, y Sociedades y territorios. Fuerte enfoque en el patrimonio natural, social y cultural canario.'
observaciones: Extracción literal completada el 2026-08-05 a partir de la reexportación en texto plano del PDF oficial del BOC (07_corpus_ia/textos-completos/texto-oficial-NOR-043-decreto-211-2022-primaria.txt, TAREA-077). Los enunciados de competencias específicas y los criterios de evaluación se han extraído literalmente del Anexo 2, contrastando el número de competencias (nueve) y de criterios de evaluación (veinticuatro por ciclo) contra lo declarado explícitamente en el propio decreto. Los descriptores operativos coinciden en los tres ciclos para las nueve competencias; se han recogido igualmente como mapa por ciclo (DEC-0008) para mantener el mismo formato en toda la ficha. Los saberes básicos se recogen a nivel de bloque (I-III) con los títulos y vinculaciones literales del decreto; no se han transcrito los ítems N.M individuales de cada bloque.
