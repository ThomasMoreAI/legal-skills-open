resumen_ia: 'Currículo de Lengua Castellana y Literatura en Educación Primaria Canarias (Decreto 211/2022), impartida en los seis cursos de la etapa. Diez competencias específicas (C1-C10) que se concretan en quince criterios de evaluación por ciclo, con saberes básicos organizados en cuatro bloques: Las lenguas y sus hablantes, Comunicación, Educación Literaria, y Reflexión sobre la lengua y sus usos. Atención particular al español hablado en Canarias.'
observaciones: Extracción literal completada el 2026-08-05 a partir de la reexportación en texto plano del PDF oficial del BOC (07_corpus_ia/textos-completos/texto-oficial-NOR-043-decreto-211-2022-primaria.txt, TAREA-077). Los enunciados de competencias específicas y los criterios de evaluación se han extraído literalmente del Anexo 2, contrastando el número de competencias (diez) y de criterios de evaluación (quince por ciclo) contra lo declarado explícitamente en el propio decreto. Los descriptores operativos coinciden en los tres ciclos para todas las competencias. Los saberes básicos se recogen a nivel de bloque (I-IV) con los títulos literales del decreto; no se han transcrito los ítems numerados individuales de cada bloque.
