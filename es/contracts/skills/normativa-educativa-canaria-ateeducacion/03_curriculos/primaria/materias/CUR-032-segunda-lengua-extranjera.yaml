  saberes_basicos:
    - bloque: I. Comunicación
      cursos:
        - 5.º
        - 6.º
      detalles: Saberes necesarios para las actividades comunicativas de comprensión, producción, interacción y mediación, incluida la búsqueda guiada de información; intenciones e interacciones comunicativas contextuales, repertorio comunicativo y elementos de comunicación no verbal.
    - bloque: II. Plurilingüismo
      cursos:
        - 5.º
        - 6.º
      detalles: Reflexión sobre el funcionamiento de las lenguas y sobre el repertorio lingüístico del alumnado; estrategias y técnicas que favorecen la transferencia de conocimiento para el aprendizaje de la lengua extranjera y la mejora de las lenguas familiares.
    - bloque: III. Interculturalidad
      cursos:
        - 5.º
        - 6.º
      detalles: Saberes acerca de las culturas vehiculadas a través de la lengua extranjera, su aprecio como oportunidad de enriquecimiento, y desarrollo de actitudes de interés y respeto por otras lenguas, variedades lingüísticas y culturas.
    - bloque: IV. Dimensiones Interpersonal e Intrapersonal
      cursos:
        - 5.º
        - 6.º
      detalles: 'Saberes relativos a factores internos y sociales que el alumnado, como sujeto emocional y creativo, ha de movilizar para el aprendizaje efectivo: empatía, respeto y valoración de otros puntos de vista.'
  criterios_evaluacion:
    - ciclo: Tercer ciclo
      criterios:
        - 1.1. Reconocer y analizar el sentido global, así como palabras y frases breves y sencillas, de textos orales, escritos y multimodales, sobre temas frecuentes y cotidianos de relevancia personal y ámbitos próximos a su experiencia, expresados de forma comprensible y clara, a través de distintos soportes, para contribuir al repertorio lingüístico individual y responder a propósitos de comunicación cotidianas.
        - 1.2. Seleccionar, organizar y aplicar, de forma progresivamente autónoma, estrategias y conocimientos, en situaciones comunicativas cotidianas y de relevancia para el alumnado para captar el sentido global, ampliar el repertorio lingüístico individual y procesar información explícita en textos breves y sencillos, tanto analógicos como digitales.
        - 2.1. Producir, de forma codirigida, textos orales, escritos y multimodales breves y sencillos, usando soportes analógicos y digitales, para realizar intervenciones en situaciones de comunicación, de relevancia personal y próximos a la experiencia del alumnado.
        - 2.2. Seleccionar, planificar y aplicar, de forma progresivamente autónoma, conocimientos y estrategias adecuadas con ayuda de recursos analógicos y digitales, para preparar y producir textos creativos adecuados a las intenciones comunicativas cotidianas que contribuyan al pleno desarrollo personal, creativo y emocional.
        - 3.1. Participar, de manera progresivamente autónoma, en situaciones interactivas de intercambios de información breves y sencillos, sobre temas cotidianos, de relevancia personal y próximos a su experiencia y contexto, a través de diferentes soportes, tanto analógicos como digitales, afrontando, entre otros, diversos retos que impliquen la generación de ideas y la búsqueda de respuestas creativas y originales, con el fin de responder a propósitos comunicativos concretos y respetuosos, y favorecer actitudes cooperativas, así como un uso ético y eficaz del lenguaje.
        - 3.2. Seleccionar, organizar y utilizar, de forma cooperativa, progresivamente autónoma y en contextos de interacción cotidianos, métodos inductivos y deductivos, así como estrategias básicas tales como la repetición, el ritmo pausado o el lenguaje no verbal, para responder a propósitos comunicativos que permitan ampliar su repertorio lingüístico individual.
        - 4.1. Justificar y explicar, de forma codirigida, textos, conceptos, pensamientos o emociones, atendiendo a la diversidad y apoyándose en recursos y soportes, analógicos y digitales, con el fin de facilitar la comprensión y el entendimiento en situaciones comunicativas sencillas y predecibles que contribuyan a la mejora de la convivencia, de las diferencias culturales y de la igualdad de derechos.
        - 4.2. Seleccionar e implementar, de forma progresivamente autónoma, estrategias básicas en situaciones colaborativas y cooperativas, apoyándose en el lenguaje no verbal, herramientas digitales y plataformas virtuales con el fin de ayudar a las demás personas y facilitar la comprensión, la producción de información y la comunicación.
        - 5.1. Comparar y contrastar, de forma progresivamente autónoma y cooperativa, las similitudes y diferencias entre distintas lenguas, reconociendo y reflexionando sobre aspectos básicos de su funcionamiento, para ampliar y enriquecer su repertorio lingüístico individual.
        - 5.2. Utilizar y diferenciar, de forma progresivamente autónoma y cooperativa, estrategias adecuadas de aprovechamiento y comprensión del repertorio plurilingüe, para adquirir aprendizajes, maximizar sus habilidades lingüísticas y enriquecer las experiencias comunicativas.
        - 5.3. Registrar y reflexionar, de manera guiada, sobre los progresos y las dificultades del proceso de aprendizaje de una segunda lengua extranjera, a través de actividades analógicas y digitales de autoevaluación y coevaluación, como las propuestas en el PEL o los diarios de aprendizaje, reconociendo y valorando sus propias posibilidades comunicativas, y haciendo propuestas de mejora, para construir y evidenciar el conocimiento.
        - 5.4. Reconocer y transferir los conocimientos, las estrategias y las destrezas del repertorio lingüístico individual a otros contextos de aprendizaje, con el fin de desarrollar un aprendizaje más profundo.
        - 6.1. Apreciar y respetar la diversidad y el patrimonio lingüístico, cultural y artístico de personas y países donde se habla la segunda lengua extranjera, así como de las islas Canarias, fortaleciendo vínculos, de forma progresivamente autónoma, entre las diferentes lenguas y culturas, y, en especial, con la propia, y mostrando rechazo ante cualquier tipo de discriminación, prejuicio y estereotipo, con el fin de mejorar la convivencia, la gestión de conflictos de forma dialogada, el enriquecimiento personal y el cuidado del entorno.
        - 6.2. Seleccionar y aplicar estrategias adecuadas para entender, apreciar y adaptarse a la diversidad lingüística, cultural y artística de personas y países donde se habla la segunda lengua extranjera y de las islas Canarias, en situaciones comunicativas guiadas, gestionando las emociones propias y respetando las ajenas.
        - 6.3. Mostrar empatía y comprensión por las producciones ajenas, valorando intervenciones, de forma guiada, en diferentes contextos comunicativos, y haciendo uso de la cortesía lingüística y la etiqueta digital para crear un ambiente afectivo e inclusivo que favorezca la reflexión y la resolución pacífica de conflictos.
