resumen_ia: 'Currículo de Segunda Lengua Extranjera en Educación Primaria Canarias (Decreto 211/2022), área obligatoria al menos en el tercer ciclo (5.º y 6.º). Seis competencias específicas (C1-C6) que se concretan en quince criterios de evaluación, con saberes básicos organizados en cuatro bloques: Comunicación, Plurilingüismo, Interculturalidad, y Dimensiones Interpersonal e Intrapersonal. Comparte enunciados de competencias y bloques de saberes con Lengua Extranjera (CUR-028).'
observaciones: Extracción literal completada el 2026-08-05 a partir de la reexportación en texto plano del PDF oficial del BOC (07_corpus_ia/textos-completos/texto-oficial-NOR-043-decreto-211-2022-primaria.txt, TAREA-077). Los enunciados de competencias específicas y los criterios de evaluación se han extraído literalmente del Anexo 2, contrastando el número de competencias (seis) y de criterios de evaluación (quince) contra lo declarado explícitamente en el propio decreto. El área es obligatoria, como mínimo, en el tercer ciclo (art. 8.8 del decreto); el Anexo 2 solo desarrolla el currículo para ese ciclo, por lo que no hay variación de descriptores por ciclo. Los saberes básicos se recogen a nivel de bloque (I-IV) con los títulos literales del decreto; no se han transcrito los ítems numerados individuales de cada bloque. Corrige la ficha anterior, que solo recogía tres bloques (A, B y C) y omitía el cuarto («Dimensiones Interpersonal e Intrapersonal»), presente en el decreto igual que en Lengua Extranjera.
