elementos:
  competencias_especificas:
    - codigo: "C1"
      enunciado_oficial: "Identificar problemas y formular preguntas acerca del fundamento, valor y sentido de la realidad y la existencia humana, a partir del análisis e interpretación de textos y otras formas de expresión filosófica y cultural, para reconocer la radicalidad y trascendencia de tales cuestiones, así como la necesidad de afrontarlos para desarrollar una vida reflexiva y consciente de sí."
      descriptores:
        "1.º Bachillerato": [CCL2, CCL3, STEM1, CD1, CD2, CPSAA1.1, CPSAA1.2, CPSAA4, CC1, CC3, CCEC1]
    - codigo: "C2"
      enunciado_oficial: "Buscar, gestionar, interpretar, producir y transmitir correctamente información relativa a cuestiones filosóficas, a partir del empleo contrastado y seguro de fuentes, el uso y análisis riguroso de las mismas, y el empleo de procedimientos elementales de investigación y comunicación, para desarrollar una actitud indagadora, autónoma, rigurosa y creativa en el ámbito de la reflexión filosófica."
      descriptores:
        "1.º Bachillerato": [CCL1, CCL2, CCL3, STEM1, CD1, CD2, CD3, CPSAA1.1, CPSAA3.1, CPSAA4, CC3]
    - codigo: "C3"
      enunciado_oficial: "Usar y valorar adecuadamente argumentos y estructuras argumentales, a partir de su análisis tanto formal como informal, para producir y apreciar distintos tipos de discurso de forma rigurosa, y evitar modos dogmáticos, falaces y sesgados de sostener opiniones e hipótesis."
      descriptores:
        "1.º Bachillerato": [CCL1, CCL5, STEM1, CC3]
    - codigo: "C4"
      enunciado_oficial: "Practicar el ejercicio del diálogo filosófico de manera rigurosa, crítica, tolerante y empática, interiorizando las pautas éticas y formales que este requiere, mediante la participación en actividades grupales y a través del planteamiento dialógico de las cuestiones filosóficas, para promover el contraste e intercambio de ideas y el ejercicio de una ciudadanía activa y democrática."
      descriptores:
        "1.º Bachillerato": [CCL1, CCL5, STEM1, CPSAA3.1, CPSAA3.2, CC2, CC3, CCEC1, CCEC4.1]
    - codigo: "C5"
      enunciado_oficial: "Reconocer el carácter plural de las concepciones, ideas y argumentos en torno a cada uno de los problemas fundamentales de la filosofía, mediante el análisis crítico y dialéctico de las diversas tesis filosóficamente relevantes y relativas a los mismos, para generar una concepción compleja y no dogmática de dichas cuestiones e ideas, promoviendo una actitud abierta, tolerante, y comprometida con la resolución racional y pacífica de los conflictos."
      descriptores:
        "1.º Bachillerato": [CCL1, CCL5, CC1, CC2, CC3]
    - codigo: "C6"
      enunciado_oficial: "Comprender las principales ideas y teorías filosóficas de los más importantes pensadores y pensadoras, mediante el examen crítico y dialéctico de dichas ideas y teorías y de los problemas fundamentales a los que responden, para generar un concepción rigurosa y crítica de la riqueza e influencia de la filosofía como parte esencial del patrimonio cultural común."
      descriptores:
        "1.º Bachillerato": [CCL2, CC1, CC3, CCEC2]
    - codigo: "C7"
      enunciado_oficial: "Adquirir una perspectiva global, sistémica y transdisciplinar en el planteamiento de cuestiones fundamentales y de actualidad, analizando y categorizando sus múltiples aspectos, distinguiendo lo substancial de lo accidental, e integrando información e ideas de distintos ámbitos disciplinares, desde la perspectiva fundamental de la filosofía, para poder tratar cuestiones complejas de modo creativo, emprendedor y transformador de la realidad."
      descriptores:
        "1.º Bachillerato": [CCL2, CCL3, CD1, CPSAA2, CPSAA3.1, CPSAA4, CC1, CC3, CC4, CCEC1]
    - codigo: "C8"
      enunciado_oficial: "Analizar problemas éticos y políticos mediante la exposición crítica y dialéctica de todas las posiciones filosóficamente pertinentes en la interpretación y resolución de los mismos, para desarrollar el juicio propio y la autonomía moral."
      descriptores:
        "1.º Bachillerato": [CCL1, CCL5, CPSAA1.1, CPSAA2, CC1, CC2, CC3, CC4, CE1, CCEC1]
    - codigo: "C9"
      enunciado_oficial: "Desarrollar la sensibilidad y la comprensión crítica del arte y otras manifestaciones con valor estético mediante el ejercicio del pensamiento filosófico acerca de la belleza y la creación artística, para contribuir a la educación de los sentimientos estéticos y al desarrollo de una actitud reflexiva con respecto al lenguaje y sentido de las imágenes."
      descriptores:
        "1.º Bachillerato": [CD2, CPSAA1.1, CPSAA3.1, CC2, CC3, CCEC1, CCEC2, CCEC3.1, CCEC3.2]
  criterios_evaluacion:
    - curso: "1.º Bachillerato"
      criterios:
        - "1.1. Reconocer un adecuado concepto de la filosofía desde su radicalidad y trascendencia y su dimensión crítica en el tratamiento de los problemas filosóficos, reconociendo y analizando diversas fuentes de información, reconociendo tanto textos propiamente filosóficos como culturales en general."
        - "2.1. Demostrar un conocimiento práctico de los procedimientos elementales de la investigación filosófica en el desarrollo de una actitud indagadora a través de tareas como la identificación de fuentes fiables, la búsqueda eficiente y segura de información, y la correcta organización, análisis, interpretación y evaluación de dicha información mediante la producción y comunicación de trabajos de investigación, disertaciones, comentarios de texto, tanto digitalmente como de forma analógica."
        - "3.1. Producir y evaluar discursos argumentativos, orales y escritos acerca de cuestiones y problemas filosóficos, demostrando el uso de normas y pautas lógicas, retóricas y argumentativas, detectando y evitando modos dogmáticos, falaces y sesgados en la defensa de opiniones e hipótesis, y ejercitar las virtudes argumentativas, explicando la naturaleza de dichas falacias y sesgos."
        - "3.2. Reconocer la importancia de la cooperación, el compromiso con la verdad, el respeto a la pluralidad y el rechazo de toda actitud discriminatoria o arbitraria, aplicando dichos principios a la práctica argumentativa y al diálogo con las demás personas."
        - "4.1. Promover el contraste e intercambio de ideas y el ejercicio de una ciudadanía activa y democrática a través del ejercicio de la participación en actividades grupales y del diálogo racional, respetuoso, abierto, constructivo y comprometido con la verdad, acerca de cuestiones y problemas filosóficamente relevantes."
        - "5.1. Analizar y exponer distintas tesis y teorías filosóficas como momentos de un proceso dinámico y siempre abierto de reflexión y diálogo a través del análisis comparativo de los argumentos, principios, metodologías y enfoques de dichas tesis y teorías, generando una concepción compleja y no dogmática de los problemas filosóficos tratados."
        - "6.1. Tomar consciencia de la riqueza e influencia del pensamiento filosófico identificando y analizando las principales ideas y teorías filosóficas en textos pertenecientes a cualquier ámbito cultural, así como en relación con experiencias, acciones o acontecimientos comunes y de actualidad."
        - "6.2. Obtener y demostrar un conocimiento de las ideas y teorías filosóficas de los pensadores y las pensadoras más importantes de la historia mediante el uso y el análisis crítico de aquellas en el contexto de la práctica individual o colectiva de la indagación filosófica."
        - "7.1. Afrontar temas complejos, de carácter fundamental y de actualidad, de modo interdisciplinar, sistémico y transformador, utilizando conceptos, ideas y procedimientos provenientes de distintos campos del saber, orientándolos y articulándolos críticamente desde una perspectiva filosófica."
        - "8.1. Desarrollar el propio juicio y la autonomía moral mediante el análisis filosófico de problemas éticos y políticos fundamentales y de actualidad, considerando las distintas posiciones en liza y elaborando, argumentando, exponiendo y sometiendo al diálogo con las demás personas las propias tesis al respecto."
        - "9.1. Generar un equilibrio entre el aspecto racional y emotivo en la consideración de los problemas filosóficos, especialmente los referidos al ámbito de la estética, a través de la reflexión expresa en torno a la experiencia, en general, del arte, y el análisis del papel de las imágenes y el lenguaje audiovisual en la cultura contemporánea."
  saberes_basicos:
    - bloque: "Bloque I — La filosofía y el ser humano"
      cursos: ["1.º Bachillerato"]
      detalles: "La reflexión filosófica: origen, condiciones de nacimiento, características y métodos del saber filosófico, relación con otros campos del saber, debate sobre su vigencia y utilidad, y reconocimiento de la discriminación social, de género, etnia y edad en la tradición filosófica. El ser humano como sujeto de la experiencia filosófica: concepciones filosóficas del ser humano, estructura psicosomática de la personalidad, relaciones entre conciencia y lenguaje, y problema de la identidad personal."
    - bloque: "Bloque II — El conocimiento y la realidad"
      cursos: ["1.º Bachillerato"]
      detalles: "El problema filosófico del conocimiento y la verdad: desinformación y posverdad, teorías del conocimiento, reglas del razonamiento y la argumentación, filosofía de la ciencia y papel de la mujer en la ciencia. El problema filosófico de la naturaleza y la realidad: sistemas cosmológicos, problema mente-cuerpo, monismo, dualismo y pluralismo, inteligencia artificial, determinismo e indeterminismo, y posiciones teístas, ateístas y agnósticas."
    - bloque: "Bloque III — Acción y creación"
      cursos: ["1.º Bachillerato"]
      detalles: "La acción humana: filosofía ética y política, con el problema ético, cognitivismo, emotivismo y relativismo moral, éticas de la virtud, del deber y del cuidado, la Declaración Universal de los Derechos Humanos, desigualdad y pobreza, igualdad entre hombres y mujeres, democracia, liberalismo, utilitarismo y comunitarismo, y feminismo y perspectiva de género. La reflexión filosófica en torno a la creación artística: arte, belleza y gusto, teorías estéticas, imagen y cultura audiovisual, y relación entre lo estético y lo ético."
  descriptores_operativos: ["CCL1", "CCL2", "CCL3", "CCL5", "STEM1", "CD1", "CD2", "CD3", "CPSAA1.1", "CPSAA1.2", "CPSAA2", "CPSAA3.1", "CPSAA3.2", "CPSAA4", "CC1", "CC2", "CC3", "CC4", "CE1", "CCEC1", "CCEC2", "CCEC3.1", "CCEC3.2", "CCEC4.1"]
  situaciones_aprendizaje: []
