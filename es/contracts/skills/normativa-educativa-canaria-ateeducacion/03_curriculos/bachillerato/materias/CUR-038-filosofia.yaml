resumen_ia: "Currículo de Filosofía en 1.º de Bachillerato Canarias (materia común), regulado por el Decreto 30/2023, con nueve competencias específicas (C1-C9) y nueve criterios de evaluación. Saberes organizados en tres bloques: «La filosofía y el ser humano», «El conocimiento y la realidad» y «Acción y creación»."
observaciones: "Extracción completada el 2026-08-05 a partir del texto oficial 07_corpus_ia/textos-completos/texto-oficial-NOR-005-decreto-30-2023.txt (líneas ~45263-46136). Materia común de 1.º de Bachillerato exclusivamente (el decreto no repite bloque para 2.º Bachillerato). Competencias con enunciado literal, descriptores por curso y los nueve criterios de evaluación oficiales."
