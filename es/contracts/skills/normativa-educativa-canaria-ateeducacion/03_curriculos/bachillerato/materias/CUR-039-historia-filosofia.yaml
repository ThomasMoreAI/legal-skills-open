resumen_ia: "Currículo de Historia de la Filosofía en 2.º de Bachillerato Canarias (materia común obligatoria), regulado por el Decreto 30/2023, con siete competencias específicas (C1-C7) y siete criterios de evaluación. Saberes organizados en tres bloques cronológicos: de Grecia al fin de la Antigüedad, de la Edad Media a la Modernidad europea, y de la Modernidad a la Postmodernidad."
