  criterios_evaluacion:
    - curso: "1.º Bachillerato"
      criterios:
        - "1.1. Emplear diferentes estrategias y herramientas, incluidas las digitales, valorando su eficiencia en cada caso, buscando un cambio de estrategia cuando sea necesario y reflexionando sobre el proceso realizado para describir, analizar y ampliar la comprensión de situaciones y modelizar problemas de la vida cotidiana y de las ciencias sociales."
        - "1.2. Obtener todas las posibles soluciones matemáticas de problemas con autonomía y actitud cooperativa, describiendo el procedimiento realizado, utilizando, si fuera necesario, tecnologías digitales, con el fin de resolver problemas de la vida cotidiana y de las ciencias sociales."
        - "2.1. Comprobar la validez matemática de las posibles soluciones de un problema utilizando el razonamiento y la argumentación, con el apoyo de tecnologías digitales, para obtener conclusiones lógicas de forma autónoma y valorar la fiabilidad del proceso seguido."
        - "2.2. Seleccionar la solución más adecuada de un problema en función del contexto usando el razonamiento y la argumentación con actitud respetuosa y con la ayuda de tecnologías digitales para contrastar su idoneidad y desarrollar el espíritu crítico y emprendedor."
        - "3.1. Formular e investigar conjeturas y problemas de forma guiada, integrando el uso de herramientas tecnológicas, utilizando varias fuentes de información, planteándose preguntas, comprobando hipótesis mediante la observación, la experimentación y la indagación y confirmando su validez."
        - "4.1. Modificar y crear algoritmos utilizando la abstracción para identificar los aspectos más relevantes, descomponiendo el problema en tareas más simples que se puedan codificar en un lenguaje apropiado y seleccionando las tecnologías más adecuadas para interpretar, modelizar y resolver situaciones problematizadas de la vida cotidiana y de las ciencias sociales."
        - "5.1. Conectar las diferentes ideas matemáticas buscando, identificando e investigando los vínculos existentes a través de proyectos, problemas y tecnologías digitales para desarrollar una mayor comprensión de los conceptos, procedimientos y argumentos y ampliar recursos matemáticos."
        - "5.2. Resolver problemas de la vida cotidiana y de las ciencias sociales estableciendo y aplicando conexiones entre las diferentes ideas matemáticas, utilizando tecnologías digitales si fuera preciso, para generar una visión integrada de las matemáticas."
        - "6.1. Establecer y aplicar conexiones entre ideas, conceptos y procedimientos matemáticos con otras áreas de conocimiento referentes a las ciencias sociales y con la vida real, reflexionando sobre dichos vínculos, buscando, seleccionando y contrastando información procedente de diferentes fuentes."
        - "6.2. Analizar la aportación de las matemáticas al progreso de la humanidad y estudiar el papel de matemáticas y matemáticos a lo largo de la historia, apreciando aspectos esenciales del patrimonio cultural y artístico para valorar su contribución al resolver situaciones complejas y diferentes retos que se plantean en las ciencias sociales."
        - "7.1. Representar conceptos, procedimientos e información matemática activando y organizando conocimientos, de manera manual o digital, utilizando la tecnología más adecuada, para visualizar ideas y estructurar razonamientos matemáticos."
        - "7.2. Seleccionar, utilizar o combinar diversas formas de representación matemática y tecnologías, valorando su utilidad para crear y compartir información sobre proyectos, investigaciones o procesos matemáticos."
        - "8.1. Mostrar organización y comprensión al comunicar hechos, ideas, conceptos y procedimientos de forma verbal, analítica y gráficamente, de manera individual y colectiva, con la terminología y el rigor apropiados, empleando o creando contenidos digitales en diversos medios y soportes."
        - "8.2. Reconocer el lenguaje matemático presente en diferentes contextos comprendiendo e interpretando textos orales, escritos y multimodales y emplearlo para comunicar la información."
        - "9.1. Perseverar en la consecución de objetivos ante situaciones de incertidumbre, identificando y gestionando emociones, reflexionando sobre las fortalezas y debilidades propias, con el fin de crear resiliencia, proteger la salud mental y mantener una actitud proactiva ante nuevos retos matemáticos."
        - "9.2. Aceptar y aprender de la crítica razonada respetando distintos puntos de vista con actitud dialogante, positiva y cooperativa al hacer frente a las diferentes situaciones de aprendizaje de las matemáticas, para integrar el error como parte del proceso de aprendizaje, construir una identidad positiva como estudiante de matemáticas y fomentar el bienestar personal y social."
        - "9.3. Participar en tareas matemáticas de forma activa en equipos heterogéneos, respetando las emociones, experiencias y diversidad de los demás y escuchando su razonamiento, aplicando las habilidades sociales más propicias, rechazando todo tipo de discriminación y violencia, promoviendo activamente la igualdad y corresponsabilidad efectiva entre mujeres y hombres."
    - curso: "2.º Bachillerato"
      criterios:
        - "1.1. Emplear diferentes estrategias y herramientas, incluidas las digitales, seleccionando la más adecuada según su eficiencia, buscando un cambio de estrategia cuando sea necesario y reflexionando sobre el proceso realizado para describir, analizar y ampliar la comprensión de situaciones y modelizar problemas de la vida cotidiana y de las ciencias sociales."
        - "1.2. Obtener todas las posibles soluciones matemáticas de problemas con autonomía y actitud cooperativa, describiendo el procedimiento realizado, utilizando, si fuera necesario, tecnologías digitales, con el fin de resolver problemas de la vida cotidiana y de las ciencias sociales."
        - "2.1. Demostrar la validez matemática de las posibles soluciones de un problema utilizando el razonamiento y la argumentación, seleccionando entre diferentes modos de comprobación de soluciones o estrategias, con el apoyo de tecnologías digitales, para obtener conclusiones lógicas de forma autónoma y valorar la fiabilidad del proceso seguido."
        - "2.2. Seleccionar la solución más adecuada de un problema en función del contexto usando el razonamiento y la argumentación con actitud respetuosa, y con la ayuda de tecnologías digitales, para contrastar su idoneidad y desarrollar el espíritu crítico y emprendedor."
        - "3.1. Formular, investigar y comprobar conjeturas y problemas de forma autónoma y creativa, integrando el uso de herramientas tecnológicas, utilizando varias fuentes de información, planteándose preguntas, comprobando hipótesis mediante la observación, la experimentación y la indagación y confirmando su validez."
        - "4.1. Modificar, crear y generalizar algoritmos utilizando la abstracción para identificar los aspectos más relevantes, descomponiendo el problema en tareas más simples que se puedan codificar en un lenguaje apropiado, reflexionando sobre el proceso realizado y seleccionando las tecnologías más adecuadas para interpretar, modelizar y resolver situaciones problematizadas de la vida cotidiana y de las ciencias sociales."
        - "5.1. Conectar las diferentes ideas matemáticas buscando, identificando e investigando los vínculos existentes a través de proyectos, problemas y tecnologías digitales para desarrollar una mayor comprensión de los conceptos, procedimientos, argumentos y modelos y ampliar recursos matemáticos."
        - "5.2. Resolver problemas de la vida cotidiana y de las ciencias sociales estableciendo y aplicando conexiones entre las diferentes ideas matemáticas, utilizando tecnologías digitales si fuera preciso, para generar una visión integrada de las matemáticas."
        - "6.1. Establecer y aplicar conexiones entre ideas, conceptos y procedimientos matemáticos con otras áreas de conocimiento referentes a las ciencias sociales y con la vida real, reflexionando sobre dichos vínculos, buscando, seleccionando y contrastando información procedente de diferentes fuentes, mediante el uso de tecnologías digitales para modelizar, resolver problemas y desarrollar una capacidad crítica, creativa e innovadora."
        - "6.2. Analizar la aportación de las matemáticas al progreso de la humanidad y estudiar el papel de matemáticas y matemáticos a lo largo de la historia, apreciando aspectos esenciales del patrimonio cultural y artístico y demostrando un compromiso ético y responsable con el entorno para valorar su contribución al resolver situaciones complejas y diferentes retos que se plantean en las ciencias sociales."
        - "7.1. Representar conceptos, procedimientos e información matemática activando y organizando conocimientos, de manera manual o digital, utilizando la tecnología más adecuada, para visualizar ideas y estructurar razonamientos matemáticos."
        - "7.2. Seleccionar, utilizar y combinar diversas formas de representación matemática y tecnologías, valorando su utilidad para crear y compartir información sobre proyectos, investigaciones o procesos matemáticos."
        - "8.1. Mostrar organización y comprensión al comunicar hechos, ideas, conceptos y procedimientos complejos de forma verbal, analítica y gráficamente, de manera individual y colectiva, con la terminología y el rigor apropiados, empleando o creando contenidos digitales en diversos medios y soportes."
        - "8.2. Reconocer el lenguaje matemático presente en diferentes contextos comprendiendo e interpretando textos orales, escritos y multimodales y emplearlo para comunicar la información."
        - "9.1. Perseverar en la consecución de objetivos ante situaciones de incertidumbre, tomando decisiones, identificando y gestionando emociones, reflexionando sobre las fortalezas y debilidades propias, con el fin de crear resiliencia, proteger la salud mental y mantener una actitud proactiva ante nuevos retos matemáticos."
        - "9.2. Aceptar y aprender de la crítica razonada respetando distintos puntos de vista con actitud dialogante, positiva y cooperativa al hacer frente a las diferentes situaciones de aprendizaje de las matemáticas, para integrar el error como parte del proceso de aprendizaje, construir una identidad positiva como estudiante de matemáticas y fomentar el bienestar personal y social."
        - "9.3. Trabajar en tareas matemáticas de forma activa en equipos heterogéneos, respetando las emociones, experiencias y diversidad de los demás y escuchando su razonamiento, aplicando las habilidades sociales más propicias, rechazando todo tipo de discriminación y violencia, promoviendo activamente la igualdad y corresponsabilidad efectiva entre mujeres y hombres."
  saberes_basicos:
    - bloque: "Bloque I — Sentido numérico"
      cursos: ["1.º Bachillerato", "2.º Bachillerato"]
      detalles: "Estrategias y técnicas de recuento sistemático, números reales (comparación, ordenación, clasificación), potencias, raíces y logaritmos, y educación financiera —cuotas, tasas, intereses, préstamos— (1.º); conjuntos de matrices y operaciones con números reales y matrices (2.º)."
    - bloque: "Bloque II — Sentido de la medida"
      cursos: ["1.º Bachillerato", "2.º Bachillerato"]
      detalles: "La probabilidad como medida de la incertidumbre; límites y su estimación, continuidad de funciones y asíntotas, y derivada de una función aplicada a contextos de las ciencias sociales (1.º); integral definida como área bajo una curva, técnicas elementales de cálculo de primitivas y regla de Barrow, y la derivada como razón de cambio en problemas de optimización (2.º)."
    - bloque: "Bloque III — Sentido algebraico"
      cursos: ["1.º Bachillerato", "2.º Bachillerato"]
      detalles: "Patrones, modelo matemático con ecuaciones, inecuaciones y sistemas aplicados a las ciencias sociales, igualdad y desigualdad, relaciones y funciones (polinómica, exponencial, racional, irracional, logarítmica, periódica y a trozos), y pensamiento computacional (1.º y 2.º)."
    - bloque: "Bloque IV — Sentido estocástico"
      cursos: ["1.º Bachillerato", "2.º Bachillerato"]
      detalles: "Organización y análisis de datos de variables bidimensionales, regresión lineal y cuadrática, coeficientes de correlación, incertidumbre y regla de Laplace, distribuciones de probabilidad binomial y normal, e inferencia mediante diseño de estudios estadísticos, técnicas de muestreo y análisis de información estadística de los medios de comunicación."
    - bloque: "Bloque V — Sentido socioafectivo"
      cursos: ["1.º Bachillerato", "2.º Bachillerato"]
      detalles: "Creencias, actitudes y emociones ante el aprendizaje de las matemáticas, tratamiento del error como oportunidad de aprendizaje, trabajo en equipo y toma de decisiones, e inclusión, respeto y diversidad, con valoración de la contribución de las matemáticas y de matemáticos y matemáticas al avance de las ciencias sociales."
