  saberes_basicos:
    - curso: "1.º Bachillerato"
      bloque: "I. Comunicación"
      contenido: |
        1. Empleo de estrategias de autorreparación y autoevaluación como forma de consolidar el aprendizaje autónomo de la lengua extranjera.
        2. Utilización de estrategias para la planificación, ejecución, control y reparación de la comprensión, la producción y la coproducción de textos orales, escritos y multimodales.
        3. Aplicación de conocimientos, destrezas y actitudes que permitan llevar a cabo actividades de mediación en situaciones cotidianas.
        4. Uso de funciones comunicativas adecuadas al ámbito y al contexto comunicativo: describir acontecimientos; dar instrucciones y consejos; narrar acontecimientos pasados, puntuales y habituales, describir estados y situaciones presentes y expresar sucesos futuros y de predicciones a corto, medio y largo plazo; expresar emociones; expresar la opinión; expresar argumentaciones; reformular, presentar las opiniones de otros, resumir.
        5. Integración de modelos contextuales y géneros discursivos de uso común en la comprensión, producción y coproducción de textos orales, escritos y multimodales sencillos, literarios y no literarios: características y reconocimiento del contexto (participantes y situación), expectativas generadas por el contexto; organización y estructuración según el género y la función textual.
        6. Manejo de unidades lingüísticas y significados asociados a dichas unidades, tales como la expresión de la entidad y sus propiedades, la cantidad y la cualidad, el espacio y las relaciones espaciales, el tiempo y las relaciones temporales, la afirmación, la negación, la interrogación y la exclamación, las relaciones lógicas.
        7. Identificación y empleo de léxico común de interés para el alumnado relativo a tiempo y espacio; estados, eventos y acontecimientos; actividades, procedimientos y procesos; relaciones personales, sociales, académicas y profesionales; educación, trabajo y emprendimiento; lengua y comunicación intercultural; ciencia y tecnología; historia y cultura; así como estrategias de enriquecimiento léxico (derivación, familias léxicas, polisemia, sinonimia, antonimia).
        8. Reconocimiento y reproducción de patrones sonoros, acentuales, rítmicos y de entonación, y significados e intenciones comunicativas generales asociadas a dichos patrones.
        9. Reconocimiento y uso de convenciones ortográficas y significados e intenciones comunicativas asociados a los formatos, patrones y elementos gráficos.
        10. Integración de convenciones y estrategias conversacionales, en formato síncrono o asíncrono, para iniciar, mantener y terminar la comunicación, tomar y ceder la palabra, pedir y dar aclaraciones y explicaciones, reformular, comparar y contrastar, resumir y parafrasear, colaborar, negociar significados, detectar la ironía, etc.
        11. Acopio y uso de recursos para el aprendizaje y estrategias de búsqueda y selección de información y curación de contenidos: diccionarios, libros de consulta, bibliotecas, mediatecas, etiquetas en la red, recursos digitales e informáticos, etc.
        12. Respeto por la propiedad intelectual y los derechos de autor sobre las fuentes consultadas y contenidos utilizados: herramientas para el tratamiento de datos bibliográficos y recursos para evitar el plagio.
        13. Gestión y uso de herramientas analógicas y digitales para la comprensión, producción y coproducción oral, escrita y multimodal y de plataformas virtuales de interacción, colaboración y cooperación educativa (aulas virtuales, videoconferencias, herramientas digitales colaborativas) para el aprendizaje, la comunicación y el desarrollo de proyectos con hablantes o estudiantes de la lengua extranjera.
    - curso: "1.º Bachillerato"
      bloque: "II. Plurilingüismo"
      contenido: |
        1. Manejo de estrategias y empleo de técnicas para responder eficazmente y con autonomía, adecuación y corrección a una necesidad comunicativa concreta, superando las limitaciones derivadas del nivel de competencia en la lengua extranjera y en las demás lenguas del repertorio lingüístico propio.
        2. Selección y empleo de estrategias para identificar, organizar, retener, recuperar y utilizar creativamente unidades lingüísticas (léxico, morfosintaxis, patrones sonoros, etc.) a partir de la comparación de las lenguas y variedades que conforman el repertorio lingüístico personal.
        3. Gestión y uso de estrategias y herramientas, analógicas y digitales, individuales y cooperativas para la autoevaluación, la coevaluación y la autorreparación.
        4. Utilización de expresiones y léxico habitual para reflexionar y compartir la reflexión sobre la comunicación, la lengua, el aprendizaje y las herramientas de comunicación y aprendizaje (metalenguaje).
        5. Comparación sistemática entre lenguas a partir de elementos de la lengua extranjera y otras lenguas: origen y parentescos.
    - curso: "1.º Bachillerato"
      bloque: "III. Interculturalidad"
      contenido: |
        1. Valoración e integración de aspectos socioculturales y sociolingüísticos relativos a convenciones sociales, normas de cortesía y registros; instituciones, costumbres y rituales; valores, normas, creencias y actitudes; estereotipos y tabúes; lenguaje no verbal; historia, cultura y comunidades; y su comparación con aquellos característicos de Canarias; procesos de globalización en países donde se habla la lengua extranjera.
        2. Gestión y aplicación de estrategias para entender y apreciar la diversidad lingüística, cultural y artística, atendiendo a valores ecosociales, de desarrollo sostenible y democráticos.
        3. Selección y elaboración de estrategias de detección, rechazo y actuación ante usos discriminatorios del lenguaje verbal y no verbal, prestando especial atención a la discriminación por razón de género o diversidad funcional.
    - curso: "1.º Bachillerato"
      bloque: "IV. Dimensiones interpersonal e intrapersonal"
      contenido: |
        1. Aprecio y valoración de la lengua extranjera como medio de comunicación y entendimiento entre pueblos, como facilitador del acceso a otras culturas y otras lenguas y como herramienta de participación social e interpersonal y de enriquecimiento propio.
        2. Empleo de estrategias colaborativas y de dinámicas de trabajo de grupo, relativas a las relaciones interpersonales.
        3. Empatía, valoración y respeto por las opiniones de los demás y sus puntos de vista.
        4. Interés e iniciativa en la realización de intercambios comunicativos a través de diferentes medios con hablantes o estudiantes de la lengua extranjera, así como por conocer informaciones culturales de los países donde se habla la lengua extranjera y compartir aquellas relativas a Canarias.
        5. Desarrollo de la autoconfianza, la iniciativa y la asertividad.
        6. Fomento de la motivación por el aprendizaje de la lengua extranjera.
        7. Visión creativa y emocional del aprendizaje.
        8. Empleo de estrategias de aprendizaje autónomo y pensamiento crítico.
        9. Aprecio por la diversidad y el patrimonio natural, lingüístico, cultural y artístico en lo referente a las relaciones interpersonales en países donde se habla la lengua extranjera, y diferencias destacadas con aquel de Canarias.
    - curso: "2.º Bachillerato"
      bloque: "I. Comunicación"
      contenido: |
        1. Empleo de estrategias de autorreparación y autoevaluación como forma de consolidar en el aprendizaje autónomo de la lengua extranjera.
        2. Utilización de estrategias para la planificación, ejecución, control y reparación de la comprensión, la producción y la coproducción de textos orales, escritos y multimodales.
        3. Aplicación de conocimientos, destrezas y actitudes que permiten llevar a cabo actividades de mediación en situaciones cotidianas y habituales.
        4. Uso de funciones comunicativas adecuadas al ámbito y al contexto comunicativo: describir fenómenos y acontecimientos; dar instrucciones y consejos; narrar acontecimientos pasados, puntuales y habituales, describir estados y situaciones presentes y expresar sucesos futuros y predicciones a corto, medio y largo plazo; expresar emociones; expresar la opinión; expresar argumentaciones; reformular, presentar las opiniones de otros, resumir.
        5. Integración de modelos contextuales y géneros discursivos de uso común en la comprensión, producción y coproducción de textos orales, escritos y multimodales sencillos, literarios y no literarios: características y reconocimiento del contexto (participantes y situación), expectativas generadas por el contexto, organización y estructuración según el género y la función textual.
        6. Manejo de unidades lingüísticas y significados asociados a dichas unidades, tales como la expresión de la entidad y sus propiedades, la cantidad y la cualidad, el espacio y las relaciones espaciales, el tiempo y las relaciones temporales, la afirmación, la negación, la interrogación y la exclamación, las relaciones lógicas.
        7. Identificación y empleo de léxico común y específico de interés para el alumnado relativo a tiempo y espacio; estados, eventos y acontecimientos; actividades, procedimientos y procesos; relaciones personales, sociales, académicas y profesionales; educación, trabajo y emprendimiento; lengua y comunicación intercultural; ciencia y tecnología; historia y cultura; estrategias de enriquecimiento léxico (derivación, familias léxicas, polisemia, sinonimia, antonimia).
        8. Reconocimiento y reproducción de patrones sonoros, acentuales, rítmicos y de entonación, y significados e intenciones comunicativas generales asociadas a dichos patrones.
        9. Reconocimiento y uso de convenciones ortográficas y significados e intenciones comunicativas asociados a los formatos, patrones y elementos gráficos.
        10. Integración de convenciones y estrategias conversacionales, en formato síncrono o asíncrono, para iniciar, mantener y terminar la comunicación, tomar y ceder la palabra, pedir y dar aclaraciones y explicaciones, reformular, comparar y contrastar, resumir y parafrasear, colaborar, negociar significados, detectar la ironía, etc.
        11. Acopio y uso de recursos para el aprendizaje y estrategias de búsqueda y selección de información y curación de contenidos: diccionarios, libros de consulta, bibliotecas, mediatecas, etiquetas en la red, recursos digitales e informáticos, etc.
        12. Respeto por la propiedad intelectual y los derechos de autor sobre las fuentes consultadas y contenidos utilizados: herramientas para el tratamiento de datos bibliográficos y recursos para evitar el plagio.
        13. Gestión y uso de herramientas analógicas y digitales para la comprensión, producción y coproducción oral, escrita y multimodal; y de plataformas virtuales de interacción, colaboración y cooperación educativa (aulas virtuales, videoconferencias, herramientas digitales colaborativas) para el aprendizaje, la comunicación y el desarrollo de proyectos con hablantes o estudiantes de la lengua extranjera.
    - curso: "2.º Bachillerato"
      bloque: "II. Plurilingüismo"
      contenido: |
        1. Manejo de estrategias y empleo de técnicas para responder eficazmente y con un alto grado de autonomía, adecuación y corrección a una necesidad comunicativa concreta, superando las limitaciones derivadas del nivel de competencia en la lengua extranjera y en las demás lenguas del repertorio lingüístico propio.
        2. Selección y empleo de estrategias para identificar, organizar, retener, recuperar y utilizar creativamente unidades lingüísticas (léxico, morfosintaxis, patrones sonoros, etc.) a partir de la comparación de las lenguas y variedades que conforman el repertorio lingüístico personal.
        3. Gestión y uso de estrategias y herramientas, analógicas y digitales, individuales y cooperativas para la autoevaluación, la coevaluación y la autorreparación.
        4. Utilización de expresiones y léxico habitual y específico para reflexionar y compartir la reflexión sobre la comunicación, la lengua, el aprendizaje y las herramientas de comunicación y aprendizaje (metalenguaje).
        5. Comparación sistemática entre lenguas a partir de elementos de la lengua extranjera y otras lenguas: origen y parentescos.
    - curso: "2.º Bachillerato"
      bloque: "III. Interculturalidad"
      contenido: |
        1. Valoración e integración de aspectos socioculturales y sociolingüísticos relativos a convenciones sociales, normas de cortesía y registros; instituciones, costumbres y rituales; valores, normas, creencias y actitudes; estereotipos y tabúes; lenguaje no verbal; historia, cultura y comunidades, y su comparación con los característicos de Canarias; relaciones interpersonales y procesos de globalización en países donde se habla la lengua extranjera.
        2. Gestión y aplicación de estrategias para entender y apreciar la diversidad lingüística, cultural y artística, atendiendo a valores ecosociales, de desarrollo sostenible y democráticos.
        3. Selección y elaboración de estrategias de prevención, detección, rechazo y actuación ante usos discriminatorios del lenguaje verbal y no verbal, prestando especial atención a la discriminación por razón de género o diversidad funcional.
    - curso: "2.º Bachillerato"
      bloque: "IV. Dimensiones interpersonal e intrapersonal"
      contenido: |
        1. Aprecio y valoración de la lengua extranjera como medio de comunicación y entendimiento entre pueblos, como facilitador del acceso a otras culturas y otras lenguas y como herramienta de participación social y de enriquecimiento personal.
        2. Empleo de estrategias colaborativas y de dinámicas de trabajo de grupo relativas a las relaciones interpersonales.
        3. Empatía, valoración y respeto por las opiniones de los demás y sus puntos de vista.
        4. Interés e iniciativa en la realización de intercambios comunicativos a través de diferentes medios con hablantes o estudiantes de la lengua extranjera, así como por conocer informaciones culturales de los países donde se habla la lengua extranjera y compartir aquellas relativas a Canarias.
        5. Desarrollo de la autoconfianza, la iniciativa y la asertividad.
        6. Fomento de la motivación por el aprendizaje de la lengua extranjera.
        7. Visión creativa y emocional del aprendizaje.
        8. Empleo de estrategias de aprendizaje autónomo y pensamiento crítico.
        9. Aprecio y valoración de la diversidad y el patrimonio natural, lingüístico, cultural y artístico en lo referente a las relaciones interpersonales en países donde se habla la lengua extranjera, y diferencias y similitudes con aquel propio de Canarias.
