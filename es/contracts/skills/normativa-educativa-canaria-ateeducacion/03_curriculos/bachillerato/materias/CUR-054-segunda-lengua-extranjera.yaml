id: CUR-054
titulo: "Segunda Lengua Extranjera I y II — Bachillerato Canarias"
etapa: "bachillerato"
materia: "Segunda Lengua Extranjera"
norma_base: NOR-005
fuente: FTE-009
url_oficial: "https://www.gobiernodecanarias.org/boc/2023/058/001.html"
fecha_consulta: 2026-04-26
fecha_analisis: 2026-08-05
estado_extraccion: "completado"
estado_vigencia: "Vigente"
elementos:
  competencias_especificas:
    - codigo: "C1"
      enunciado_oficial: "Comprender e interpretar las ideas principales y las líneas argumentales básicas de textos expresados en la lengua estándar, buscando fuentes fiables y haciendo uso de estrategias de inferencia y comprobación de significados, para responder a las necesidades comunicativas planteadas."
      descriptores:
        "1.º Bachillerato": [CCL2, CCL3, CP1, CP2, STEM1, CD1, CPSAA4]
        "2.º Bachillerato": [CCL2, CCL3, CP1, CP2, STEM1, CD1, CPSAA4]
    - codigo: "C2"
      enunciado_oficial: "Producir textos originales, de creciente extensión, claros, bien organizados y detallados, usando estrategias tales como la planificación, la síntesis, la compensación o la autorreparación, para expresar ideas y argumentos de forma creativa, adecuada y coherente, de acuerdo con propósitos comunicativos concretos."
      descriptores:
        "1.º Bachillerato": [CCL1, CCL5, CP1, CP2, STEM1, CD3, CPSAA5, CCEC3.1]
        "2.º Bachillerato": [CCL1, CCL5, CP1, CP2, STEM1, CD3, CPSAA5, CCEC3.1]
    - codigo: "C3"
      enunciado_oficial: "Interactuar activamente con otras personas, con suficiente fluidez y precisión y con espontaneidad, usando estrategias de cooperación y empleando recursos analógicos y digitales, para responder a propósitos comunicativos en intercambios respetuosos con las normas de cortesía."
      descriptores:
        "1.º Bachillerato": [CCL1, CCL5, CP1, CP2, STEM1, CD3, CPSAA3.1, CC3]
        "2.º Bachillerato": [CCL1, CCL5, CP1, CP2, STEM1, CD3, CPSAA3.1, CC3]
    - codigo: "C4"
      enunciado_oficial: "Mediar entre distintas lenguas o variedades, o entre las modalidades o registros de una misma lengua, usando estrategias y conocimientos eficaces orientados a explicar conceptos y opiniones o simplificar mensajes, para transmitir información de manera eficaz, clara y responsable, y crear una atmósfera positiva que facilite la comunicación."
      descriptores:
        "1.º Bachillerato": [CCL2, CCL5, CP1, CP2, CP3, CD2, CPSAA4]
        "2.º Bachillerato": [CCL2, CCL5, CP1, CP2, CP3, CD2, CPSAA4]
    - codigo: "C5"
      enunciado_oficial: "Ampliar y usar los repertorios lingüísticos personales entre distintas lenguas y variedades, reflexionando de forma crítica sobre su funcionamiento, y haciendo explícitos y compartiendo las estrategias y los conocimientos propios, para mejorar la respuesta a sus necesidades comunicativas."
      descriptores:
        "1.º Bachillerato": [CP2, STEM1, CD3, CPSAA1.1, CPSAA5, CE2]
        "2.º Bachillerato": [CP2, STEM1, CD3, CPSAA1.1, CPSAA5, CE2]
    - codigo: "C6"
      enunciado_oficial: "Valorar críticamente y adecuarse a la diversidad lingüística, cultural y artística a partir de la lengua extranjera, reflexionando y compartiendo las semejanzas y las diferencias entre lenguas y culturas, para actuar de forma empática, respetuosa y eficaz, y fomentar la comprensión mutua en situaciones interculturales."
      descriptores:
        "1.º Bachillerato": [CCL5, CP3, CPSAA3.1, CC2, CC3, CE1, CCEC1]
        "2.º Bachillerato": [CCL5, CP3, CPSAA3.1, CCEC1]
  descriptores_operativos: ["CCL1", "CCL2", "CCL3", "CCL5", "CP1", "CP2", "CP3", "STEM1", "CD1", "CD2", "CD3", "CPSAA1.1", "CPSAA3.1", "CPSAA4", "CPSAA5", "CC2", "CC3", "CE1", "CE2", "CCEC1", "CCEC3.1"]
  criterios_evaluacion:
    - curso: "1.º Bachillerato"
      criterios:
        - id: "1.1"
          texto: "Localizar información pertinente, identificar el sentido global y las ideas principales e interpretar y valorar con actitud crítica el contenido de textos orales sencillos, progresivamente más complejos, sobre temas frecuentes y cotidianos de relevancia personal y próximos a su experiencia que estén expresados de forma clara y sencilla a través de diversos soportes, utilizando con fluidez, adecuación y con aceptable corrección una o más lenguas, además de las familiares, con el fin de construir conocimiento y responder a las necesidades comunicativas planteadas."
        - id: "1.2"
          texto: "Localizar información pertinente, identificar el sentido global y las ideas principales e interpretar y valorar con actitud crítica el contenido y los rasgos discursivos de textos escritos y multimodales sencillos, progresivamente más complejos, sobre temas frecuentes y cotidianos que sean de relevancia personal y próximos a su experiencia y que estén expresados de forma clara a través de diversos soportes, así como de textos literarios adecuados al nivel de madurez del alumnado, aplicando criterios de validez y calidad y utilizando con fluidez, adecuación y con aceptable corrección una o más lenguas, además de las familiares, con el fin de construir conocimiento y responder a las necesidades comunicativas planteadas."
        - id: "1.3"
          texto: "Seleccionar, organizar y aplicar los conocimientos y las estrategias más adecuadas en cada situación comunicativa para comprender el sentido general, la información esencial y los detalles más relevantes de los textos; inferir significados e interpretar elementos no verbales; realizar búsquedas avanzadas pautadas para seleccionar y gestionar información veraz y enriquecer su repertorio lingüístico individual."
        - id: "2.1"
          texto: "Expresar oralmente de forma progresivamente autónoma, y en diferentes soportes, textos sencillos de extensión media sobre asuntos de relevancia personal o de interés público próximos a la experiencia del alumnado que sean claros, coherentes, bien organizados y adecuados a la situación comunicativa, mostrando una actitud cooperativa, respetuosa y ética y utilizando recursos verbales y no verbales con el fin de describir, explicar, narrar, argumentar e informar."
        - id: "2.2"
          texto: "Redactar y difundir de forma progresivamente autónoma y con cierta fluidez textos sobre asuntos de relevancia personal o de interés público próximos a la experiencia del alumnado, de extensión media y de estructura clara, adecuados a la situación comunicativa, a la tipología textual y a las herramientas analógicas y digitales, evitando errores que dificulten o impidan la comprensión, respetando la propiedad intelectual y evitando el plagio para explicar y expresar ideas, argumentos u otras comunicaciones."
        - id: "2.3"
          texto: "Seleccionar, organizar y aplicar de forma progresivamente autónoma, conocimientos y estrategias gradualmente más complejos de planificación, producción, revisión y cooperación en la elaboración de textos de estructura clara y adecuados a las intenciones comunicativas, las características contextuales, los aspectos socioculturales y la tipología textual, usando los recursos físicos o digitales más adecuados en función de la tarea y de los interlocutores reales o potenciales, a la vez que ampliando su repertorio lingüístico individual para componer textos."
        - id: "3.1"
          texto: "Planificar, participar y colaborar asertiva y activamente en situaciones interactivas sencillas, orales, escritas o multimodales, sobre temas de relevancia personal o de interés público conocidos por el alumnado, mostrando iniciativa, empatía y respeto por la cortesía lingüística y la etiqueta digital, así como por las diferentes necesidades, ideas, inquietudes, iniciativas y motivaciones de los interlocutores e interlocutoras, y ofreciendo explicaciones, opiniones y comentarios con el fin de fortalecer y ampliar vínculos personales, al igual que participar de la vida social con cierta autonomía."
        - id: "3.2"
          texto: "Seleccionar, organizar y utilizar, de forma flexible y en diferentes entornos, estrategias adecuadas que le permitan poner en uso su repertorio lingüístico individual para así iniciar, mantener y terminar la comunicación, tomar y ceder la palabra con amabilidad, solicitar y formular aclaraciones y explicaciones, reformular, comparar y contrastar, resumir, colaborar, debatir y resolver problemas, respetando la etiqueta digital, con el fin de expresarse de manera espontánea en la lengua extranjera a través de diversos soportes."
        - id: "4.1"
          texto: "Interpretar y explicar textos, conceptos y comunicaciones de extensión media con cierta complejidad en situaciones en las que se deba atender a la diversidad, mostrando respeto y aprecio por las interlocutoras y los interlocutores y por las lenguas, variedades lingüisticas o registros empleados, participando en la solución de problemas frecuentes de intercomprensión y de entendimiento, a partir de diversos recursos y soportes, para así construir conocimiento y transmitir información de manera eficaz, clara y responsable, así como para crear una atmósfera positiva que facilite la comunicación."
        - id: "4.2"
          texto: "Aplicar un reportorio variado de estrategias que ayuden de forma progresiva a crear puentes, faciliten la comunicación y que sean adecuadas a las intenciones comunicativas, a las características contextuales, a los aspectos socioculturales y a la tipología textual, usando recursos y apoyos físicos o digitales en función de la tarea y el conocimiento previo de las interlocutoras y los interlocutores, y ampliando su repertorio lingüístico individual para explicar y simplificar textos, conceptos y mensajes."
        - id: "5.1"
          texto: "Registrar, reflexionar y compartir, a través de medios analógicos y digitales, los progresos y dificultades de aprendizaje de la lengua extranjera, utilizando con iniciativa y de forma creativa estrategias y conocimientos de mejora de la capacidad de comunicar y de aprender, así como las estrategias más adecuadas y eficaces en las actividades de planificación, autoevaluación y coevaluación, como las que se proponen en el Portfolio Europeo de las Lenguas o en diarios de aprendizaje, comparando y contrastando las semejanzas y diferencias entre distintas lenguas, al igual que reflexionando sobre su funcionamiento y estableciendo relaciones entre ellas, haciéndolo con apoyo de otros interlocutores e interlocutoras, para así ampliar su repertorio lingüístico individual, superar las adversidades y consolidar su aprendizaje en la lengua extranjera."
        - id: "6.1"
          texto: "Valorar críticamente y de forma empática y respetuosa la diversidad lingüística, cultural y artística propia de Canarias y de los países donde se habla la lengua extranjera, aplicando estrategias en situaciones comunicativas interculturales cotidianas con resiliencia, proponiendo vías de solución a dificultades comunicativas socioculturales, reflexionando sobre sus semejanzas y diferencias, analizando y rechazando cualquier tipo de discriminación, prejuicio o estereotipo, actuando de forma adecuada y construyendo vínculos entre el patrimonio canario y el de otras culturas y favoreciendo el desarrollo de una cultura compartida y una ciudadanía comprometida con la sostenibilidad y los valores democráticos, para defender la libertad de expresión, la igualdad y el enriquecimiento inherente a la diversidad y respetando los principios de justicia, equidad e igualdad."
    - curso: "2.º Bachillerato"
      criterios:
        - id: "1.1"
          texto: "Interpretar y analizar el sentido global y la información específica y explícita, e interpretar y valorar con actitud crítica el contenido de textos orales sencillos, progresivamente más complejos, sobre temas frecuentes y cotidianos de relevancia personal que sean próximos a su experiencia y que estén expresados de forma clara a través de diversos soportes, utilizando con fluidez, adecuación y corrección una o más lenguas, además de las familiares, con el fin de construir conocimiento y responder a las necesidades comunicativas planteadas."
        - id: "1.2"
          texto: "Interpretar y analizar el sentido global y la información específica y explícita, e interpretar y valorar con actitud crítica el contenido y los rasgos discursivos de textos escritos y multimodales sencillos progresivamente más complejos, sobre temas frecuentes y cotidianos de relevancia personal próximos a su experiencia y que estén expresados de forma clara a través de diversos soportes, así como de textos literarios adecuados al nivel de madurez del alumnado, aplicando criterios de validez, calidad y fiabilidad y utilizando con fluidez, adecuación y corrección una o más lenguas, además de las familiares, con el fin de construir conocimiento y responder a las necesidades comunicativas planteadas."
        - id: "1.3"
          texto: "Seleccionar, organizar y aplicar de manera sistemática los conocimientos y las estrategias más adecuados en cada situación comunicativa para comprender el sentido general, la información esencial y los detalles más relevantes de los textos, para inferir significados e interpretar elementos no verbales y para realizar búsquedas avanzadas pautadas para seleccionar y gestionar información veraz y enriquecer su repertorio lingüístico individual."
        - id: "2.1"
          texto: "Expresar oralmente en diferentes soportes y con suficiente fluidez y corrección textos sencillos, claros, coherentes y bien organizados, que sean adecuados a la situación comunicativa y a diferentes registros y que traten sobre asuntos de relevancia personal o de interés público, haciéndolo con actitud cooperativa, respetuosa y ética y utilizando recursos verbales y no verbales, con el fin de describir, explicar, narrar, argumentar, e informar."
        - id: "2.2"
          texto: "Redactar y difundir con fluidez textos sobre asuntos de relevancia personal o de interés público conocidos por el alumnado, de extensión media y de estructura clara, adecuados a la situación comunicativa, a la tipología textual y a las herramientas analógicas y digitales utilizadas, evitando errores que dificulten o impidan la comprensión, reformulando y organizando de manera coherente y con respeto información e ideas de diversas fuentes, justificando las propias opiniones, haciendo un uso ético del lenguaje y respetando la propiedad intelectual y evitando el plagio para expresar ideas y argumentos."
        - id: "2.3"
          texto: "Seleccionar, organizar y aplicar conocimientos y estrategias complejas de planificación, producción, revisión y cooperación en la elaboración de textos de estructura clara y adecuados a las intenciones comunicativas, a las características contextuales, a los aspectos socioculturales y a la tipología textual, usando de manera autónoma los recursos físicos o digitales más adecuados en función de la tarea y de los interlocutores reales o potenciales, a la vez que ampliando su repertorio lingüístico individual para componer textos."
        - id: "3.1"
          texto: "Planificar, participar y colaborar asertiva y activamente, a través de diversos soportes, en situaciones interactivas, orales, escritas o multimodales sobre temas cotidianos de relevancia personal o de interés público cercanos a su experiencia, mostrando iniciativa, empatía y respeto por la cortesía lingüística y la etiqueta digital, así como por las diferentes necesidades, ideas, inquietudes, iniciativas y motivaciones de los interlocutores o interlocutoras, expresando ideas, comentarios y opiniones, así como argumentando, con el fin de ampliar vínculos personales y participar en la vida social con autonomía."
        - id: "3.2"
          texto: "Seleccionar, organizar y utilizar de forma eficaz, espontánea y en diferentes entornos estrategias adecuadas que le permitan poner en uso su repertorio lingüístico individual, para así iniciar, mantener y terminar la comunicación, tomar y ceder la palabra con amabilidad, ajustar la propia contribución a la de los interlocutores e interlocutoras percibiendo sus reacciones, solicitar y formular aclaraciones y explicaciones, reformular, comparar y contrastar, resumir, colaborar, debatir, resolver problemas y gestionar situaciones comprometidas, respetando la etiqueta digital, con el fin de responder a propósitos comunicativos de manera espontánea en diversos soportes."
        - id: "4.1"
