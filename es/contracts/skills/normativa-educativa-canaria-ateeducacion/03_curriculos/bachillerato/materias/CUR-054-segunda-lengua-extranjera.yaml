observaciones: "Extracción completada el 2026-08-05 a partir de 07_corpus_ia/textos-completos/texto-oficial-CUR-054-segunda-lengua-extranjera.txt (texto plano oficial del PDF curricular Segunda Lengua Extranjera I y II, FTE-012/FTE-009; materia de oferta obligatoria en Alemán, Francés o Italiano). Las 6 competencias específicas llevan enunciado_oficial literal y descriptores operativos por curso (DEC-0008). criterios_evaluacion recoge los 12 criterios de 1.º Bachillerato y los 12 de 2.º Bachillerato (3+3+2+2+1+1 en cada curso), agrupados por curso con id y texto literal completo. saberes_basicos recoge íntegros los cuatro bloques oficiales (I. Comunicación; II. Plurilingüismo; III. Interculturalidad; IV. Dimensiones interpersonal e intrapersonal) para cada uno de los dos cursos, preservando la numeración original del decreto. Los cuatro elementos de DEC-0004 quedan completos."
