elementos:
  competencias_especificas:
    - codigo: "C1"
      enunciado_oficial: "Comprender el papel de la psicología como la disciplina científica que tiene por objeto integrar los conocimientos científicos necesarios para comprender, interpretar, analizar y explicar el comportamiento humano con la finalidad de promover la salud y la calidad de vida de las personas, analizando su evolución a lo largo de la historia y reconociendo el valor del conocimiento científico frente al aportado por las pseudociencias, con la finalidad de promover el pensamiento científico, el espíritu crítico y la capacidad para tratar la información y sus fuentes en términos de fiabilidad, validez, calidad y actualidad."
      descriptores:
        "2.º Bachillerato": [CCL1, CCL2, CCL3, STEM2, STEM4, CD1, CD2, CPSAA2, CPSAA4, CC1]
    - codigo: "C2"
      enunciado_oficial: "Comprender la relación entre la Psicología básica y la aplicada, analizando los procesos psicológicos básicos y reconociendo la utilidad de su conocimiento a la hora de abordar los problemas de las personas, lograr un mejor funcionamiento psicológico y una mejor calidad de vida, tanto a nivel individual como grupal, para comprender los procesos de construcción del conocimiento y su papel como motor de progreso y favorecer el desarrollo de procesos autorregulados de aprendizaje que mejoren la capacidad para transmitir conocimiento, proponer ideas creativas y resolver problemas con autonomía y responsabilidad que redunden en el bienestar social."
      descriptores:
        "2.º Bachillerato": [CCL1, CCL2, CCL3, CCL5, STEM2, STEM4, STEM5, CD1, CPSAA2, CPSAA4, CPSAA5]
    - codigo: "C3"
      enunciado_oficial: "Conocer, comprender y explicar los factores que influyen en la conformación de la personalidad y las diferentes teorías que la explican, así como las bases neuronales de los procesos mentales complejos, analizando su relación con la conducta adaptativa, reconociendo su importancia a la hora del estudio, tratamiento y prevención de los trastornos mentales y la promoción de la salud mental, para mejorar el desempeño en el ámbito personal, social y académico atendiendo al bienestar físico y mental propio y ajeno y a la cohesión social."
      descriptores:
        "2.º Bachillerato": [CCL1, CCL2, CCL3, STEM2, STEM4, STEM5, CD1, CPSAA1.2, CPSAA2, CPSAA4]
    - codigo: "C4"
      enunciado_oficial: "Conocer los procesos cognitivos implicados en el aprendizaje y comprender su relación con la motivación y la emoción, analizando las diferentes teorías que lo explican, identificando las habilidades, aptitudes y otras cualidades personales propias para potenciar aquellas que favorezcan la autonomía y permitan afrontar de forma eficaz nuevos retos a través de la selección y adquisición de las técnicas y estrategias de aprendizaje adecuadas tanto en el trabajo individual como colaborativo."
      descriptores:
        "2.º Bachillerato": [CCL1, CCL2, STEM4, CPSAA1.1, CPSAA5, CC3, CE1, CE3]
    - codigo: "C5"
      enunciado_oficial: "Conocer y comprender los factores que explican el comportamiento humano en la sociedad, analizando los procesos sociales y las relaciones interpersonales que influyen en el comportamiento de las personas y la formación de la personalidad para comprenderse a uno mismo e interactuar con las demás personas ejerciendo una ciudadanía ética y cívica que contribuya a construir una identidad cultural, personal y colectiva."
      descriptores:
        "2.º Bachillerato": [CCL1, CCL5, STEM4, STEM5, CD3, CD4, CPSAA2, CPSAA3.1, CC1, CC3, CC4]
    - codigo: "C6"
      enunciado_oficial: "Comprender los factores que influyen en la conducta humana en el contexto del trabajo y las organizaciones analizando, desde una perspectiva ecosocial, su influencia tanto en el rendimiento y la productividad como en el desarrollo y la calidad de vida de las personas en el contexto laboral, para ser capaz de plantear y alcanzar objetivos compartidos mediante la distribución de tareas, recursos y responsabilidades de forma ecuánime."
      descriptores:
        "2.º Bachillerato": [CCL1, STEM4, CD3, CPSAA3.1, CPSAA3.2, CC4, CE1, CE2, CE3]
  descriptores_operativos: ["CCL1", "CCL2", "CCL3", "CCL5", "STEM2", "STEM4", "STEM5", "CD1", "CD2", "CD3", "CD4", "CPSAA1.1", "CPSAA1.2", "CPSAA2", "CPSAA3.1", "CPSAA3.2", "CPSAA4", "CPSAA5", "CC1", "CC3", "CC4", "CE1", "CE2", "CE3"]
  criterios_evaluacion:
    - curso: "2.º Bachillerato"
      criterios:
        - "1.1. Analizar y explicar con actitud crítica las aportaciones más importantes de la psicología, desde sus inicios hasta la actualidad, identificando los principales problemas planteados, analizando las soluciones aportadas por las diferentes corrientes psicológicas, valorando su contribución al cambio de las condiciones de vida de las personas y estableciendo relaciones con otras disciplinas científicas para comprender los procesos de construcción del conocimiento."
        - "1.2. Reconocer, explicar y analizar las características propias de la ciencia, diferenciando el conocimiento científico del aportado por la pseudociencia, contrastando, integrando y transmitiendo la información de diferentes fuentes y formatos para evitar los riesgos de la desinformación, favorecer la toma de decisiones éticas y autónomas y adoptar un estilo de vida saludable y sostenible."
        - "2.1. Identificar y comprender y explicar las características de la Psicología básica, sus objetivos, y principales técnicas de investigación, analizando el alcance y las limitaciones de los métodos empleados y estableciendo relaciones, e integrando la información procedente de otros campos del conocimiento para comprender los procesos de construcción del mismo."
        - "2.2. Identificar, conocer y explicar las principales ramas de la Psicología aplicada estableciendo relaciones de forma argumentada entre estas y el conocimiento aportado desde la Psicología básica, comprendiendo el impacto de cada una de ellas en el bienestar personal, laboral y social de las personas, para aprender a tomar decisiones basadas en el pensamiento científico que permitan adoptar un estilo de vida saludable."
        - "2.3. Investigar y comprender los procesos psicológicos básicos y los procesos cognitivos de orden superior que subyacen a la conducta humana y que permiten el ajuste del comportamiento a las condiciones y demandas ambientales, identificando características propias y ajenas y poniendo en valor el carácter enriquecedor de las diferencias individuales para emprender con autonomía acciones fundamentadas que permitan buscar y ofrecer apoyo en la sociedad y adoptar un estilo de vida sostenible."
        - "3.1. Comprender y explicar el concepto de personalidad, analizando las influencias genéticas, medioambientales y culturales sobre las que se edifica, investigando sobre las diversas teorías que la estudian y analizando su evolución a lo largo de la historia para identificar aquellos factores y hábitos que condicionan un adecuado desarrollo de la misma."
        - "3.2. Conocer y explicar la estructura y el funcionamiento del sistema nervioso central y su relación con la conducta de las personas, valorando los efectos que una lesión, daño o funcionamiento anómalo de sus estructuras tienen sobre los procesos cognitivos, psicológicos, emocionales y del comportamiento, para comprender el valor del conocimiento científico en la prevención y tratamiento de algunos trastornos y enfermedades mentales."
        - "3.3. Reflexionar de forma crítica sobre el concepto de salud como un estado de completo bienestar físico, mental y social, analizando la importancia de un adecuado desarrollo afectivo-sexual y describiendo la salud como algo más que la ausencia de afecciones o enfermedades, para identificar estilos de vida saludables y rechazar la visión estigmatizada de la enfermedad mental."
        - "4.1. Conocer y describir las principales teorías del aprendizaje valorando las aportaciones de cada una de ellas, su relevancia en diferentes momentos de la historia y su influencia en las prácticas educativas actuales que pretenden ajustarse a las diferentes necesidades y ritmos de aprendizaje de las personas."
        - "4.2. Comprender y explicar la relación entre los procesos cognitivos básicos y el aprendizaje, investigando y describiendo el papel que la gestión emocional juega en el proceso de aprendizaje para favorecer los procesos de autorregulación y el desarrollo de técnicas y estrategias que favorezcan tanto la autonomía y el rendimiento individual como la colaboración con las demás personas."
        - "4.3. Comprender el papel que juega la motivación como estado interno que activa, dirige y mantiene la conducta de la persona hacia metas o fines determinados, desarrollando estrategias que impulsen a la persona a realizar acciones y persistir en ellas para desarrollar procesos autorregulados de aprendizaje que permitan identificar necesidades y oportunidades y fortalecer el optimismo, la resiliencia y la autoeficacia."
        - "5.1. Comprender la dimensión social del ser humano, identificando los factores que influyen en el comportamiento de los grupos y la influencia de estos en los comportamientos, pensamientos y sentimientos de las personas identificando factores de cohesión social y desarrollando competencias emocionales y habilidades sociales y comunicativas para favorecer la convivencia democrática."
        - "5.2. Conocer y analizar los factores que explican los fenómenos de masas, su naturaleza, características y pautas de comportamiento de las personas en los grupos, describiendo estilos de liderazgo y analizando ventajas e inconvenientes para despertar el espíritu crítico e identificar y adoptar prácticas comunicativas favorecedoras de la cohesión social."
        - "5.3. Conocer y analizar formas actuales de interacción social con especial énfasis en entornos virtuales concienciando sobre los riesgos de fenómenos como el sexting, el grooming y la sextorsión, y sus consecuencias, y redes sociales, detectando fortalezas y debilidades, localizando indicadores de desinformación y manipulación, identificando factores de protección de la salud física y mental y afectivo-sexual y desarrollando hábitos de comportamiento favorecedores del bienestar individual y colectivo para ejercer una ciudadanía digital activa, cívica y reflexiva."
        - "6.1. Conocer las principales aportaciones de la Psicología en el campo del trabajo y su relevancia a la hora de identificar aquellos factores que influyen tanto en el rendimiento como en el bienestar personal en los contextos laborales, estableciendo analogías con el contexto académico para mejorar su rendimiento tanto a nivel individual como grupal."
        - "6.2. Identificar los distintos tipos de liderazgo y sus implicaciones en el funcionamiento de las organizaciones y el rendimiento individual y colectivo, reconociendo aquellos estilos que repercuten positivamente en el bienestar físico y mental de las personas, estableciendo analogías con el contexto académico para desarrollar estrategias de autoconocimiento y autoeficacia que favorezcan la consecución de objetivos compartidos."
        - "6.3. Comprender las principales características del funcionamiento de los grupos y equipos de trabajo, estableciendo analogías con el contexto académico, identificando aquellos elementos que garantizan el buen funcionamiento de los mismos y seleccionando y utilizando recursos digitales para el trabajo colaborativo y traspaso de la información, con el fin de ser capaz de afrontar nuevos retos con sentido crítico, evaluando fortalezas y debilidades propias y ajenas y mejorar tanto el rendimiento como la cohesión grupal."
  saberes_basicos:
    - bloque: "I. El conocimiento científico"
      cursos: ["2.º Bachillerato"]
      detalles: "1. La Psicología como la ciencia que estudia los procesos mentales: reconocimiento de las fuentes de información en términos de fiabilidad, validez, calidad y actualidad; conocimiento de elementos característicos del método científico; Psicología básica y aplicada, técnicas y métodos de investigación; descripción de las diferentes ramas de la Psicología aplicada (Psicología clínica, del aprendizaje, Psicología social y comunitaria, Psicología laboral y de las organizaciones). 2. Aportaciones más relevantes de las corrientes contemporáneas de la Psicología: elaboración del marco de referencia global de la Psicología, desde sus orígenes en Grecia (en las filosofías de Platón y Aristóteles) hasta su reconocimiento como saber independiente de la mano de autores y autoras más relevantes, definiendo las diferentes acepciones del término Psicología a lo largo de su evolución, desde el etimológico, como «ciencia del alma», a los aportados por las diferentes corrientes actuales (Conductismo, Cognitivismo, Psicoanálisis, Humanismo o Gestalt); la contribución de la mujer al desarrollo del conocimiento científico en el campo de la Psicología (Mary Whiton Calkins, Laura Perls, Mary Ainsworth, Virginia Satir, Leta Stetter Hollingworth, Anna Freud, Sybil Eysenk…); descripción, análisis y valoración del psicoanálisis, el conductismo, el estructuralismo, el funcionalismo, la psicología humanista, el cognitivismo y el constructivismo; análisis crítico de textos significativos de distintos autores y autoras para valorar las soluciones planteadas a los problemas estudiados por la Psicología."
    - bloque: "II. Fundamentos biológicos de la conducta"
      cursos: ["2.º Bachillerato"]
      detalles: "1. El sistema nervioso central: comparación entre el cerebro humano y el cerebro animal e identificación de diferencias anatómicas; descripción de la evolución del encéfalo desde el nacimiento hasta la edad adulta; análisis de la morfología neuronal y descripción del proceso de transmisión sináptica y del concepto de neuroplasticidad; descripción de la anatomía del sistema nervioso central, localización de las principales áreas y descripción de sus funciones (corteza cerebral, sistema límbico…). 2. El sistema endocrino: descripción de su estructura, comprensión de la influencia de las hormonas en la conducta y la respuesta emocional, e identificación de estilos de vida saludables que favorecen su buen funcionamiento. 3. Genética: definición de genética, comprensión de la base genética del comportamiento humano y de la influencia de la genética y el ambiente en la conformación de la personalidad y la aparición de algunos trastornos psicológicos."
    - bloque: "III. Procesos psicológicos básicos: percepción, atención y memoria"
      cursos: ["2.º Bachillerato"]
      detalles: "1. Percepción: identificación de los procesos perceptivos y de los diferentes elementos que intervienen en el fenómeno de la percepción (estímulo, sentido, sensación y umbrales de percepción) y reconocimiento de las fases del proceso perceptivo (excitación, transducción, transmisión y recepción); análisis de las teorías explicativas de la percepción (Asociacionismo, Gestalt, Cognitivismo y NeuroPsicología); distinción de diferentes tipos de ilusiones ópticas diferenciándolas de los trastornos perceptivos como las alucinaciones y la agnosia. 2. Atención y memoria: análisis del funcionamiento de la memoria identificando las características de los diferentes tipos de memoria; valoración de los procesos de atención y concentración implicados en el funcionamiento de la memoria e identificación de alteraciones de la atención; comprensión del concepto de olvido y sus causas, distorsiones y alteraciones de la memoria."
    - bloque: "IV. Procesos cognitivos complejos: aprendizaje, inteligencia y pensamiento"
      cursos: ["2.º Bachillerato"]
      detalles: "1. Aprendizaje: comparación de las diferentes teorías del aprendizaje (Condicionamiento clásico -Pavlov y Watson-, Conductismo -Skinner-, Psicología cognitiva -Baddeley, Bruner, Broadbent, Ebbinghaus…-, Constructivismo -Piaget-, Aprendizaje social -Bandura-, Constructivismo social -Vigotsky-, Aprendizaje Experiencial -Carl Rogers-, Inteligencias múltiples -Howard Gardner-); análisis de los factores que influyen en el aprendizaje (inteligencia, conocimientos previos, experiencia y motivación); comprensión y explicación de las diferentes teorías de la motivación (Freud, Conductismo, Teoría de la jerarquía de las necesidades de Maslow, Teoría del factor dual de Herber, Teoría de los tres factores); definición y comprensión del concepto de motivación intrínseca y extrínseca; relación de la motivación, las metas, las expectativas y el control personal. 2. Inteligencia: definición del concepto de inteligencia y reflexión sobre su evolución a lo largo de la historia, comprendiendo teorías actuales (Piaget, la teoría factorial de Spearman, la multifactorial de Thurstone y las de Cattell, Vernon, Sternberg, Gardner, etc.); comprensión de las aportaciones de los autores de referencia en inteligencia emocional (Goleman, Mayer y Salovey) y descripción de las principales estrategias de regulación emocional; definición de inteligencia emocional, funciones y clasificación de las emociones; comprensión del concepto de frustración, identificación de causas y estrategias para superarla; definición de inteligencia artificial, análisis y reflexión sobre sus implicaciones sociales, éticas y filosóficas y debate sobre las consecuencias de la brecha de datos de género, descripción y conocimiento de sus aplicaciones. 3. Pensamiento: definición de pensamiento, clasificación de tipos de pensamiento y relación entre pensamiento y lenguaje y pensamiento y emociones; comprensión del papel del razonamiento y el pensamiento creativo en la solución de problemas y la toma de decisiones."
    - bloque: "V. El ser humano como ser social"
      cursos: ["2.º Bachillerato"]
      detalles: "1. Reconocimiento de la influencia de factores ambientales y socioculturales en los procesos perceptuales (motivación, actitudes, intereses) y en la conformación de la personalidad. 2. Definición de autoconcepto y autoestima, identificación de factores que influyen en su conformación y de estrategias para la construcción de un autoconcepto positivo y una autoestima ajustada. 3. Definición del concepto de grupos, los roles y su influencia en el comportamiento de las personas. 4. Conocimiento sobre el proceso de formación de la percepción de los otros: formación de impresiones, proceso de atribución y atracción. 5. Definición de actitud, reconocimiento de la influencia de los grupos sociales en las actitudes personales, comprensión de los principales modelos y características de las actitudes y formación de las mismas. 6. Comprensión y debate sobre el poder de la persuasión, el contagio de sentimientos y emociones que se producen en las masas y sus efectos sobre la conducta individual, sus beneficios y riesgos para la cohesión social e identificación de estrategias de prevención de la crispación social. 7. Reconocimiento de las implicaciones del desarrollo tecnológico en las nuevas formas de interacción social, concienciando sobre los riesgos de fenómenos como el sexting, el grooming y la sextorsión y sus consecuencias, y debate sobre sus ventajas e inconvenientes y sus implicaciones en el bienestar físico, mental y afectivo de las personas. 8. Identificación y aplicación de estrategias y medidas para el uso seguro de internet, incluyendo la prevención de prácticas sexuales virtuales de riesgo, y comprensión de conceptos como huella digital, identidad digital, netiqueta, etc. 9. Comprensión del proceso de toma de decisiones y el papel que juegan las emociones, las recompensas y la anticipación de estas últimas en las decisiones. 10. Comprensión del concepto de salud mental, trastorno mental y enfermedad mental y debate sobre la percepción social de la enfermedad mental. 11. Valoración de la importancia que tiene en el desarrollo y maduración del individuo la afectividad y la sexualidad, como dimensiones esenciales del ser humano, describiendo los aspectos fundamentales de la psicología de la sexualidad (fisiología de la respuesta sexual, conducta sexual segura y respetuosa, etc.)."
    - bloque: "VI. El trabajo y las organizaciones"
      cursos: ["2.º Bachillerato"]
      detalles: "1. Descripción de los distintos tipos de organizaciones y su clasificación en función de diferentes criterios (fin, tamaño, sector y forma jurídica). 2. Identificación y descripción de elementos característicos de los grupos de trabajo, equipos de trabajo y equipos de alto rendimiento. 3. Descripción de los conceptos de eficacia y eficiencia y comprensión de la relación entre estrés y rendimiento. 4. Identificación de diferentes estilos de liderazgo y debate sobre su repercusión en el rendimiento y bienestar laboral de las personas. 5. Comprensión del concepto de cultura emprendedora. 6. Debate sobre el impacto del avance tecnológico en las nuevas formas de funcionamiento de equipos y organizaciones, ventajas e inconvenientes. 7. Conocimiento, selección y aplicación de Tecnologías de la Información y la Comunicación (TIC), Tecnologías de Aprendizaje y Conocimiento (TAC) y Tecnologías del Empoderamiento y la Participación (TEP). 8. Debate sobre las implicaciones de las políticas de igualdad en materia de trabajo (conciliación familiar, brecha salarial, etc.) e identificación de los principales problemas de salud laboral: el estrés, la ansiedad, el mobbing y el síndrome de burnout, etc."
