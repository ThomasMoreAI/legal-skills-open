observaciones: "Materia optativa de 2.º de Bachillerato en Canarias. Re-extracción del 2026-08-05: las 6 competencias específicas llevan enunciado_oficial literal y descriptores operativos (DEC-0008); la materia solo se imparte en 2.º de Bachillerato, así que 'descriptores' lleva una única clave de curso. Extracción completada el 2026-08-05: los 17 criterios de evaluación y los saberes básicos (seis bloques) se han volcado íntegros a partir de texto-oficial-CUR-056-psicologia.txt. Se han normalizado espacios erróneos insertados por la extracción del PDF antes de vocales acentuadas y alguna coma duplicada, sin alterar el contenido; se ha respetado literalmente el nombre 'Herber' (así en el decreto) al citar la teoría del factor dual. Los cuatro elementos de DEC-0004 (competencias específicas, descriptores operativos, criterios de evaluación y saberes básicos) están completos."
