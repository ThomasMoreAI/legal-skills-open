observaciones: "Materia optativa de oferta obligatoria en 1.º de Bachillerato en Canarias. Re-extracción del 2026-08-05: las 5 competencias específicas llevan enunciado_oficial literal y descriptores operativos (DEC-0008); la materia solo se imparte en 1.º de Bachillerato, así que 'descriptores' lleva una única clave de curso. El propio decreto usa la locución 'de la mujeres' (sic) en el enunciado literal de C4. Extracción completada el 2026-08-05: los 17 criterios de evaluación y los saberes básicos (tres bloques) se han volcado íntegros a partir de texto-oficial-CUR-055-historia-canarias.txt. Se han normalizado espacios erróneos insertados por la extracción del PDF antes de vocales acentuadas (p. ej. 'informaci ón' → 'información'), sin alterar el contenido. Los cuatro elementos de DEC-0004 (competencias específicas, descriptores operativos, criterios de evaluación y saberes básicos) están completos."
