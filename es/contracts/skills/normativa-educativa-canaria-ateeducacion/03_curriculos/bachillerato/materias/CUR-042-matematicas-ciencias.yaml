resumen_ia: "Currículo de Matemáticas I y II en Bachillerato Canarias, modalidad de Ciencias y Tecnología, regulado por el Decreto 30/2023, con nueve competencias específicas (C1-C9) impartidas en 1.º y 2.º de Bachillerato, y diecisiete criterios de evaluación por curso. Las competencias se agrupan en cinco bloques competenciales del decreto (C1+C2, C3+C4, C5+C6, C7+C8 y C9), que comparten un mismo listado de descriptores operativos por curso. Saberes organizados en seis bloques: sentido numérico, de la medida, espacial, algebraico, estocástico y socioafectivo."
observaciones: "Extracción completada el 2026-08-05 a partir del texto oficial 07_corpus_ia/textos-completos/texto-oficial-NOR-005-decreto-30-2023.txt (introducción de las 9 competencias líneas ~62345-62488; 1.º Bachillerato líneas ~62626-62878; 2.º Bachillerato líneas ~63011-63270). [INTERPRETACIÓN] El decreto agrupa las nueve competencias específicas en cinco bloques competenciales (tablas), y el bloque de descriptores operativos que figura junto al enunciado se aplica conjuntamente a las dos competencias que comparten bloque (C1+C2, C3+C4, C5+C6, C7+C8); C9 va sola. Se ha asignado ese mismo descriptor de bloque a cada competencia del par, siguiendo la misma convención que aplica la herramienta de auditoría 11_calidad/extraer_descriptores.py."
