observaciones: "Materia optativa de 1.º de Bachillerato en Canarias. Re-extracción del 2026-08-05: las 5 competencias específicas llevan enunciado_oficial literal y descriptores operativos (DEC-0008); la materia solo se imparte en 1.º de Bachillerato, así que 'descriptores' lleva una única clave de curso. Extracción completada el 2026-08-05: los 16 criterios de evaluación y los saberes básicos (cuatro bloques) se han volcado íntegros a partir de texto-oficial-CUR-058-cultura-cientifica.txt. Se ha eliminado una 't' suelta insertada por la extracción del PDF en el criterio 1.1 ('conclusiones lógicas, t valorando' → 'conclusiones lógicas, valorando') y se han normalizado espacios erróneos antes de vocales acentuadas, sin alterar el contenido; el saber II.2 repite literalmente 'contaminación lumínica' en dos subapartados (2.4.1 y 2.4.3), así en el propio decreto, y se ha conservado tal cual con nota aclaratoria. Los cuatro elementos de DEC-0004 (competencias específicas, descriptores operativos, criterios de evaluación y saberes básicos) están completos."
