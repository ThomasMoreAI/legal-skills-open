observaciones: "Extracción completada el 2026-08-05 a partir de 07_corpus_ia/textos-completos/texto-oficial-CUR-045-historia-espana.txt (texto plano oficial del PDF curricular Historia de España, FTE-012/FTE-009). Las 8 competencias específicas llevan enunciado_oficial literal y descriptores operativos (DEC-0008); la materia solo se imparte en 2.º de Bachillerato. criterios_evaluacion recoge los 26 criterios oficiales (3+3+4+4+4+3+3+2), con id y texto literal completo. saberes_basicos recoge íntegros los tres bloques oficiales (I. Sociedades en el tiempo; II. Retos del mundo actual; III. Compromiso cívico), preservando la numeración original del decreto. Los cuatro elementos de DEC-0004 quedan completos."
