resumen_ia: "Currículo de Lengua Castellana y Literatura I y II en Bachillerato Canarias (materia común), regulado por el Decreto 30/2023, con diez competencias específicas (C1-C10) impartidas en 1.º y 2.º de Bachillerato, y veinte criterios de evaluación (diez por curso). Los enunciados de las competencias son idénticos en ambos cursos; varían los criterios de evaluación (mayor exigencia en 2.º) y, puntualmente, algún descriptor operativo. Saberes organizados en cuatro bloques: la lengua y sus hablantes, comunicación, educación literaria y reflexión sobre la lengua. Foco propio de Canarias en la variedad dialectal canaria y en la literatura canaria."
observaciones: "Extracción completada el 2026-08-05 a partir del texto oficial 07_corpus_ia/textos-completos/texto-oficial-NOR-005-decreto-30-2023.txt (1.º Bachillerato líneas ~57324-57858; 2.º Bachillerato líneas ~58028-58564). Competencias con enunciado literal, descriptores por curso y los veinte criterios de evaluación oficiales (diez por curso)."
