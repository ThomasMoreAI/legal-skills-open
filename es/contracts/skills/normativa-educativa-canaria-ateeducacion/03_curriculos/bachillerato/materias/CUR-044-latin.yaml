observaciones: "Extracción completada el 2026-08-05 a partir de 07_corpus_ia/textos-completos/texto-oficial-CUR-044-latin.txt (texto plano oficial del PDF curricular Latín I y II, FTE-012/FTE-009). Las 5 competencias específicas llevan enunciado_oficial literal y descriptores operativos por curso (DEC-0008), idénticos en 1.º y 2.º de Bachillerato. criterios_evaluacion recoge los 12 criterios de 1.º Bachillerato (4+2+2+2+2) y los 11 de 2.º Bachillerato (3+2+2+2+2), agrupados por curso con id y texto literal completo. saberes_basicos recoge íntegros los cinco bloques oficiales (I. El texto: comprensión y traducción; II. Plurilingüismo; III. Educación literaria; IV. La antigua Roma; V. Legado y patrimonio) para cada uno de los dos cursos, preservando la numeración original del decreto, incluida la errata literal 'la función de de cada uno' del Bloque IV. Los cuatro elementos de DEC-0004 quedan completos."
