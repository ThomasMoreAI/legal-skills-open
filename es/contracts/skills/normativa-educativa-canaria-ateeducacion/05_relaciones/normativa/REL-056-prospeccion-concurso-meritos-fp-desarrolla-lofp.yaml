descripcion: "La Resolución n.º 268/2026 desarrolla la figura del prospector y los perfiles colaboradores de la LOOIFP al regular las funciones de prospección en FP y convocar el concurso de méritos para el nombramiento de docentes en Canarias 2026/2027."
