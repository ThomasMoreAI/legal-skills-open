<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <style>
      .title  { font: 700 88px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif; fill: #ffffff; }
      .sub    { font: 500 32px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif; fill: #cbd5e1; }
      .num    { font: 800 64px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif; fill: url(#accent); }
      .label  { font: 500 20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif; fill: #94a3b8; letter-spacing: 2px; text-transform: uppercase; }
      .pill   { font: 600 22px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0b1220; }
      .small  { font: 500 22px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <g opacity="0.10" transform="translate(1040,80)">
    <path d="M 80 0 L 80 220" stroke="#5eead4" stroke-width="6" fill="none"/>
    <path d="M 20 60 L 140 60" stroke="#5eead4" stroke-width="6" fill="none"/>
    <circle cx="20" cy="60" r="42" stroke="#5eead4" stroke-width="6" fill="none"/>
    <circle cx="140" cy="60" r="42" stroke="#5eead4" stroke-width="6" fill="none"/>
    <rect x="60" y="220" width="40" height="14" fill="#5eead4"/>
  </g>

  <text class="label" x="80" y="110">Open · Apache-2.0 · SKILL.md format</text>

  <text class="title" x="80" y="220">Legal Skills (Open)</text>

  <text class="sub" x="80" y="280">Open-source legal skills for AI agents</text>
  <text class="sub" x="80" y="324">(Claude · Cursor · ChatGPT · Anthropic Skills · MCP)</text>

  <g transform="translate(80,420)">
    <text class="num" x="0" y="0">3,500+</text>
    <text class="label" x="0" y="36">Skills</text>

    <text class="num" x="320" y="0">39</text>
    <text class="label" x="320" y="36">Jurisdictions</text>

    <text class="num" x="560" y="0">200+</text>
    <text class="label" x="560" y="36">Practice plugins</text>
  </g>

  <g transform="translate(80,560)">
    <rect x="0" y="0" rx="22" ry="22" width="308" height="44" fill="url(#accent)"/>
    <text class="pill" x="22" y="29">github.com/ThomasMoreAI</text>
  </g>

  <text class="small" x="408" y="590">legal-ai · legaltech · mcp · claude-skills</text>
</svg>
