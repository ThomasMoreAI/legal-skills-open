    <svg id="screen" width="1176" height="612" viewBox="0 0 1176 612" preserveAspectRatio="xMidYMin slice">
    <rect class="background" height="100%" width="100%" x="0" y="0"/><defs><g id="g1"><text x="0" textLength="512" font-weight="bold" class="foreground">&#9556;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9559;</text></g><g id="g2"><text x="0" textLength="512" font-weight="bold" class="foreground">&#9553;         EU AI ACT RISK CLASSIFIER  v1.0                      &#9553;</text></g><g id="g3"><text x="0" textLength="512" font-weight="bold" class="foreground">&#9553;         Regulation (EU) 2024/1689 &#183; github.com/marcoderoni   &#9553;</text></g><g id="g4"><text x="0" textLength="512" font-weight="bold" class="foreground">&#9562;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9565;</text></g><g id="g5"><text x="0" textLength="32" class="foreground">    </text></g><g id="g6"><text x="0" textLength="8" class="background"> </text></g><g id="g7"><text x="0" textLength="80" font-weight="bold" class="foreground">AI SYSTEM:</text></g><g id="g8"><text x="0" textLength="408" class="foreground">  HR tool that screens CVs and ranks job applicants</text></g><g id="g9"><text x="0" textLength="496" class="foreground">&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;</text></g><g id="g10"><text x="0" textLength="168" font-weight="bold" class="foreground">CLASSIFICATION RESULT</text></g><g id="g11"><text x="0" textLength="168" class="foreground">  &#9888;   Risk Level   : </text><text x="168" textLength="72" font-weight="bold" class="color11">HIGH-RISK</text></g><g id="g12"><text x="0" textLength="200" class="foreground">  &#128202;  Confidence   : HIGH</text></g><g id="g13"><text x="0" textLength="872" class="foreground">  &#128220;  Legal Basis  : Annex III, paragraph 4(a) - Employment, workers management and access to self-employment</text></g><g id="g14"><text x="0" textLength="1176" class="foreground">  &#128193;  Annex III    : 4. EMPLOYMENT &amp; WORKERS - AI systems intended to be used for recruitment or selection of natural persons, in particular to pla</text></g><g id="g15"><text x="0" textLength="784" class="foreground">ce targeted job advertisements, to analyse and filter job applications, and to evaluate candidates</text></g><g id="g16"><text x="0" textLength="128" font-weight="bold" class="foreground">KEY OBLIGATIONS:</text></g><g id="g17"><text x="0" textLength="688" class="foreground">  &#8226; Establish and maintain a risk management system throughout the AI system lifecycle</text></g><g id="g18"><text x="0" textLength="736" class="foreground">  &#8226; Ensure data governance with high-quality, relevant, and representative training datasets</text></g><g id="g19"><text x="0" textLength="472" class="foreground">  &#8226; Maintain technical documentation demonstrating complian</text><text x="472" textLength="8" class="background"> </text></g><g id="g20"><text x="0" textLength="680" class="foreground">  &#8226; Maintain technical documentation demonstrating compliance before market placement</text></g><g id="g21"><text x="0" textLength="552" class="foreground">  &#8226; Implement automatic logging of system operations for traceability</text></g><g id="g22"><text x="0" textLength="848" class="foreground">  &#8226; Enable effective human oversight to prevent or minimise risks to health, safety, or fundamental rights</text></g><g id="g23"><text x="0" textLength="168" font-weight="bold" class="foreground">PROVIDER OBLIGATIONS:</text></g><g id="g24"><text x="0" textLength="520" class="foreground">  &#8226; Conduct conformity assessment before placing system on market</text></g><g id="g25"><text x="0" textLength="472" class="foreground">  &#8226; Register system in EU database for high-risk AI systems</text></g><g id="g26"><text x="0" textLength="464" class="foreground">  &#8226; Affix CE marking upon successful conformity assessment</text></g><g id="g27"><text x="0" textLength="568" class="foreground">  &#8226; Implement quality management system covering all compliance aspects</text></g><g id="g28"><text x="0" textLength="408" class="foreground">  &#8226; Provide clear instructions for use to deployers</text></g><g id="g29"><text x="0" textLength="696" class="foreground">  &#8226; Establish post-market monitoring system and report serious incidents within 15 days</text></g><g id="g30"><text x="0" textLength="168" font-weight="bold" class="foreground">DEPLOYER OBLIGATIONS:</text></g><g id="g31"><text x="0" textLength="600" class="foreground">  &#8226; Implement appropriate human oversight measures with competent personnel</text></g><g id="g32"><text x="0" textLength="720" class="foreground">  &#8226; Ensure input data is relevant and sufficiently representative for the intended purpose</text></g><g id="g33"><text x="0" textLength="688" class="foreground">  &#8226; Monitor system operation and report serious incidents to providers and authorities</text></g><g id="g34"><text x="0" textLength="536" class="foreground">  &#8226; Conduct a fundamental rights impact assessment (FRIA) before de</text><text x="536" textLength="8" class="background"> </text></g><g id="g35"><text x="0" textLength="600" class="foreground">  &#8226; Conduct a fundamental rights impact assessment (FRIA) before deployment</text></g><g id="g36"><text x="0" textLength="624" class="foreground">  &#8226; Inform workers' representatives and affected employees about AI system use</text></g><g id="g37"><text x="0" textLength="616" class="foreground">  &#8226; Maintain logs automatically generated by the system for at least 6 months</text></g><g id="g38"><text x="0" textLength="168" font-weight="bold" class="foreground">COMPLIANCE DEADLINES:</text></g><g id="g39"><text x="0" textLength="688" class="foreground">  2 August 2026 - Full application of high-risk AI system requirements under Annex III</text></g><g id="g40"><text x="0" textLength="64" font-weight="bold" class="foreground">CAVEATS:</text></g><g id="g41"><text x="0" textLength="1176" class="foreground">  If the CV screening system makes or materially influences hiring decisions without meaningful human review, enhanced scrutiny applies. Systems th</text></g><g id="g42"><text x="0" textLength="1176" class="foreground">at process biometric data or infer protected characteristics (e.g., ethnicity, disability) may trigger additional prohibitions under Article 5. Wor</text></g><g id="g43"><text x="0" textLength="760" class="foreground">ks councils or employee representatives may have consultation rights under national labour law.</text></g><g id="g44"><text x="0" textLength="120" font-weight="bold" class="foreground">RECOMMENDATION:</text></g><g id="g45"><text x="0" textLength="528" class="foreground">  Initiate conformity assessment process immediately: (1) complete</text></g><g id="g46"><text x="0" textLength="504" class="foreground">  technical documentation per Annex IV, (2) conduct fundamental</text></g><g id="g47"><text x="0" textLength="456" class="foreground">  rights impact assessment, (3) implement human oversight</text></g><g id="g48"><text x="0" textLength="472" class="foreground">  protocols ensuring meaningful human review of all ranking</text></g><g id="g49"><text x="0" textLength="248" class="foreground">  decisions, (4) audit training</text><text x="248" textLength="8" class="background"> </text></g><g id="g50"><text x="0" textLength="496" class="foreground">  decisions, (4) audit training data for bias across protected</text></g><g id="g51"><text x="0" textLength="496" class="foreground">  characteristics, and (5) engage with notified body if third-</text></g><g id="g52"><text x="0" textLength="224" class="foreground">  party assessment required.</text></g><g id="g53"><text x="0" textLength="456" class="foreground">  Generated: 2026-04-30 00:57 | EU AI Act Classifier v1.0</text></g></defs><g id="screen_view"><g><use xlink:href="#g1" y="17"/><use xlink:href="#g2" y="34"/><use xlink:href="#g3" y="51"/><use xlink:href="#g4" y="68"/><use xlink:href="#g5" y="85"/><rect x="0" y="102" width="8" height="17" class="foreground"/><use xlink:href="#g6" y="102"/></g><g><use xlink:href="#g1" y="663"/><use xlink:href="#g2" y="680"/><use xlink:href="#g3" y="697"/><use xlink:href="#g4" y="714"/><use xlink:href="#g5" y="731"/><use xlink:href="#g7" y="765"/><use xlink:href="#g8" y="782"/><use xlink:href="#g9" y="816"/><use xlink:href="#g10" y="850"/><use xlink:href="#g11" y="884"/><use xlink:href="#g12" y="901"/><use xlink:href="#g13" y="918"/><use xlink:href="#g14" y="935"/><use xlink:href="#g15" y="952"/><use xlink:href="#g16" y="986"/><use xlink:href="#g17" y="1003"/><use xlink:href="#g18" y="1020"/><rect x="472" y="1037" width="8" height="17" class="foreground"/><use xlink:href="#g19" y="1037"/></g><g><use xlink:href="#g4" y="1292"/><use xlink:href="#g5" y="1309"/><use xlink:href="#g7" y="1343"/><use xlink:href="#g8" y="1360"/><use xlink:href="#g9" y="139