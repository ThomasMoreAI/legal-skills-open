name: Versions

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Versão única entre SKILL.md, comandos, CHANGELOG e tag
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash scripts/tests/test-versions.sh "$TAG"
