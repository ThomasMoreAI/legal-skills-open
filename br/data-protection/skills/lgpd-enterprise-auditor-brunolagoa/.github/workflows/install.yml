name: Installer

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: ShellCheck
        run: shellcheck scripts/install.sh scripts/update-example-report.sh scripts/update-skill-catalog.sh scripts/tests/test-install.sh scripts/tests/test-versions.sh scripts/tests/test-html-report.sh scripts/tests/test-framework.sh scripts/tests/run-all.sh

  bash:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          # /bin/bash do macOS é a 3.2: é o que roda no "curl | bash" de quem usa Mac.
          - os: macos-latest
            bash: /bin/bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Testes do install.sh
        env:
          BASH_BIN: ${{ matrix.bash }}
        run: ${{ matrix.bash }} scripts/tests/test-install.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Testes do install.ps1 (PowerShell 7)
        shell: pwsh
        run: ./scripts/tests/test-install.ps1
      # Windows PowerShell 5.1 é o padrão do Windows; roda mesmo se o passo anterior falhar.
      - name: Testes do install.ps1 (Windows PowerShell 5.1)
        if: success() || failure()
        shell: powershell
        run: ./scripts/tests/test-install.ps1
